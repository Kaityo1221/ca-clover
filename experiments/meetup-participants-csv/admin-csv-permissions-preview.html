<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CA Clover | CSV権限 管理画面の独立モック</title>
<style>
 :root{font-family:Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#365314;background:#f8fce9;color-scheme:light}
 *{box-sizing:border-box}
 body{margin:0;padding:22px 16px 60px;background:linear-gradient(165deg,#f7fee7,#fffef9)}
 main{max-width:780px;margin:auto}
 .tag{display:inline-block;font-size:11px;font-weight:900;border-radius:100px;background:#d9f99d;color:#365314;padding:6px 12px}
 h1{font-size:25px;line-height:1.25;font-weight:900;margin:14px 0 5px}
 p{line-height:1.65;font-size:13px;color:#64748b}
 .notice{background:#fff;border:1px solid #d9f99d;border-radius:18px;padding:13px 16px;font-size:12px;color:#4d7c0f}
 .account-list{display:grid;gap:12px;margin-top:20px}
 .account{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid #ecfccb;border-radius:24px;padding:18px 20px;box-shadow:0 9px 26px #3653140b}
 .name{font-weight:900;font-size:15px;color:#365314}
 .meta{font-weight:700;font-size:11px;color:#64748b;margin-top:7px}
 .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
 .permission{font-size:11px;font-weight:900;border-radius:100px;padding:7px 10px;background:#f1f5f9;color:#64748b}
 .permission.on{background:#ecfccb;color:#4d7c0f}
 button{min-height:44px;min-width:118px;padding:9px 14px;border:1px solid #bef264;border-radius:14px;background:#fff;color:#4d7c0f;font-size:12px;font-weight:900;cursor:pointer}
 button.active{background:#a3e635;color:#365314}
 button:disabled{opacity:.40;cursor:not-allowed}
 button:focus-visible{outline:3px solid #84cc16;outline-offset:2px}
 #feedback{font-size:12px;color:#4d7c0f;margin-top:16px;min-height:20px}
</style>
</head>
<body>
<main>
  <span class="tag">ACCOUNTS / 独立モック</span>
  <h1>👥 CAアカウント</h1>
  <p>現行ADMINのCAアカウント画面に、既存S権限とは別の「CSV権限」を追加する想定です。</p>
  <div class="notice"><strong>デモ専用。</strong> 架空のCAのみ表示します。ON/OFFはこのページ内でしか反映されません。Supabase・認証・管理APIへの接続はありません。</div>
  <section id="accounts" class="account-list" aria-label="架空CAのCSV権限"></section>
  <p id="feedback" role="status" aria-live="polite"></p>
  <p>本番ではADMINの本人確認、権限変更の監査記録、利用者の再取得時の権限反映、CSV出力時のサーバー再検査が必要です。既存のS権限とCommunityの割り当ては変更しません。</p>
</main>
<script type="module" src="./admin-csv-permissions-preview.mjs"></script>
</body>
</html>
