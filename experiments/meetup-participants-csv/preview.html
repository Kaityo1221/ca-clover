<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CA Clover Meetup CSV | 独立モック</title>
<style>
  :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif; color: #27342e; background: #f6f8f4; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; }
  .frame { margin: 0 auto; max-width: 460px; }
  .top { display: flex; justify-content: space-between; align-items: center; padding: 8px 2px 12px; }
  h1 { font-size: 24px; letter-spacing: -.035em; margin: 0; }
  .clover { color: #42a46a; }
  .tag { color: #346f4b; background: #e9f5ec; border: 1px solid #cce6d2; border-radius: 30px; padding: 6px 10px; font-size: 12px; font-weight: 700; }
  .section { margin: 16px 1px 10px; display: flex; justify-content: space-between; align-items: baseline; }
  .section h2 { margin: 0; font-size: 18px; }
  .hint { color: #748179; font-size: 12px; }
  .notice { background: #fff; border: 1px solid #e3eae3; padding: 13px 15px; border-radius: 12px; font-size: 13px; line-height: 1.7; }
  .meetups { display: grid; gap: 10px; }
  .meetup-card { border: 1px solid #dfe8df; position: relative; background: #fff; border-radius: 15px; box-shadow: 0 2px 10px rgba(45, 72, 50, .035); padding: 13px 14px 11px; }
  .card-primary { appearance: none; width: 100%; padding: 0 78px 9px 0; margin: 0; border: 0; background: none; font: inherit; text-align: left; color: inherit; cursor: pointer; }
  .card-primary:focus-visible, .csv-button:focus-visible { outline: 3px solid #70bd8b; outline-offset: 2px; }
  .date { color: #7b8880; font-size: 12px; line-height: 1.5; }
  .title { font-size: 14px; font-weight: 700; margin-top: 5px; line-height: 1.5; overflow-wrap: anywhere; }
  .status { position: absolute; right: 14px; top: 14px; background: #f0f5f0; color: #657568; padding: 4px 8px; border-radius: 5px; font-size: 11px; }
  .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #eef1eb; padding-top: 9px; gap: 8px; }
  .stats { display: flex; gap: 18px; }
  .stat { display: flex; flex-direction: column; gap: 3px; }
  .stat-label { color: #7c8a80; font-size: 11px; }
  .stat-value { font-size: 17px; font-variant-numeric: tabular-nums; line-height: 1.25; }
  .stat-value.green { color: #2c9863; }
  .csv-button { border: 1px solid #c9dccf; background: #edf6ee; color: #23774a; font-size: 12px; font-weight: 800; border-radius: 9px; min-width: 85px; min-height: 44px; padding: 8px 10px; cursor: pointer; }
  .csv-button:hover { background: #ddefe1; }
  .csv-button:disabled { opacity: .6; cursor: wait; }
  .demo-control { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 2px; margin-bottom: 8px; font-size: 13px; }
  .demo-control select { min-height: 40px; border: 1px solid #c9dccf; border-radius: 8px; padding: 6px 10px; background: white; color: inherit; font: inherit; max-width: 65%; }
  .footnote, #feedback { color: #64756a; font-size: 12px; line-height: 1.65; }
  #feedback { min-height: 24px; margin-top: 14px; }
  .footnote { margin-top: 14px; }
  dialog { border: 1px solid #dfe9e1; border-radius: 14px; max-width: 380px; width: calc(100vw - 36px); box-shadow: 0 16px 45px rgba(0, 0, 0, .15); }
  dialog::backdrop { background: rgba(21, 38, 29, .4); }
  dialog h2 { font-size: 17px; margin: 4px 0 12px; }
  #detail-text { white-space: pre-wrap; line-height: 1.6; }
  #close-detail { background: #e9f5ec; color: #26734a; border: 0; border-radius: 9px; padding: 10px 24px; font: inherit; font-weight: 700; min-height: 44px; }
</style>
</head>
<body>
<main class="frame">
  <header class="top">
    <h1><span class="clover">🍀</span> My Community</h1>
    <span class="tag">CSV試作 v1</span>
  </header>
  <div class="notice">
    <strong>独立モック（本番未接続）</strong><br>
    この画面に表示されるMeetup名・参加者・人数はすべて架空のサンプルです。CSVボタンはローカルの模擬データからダウンロードを試せます。
  </div>
  <div class="section"><h2>Meetup履歴</h2><span class="hint">コンパクト表示</span></div>
  <div class="demo-control"><label for="demo-mode"><strong>動作シミュレーション</strong></label><select id="demo-mode" aria-label="CSV操作の模擬状態"><option value="normal">正常取得</option><option value="busy">混雑時（429）</option><option value="incomplete">一部取得失敗</option><option value="timeout">タイムアウト</option></select></div>
  <section id="cards" class="meetups" aria-label="Meetupカード一覧"></section>
  <p id="feedback" role="status" aria-live="polite"></p>
  <p class="footnote">カードのタイトルで模擬詳細、CSVボタンで試作ダウンロード。動作シミュレーションで混雑・取得漏れ・タイムアウトを確認できます。サーバー全体の同時実行制限は未実装です。Campfire API通信・Supabase通信・実データ保存はありません。</p>
</main>
<dialog id="detail" aria-label="Meetup詳細">
  <h2>Meetup詳細（試作）</h2>
  <p id="detail-text"></p>
  <button id="close-detail" type="button">閉じる</button>
</dialog>
<script type="module" src="./preview.mjs"></script>
</body>
</html>
