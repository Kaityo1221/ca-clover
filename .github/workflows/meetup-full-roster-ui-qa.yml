name: Meetup roster UI isolated no-deploy QA
on:
  push:
    branches: [qa/meetup-full-roster-ui-20261110, qa/meetup-roster-secure-download-ui-20261110]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test scripts/qa/meetup-full-roster-ui.test.mjs
      - run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - run: npx tsc --noEmit
