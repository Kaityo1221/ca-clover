name: Public/Private Boundary CI
on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'docs/**'
      - 'scripts/ci/verify-public-boundary.mjs'
      - '.github/workflows/public-boundary-ci.yml'
      - 'package.json'
      - 'src/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Fail if internal backend code enters the public branch
        run: node scripts/ci/verify-public-boundary.mjs
      - name: Check current frontend build (no production credentials)
        run: npm run build
