name: One-time fix startup render 20260926

on:
  push:
    branches: [pages]
    paths:
      - .github/workflows/one-time-fix-startup-render-20260926.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages
      - name: Patch startup auth render
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/index.html')
          text = path.read_text(encoding='utf-8')

          text = text.replace('const VERSION="my-community-20260925";', 'const VERSION="my-community-20260926-init1";', 1)

          old_state = '  let session=null, profile=null, permissions=new Set(), busy=false, flash=null, communityPeriod=30;'
          new_state = '  let session=null, profile=null, permissions=new Set(), busy=false, flash=null, communityPeriod=30, renderToken=0;'
          if old_state not in text:
              raise SystemExit('state declaration not found')
          text = text.replace(old_state, new_state, 1)

          old_init = (
              '  async function init(){\n'
              '    const got=await client.auth.getSession();\n'
              '    session=got.data.session||null;\n'
              '    if(session)await loadProfile();\n'
              '    client.auth.onAuthStateChange(async function(_event,newSession){\n'
              '      session=newSession||null;\n'
              '      if(session)await loadProfile();else {profile=null;permissions=new Set()}\n'
              '      render();\n'
              '    });\n'
              '    window.addEventListener("hashchange",function(){flash=null;render()});\n'
              '    render();\n'
              '  }'
          )
          new_init = (
              '  async function init(){\n'
              '    const got=await client.auth.getSession();\n'
              '    session=got.data.session||null;\n'
              '    if(session)await loadProfile();\n'
              '    client.auth.onAuthStateChange(async function(event,newSession){\n'
              '      const previousUserId=session&&session.user?session.user.id:null;\n'
              '      const nextSession=newSession||null;\n'
              '      const nextUserId=nextSession&&nextSession.user?nextSession.user.id:null;\n'
              '      session=nextSession;\n'
              '      if(event==="INITIAL_SESSION"&&previousUserId===nextUserId)return;\n'
              '      if((event==="SIGNED_IN"||event==="TOKEN_REFRESHED")&&previousUserId&&previousUserId===nextUserId)return;\n'
              '      renderToken++;\n'
              '      if(session)await loadProfile();else {profile=null;permissions=new Set()}\n'
              '      render();\n'
              '    });\n'
              '    window.addEventListener("hashchange",function(){flash=null;render()});\n'
              '    render();\n'
              '  }'
          )
          if old_init not in text:
              raise SystemExit('init block not found')
          text = text.replace(old_init, new_init, 1)

          old_decl = '  async function renderMy(){'
          new_decl = '  async function renderMy(token){'
          if old_decl not in text:
              raise SystemExit('renderMy declaration not found')
          text = text.replace(old_decl, new_decl, 1)

          start = text.index(new_decl)
          end = text.index('  async function renderCommunity(', start)
          segment = text[start:end]
          paint = '    app.innerHTML=html+\'<div class="version">mirror \'+VERSION+\'</div>\';\n'
          paint_pos = segment.rfind(paint)
          if paint_pos < 0:
              raise SystemExit('renderMy final paint not found')
          segment = segment[:paint_pos] + '    if(token!=null&&token!==renderToken)return;\n' + segment[paint_pos:]
          text = text[:start] + segment + text[end:]

          old_render = (
              '  async function render(){\n'
              '    header();\n'
              '    if(!session){loginView();return}\n'
              '    if(!profile)await loadProfile();\n'
              '    header();\n'
              '    let v=route();\n'
              '    if(v==="admin"&&profile.role!=="admin"){v="my";location.hash="my"}\n'
              '    if(v==="account"){renderAccount();return}\n'
              '    if(v==="admin"){await renderAdmin();return}\n'
              '    if(v.startsWith("community:")){await renderCommunity(decodeURIComponent(v.slice("community:".length)));return}\n'
              '    await renderMy();\n'
              '  }'
          )
          new_render = (
              '  async function render(){\n'
              '    const token=++renderToken;\n'
              '    header();\n'
              '    if(!session){if(token===renderToken)loginView();return}\n'
              '    if(!profile)await loadProfile();\n'
              '    if(token!==renderToken)return;\n'
              '    header();\n'
              '    let v=route();\n'
              '    if(v==="admin"&&profile.role!=="admin"){v="my";location.hash="my"}\n'
              '    if(v==="account"){renderAccount();return}\n'
              '    if(v==="admin"){await renderAdmin();return}\n'
              '    if(v.startsWith("community:")){await renderCommunity(decodeURIComponent(v.slice("community:".length)));return}\n'
              '    await renderMy(token);\n'
              '  }'
          )
          if old_render not in text:
              raise SystemExit('render block not found')
          text = text.replace(old_render, new_render, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- docs/index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "fix: prevent duplicate startup render"
          git push origin pages
