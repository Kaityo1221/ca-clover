name: Zoroark Real GoTrue Local Auth Isolated QA (No Deploy)
on:
  push:
    branches:
      - feature/zoroark-official-live-disable-isolated-20261115
    paths:
      - scripts/test-zoroark-real-auth-local.mjs
      - src/app/api/zoroark/**
      - src/lib/zoroark-**
      - .github/workflows/zoroark-gotrue-local-isolated-qa.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/test-zoroark-real-auth-local.mjs
      - src/app/api/zoroark/**
      - src/lib/zoroark-**
      - .github/workflows/zoroark-gotrue-local-isolated-qa.yml
permissions:
  contents: read
concurrency:
  group: zoroark-gotrue-auth-isolated-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-real-signed-jwt:
    if: github.head_ref == 'feature/zoroark-official-live-disable-isolated-20261115' || github.ref == 'refs/heads/feature/zoroark-official-live-disable-isolated-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check ephemeral Linux Docker and psql prerequisites
        run: |
          set -euo pipefail
          docker info >/dev/null
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version
      - name: Install reviewed dependencies (no secrets)
        run: npm install --no-audit --no-fund
      - name: Run real local Supabase Auth with signed JWT and PostgREST
        run: node scripts/test-zoroark-real-auth-local.mjs
