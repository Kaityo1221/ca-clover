name: One-time Community Hub

on:
  push:
    paths:
      - '.github/workflows/one-time-community-hub.yml'
      - '.github/scripts/patch_community_hub.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Preserve patch script
        run: cp .github/scripts/patch_community_hub.py /tmp/patch_community_hub.py
      - name: Switch to pages
        run: git fetch origin pages && git checkout pages
      - name: Patch Community hub
        run: python /tmp/patch_community_hub.py
      - name: Syntax check embedded app script
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('docs/index.html').read_text()
          a=s.rfind('<script>')+len('<script>')
          b=s.rfind('</script>')
          Path('/tmp/app.js').write_text(s[a:b])
          PY
          node --check /tmp/app.js
      - name: Commit patch to pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          git commit -m 'feat: simplify Community home and add 2x2 feature hub'
          git push origin pages
