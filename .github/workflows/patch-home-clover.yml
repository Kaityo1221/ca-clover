name: Patch home Clover loader

on:
  push:
    branches: [pages]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages
          fetch-depth: 0
      - name: Inject home Clover loader
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
          loader = '<script src="./home-clover.js?v=20260926-1" defer></script>'
          if loader not in s:
              if marker not in s:
                  raise SystemExit('Supabase script marker not found')
              s = s.replace(marker, marker + '\n  ' + loader, 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          if git diff --quiet -- docs/index.html; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "feat: load monthly Clover on My Community"
          git push origin HEAD:pages
