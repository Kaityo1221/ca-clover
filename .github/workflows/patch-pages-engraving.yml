name: Patch Pages Medal Engraving

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-pages-engraving.yml

permissions:
  contents: write

jobs:
  patch-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pages branch
        uses: actions/checkout@v4
        with:
          ref: pages
          path: site
          fetch-depth: 0

      - name: Checkout main branch helper
        uses: actions/checkout@v4
        with:
          ref: main
          path: source

      - name: Patch static stamp rally
        run: python source/scripts/patch-pages-engraving.py site/docs/stamp-rally.html

      - name: Commit pages branch
        working-directory: site
        run: |
          if git diff --quiet -- docs/stamp-rally.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "CA Clover Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/stamp-rally.html
          git commit -m "Render medal engraving as dedicated back overlay"
          git push origin HEAD:pages
