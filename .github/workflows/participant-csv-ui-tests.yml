name: Participant CSV UI (Synthetic WebKit, No Deploy)
on:
  push:
    branches: [feature/participant-csv-ui-20261017]
permissions:
  contents: read
jobs:
  synthetic-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Latest card aggregate reconciliation
        run: node --test scripts/ci/test-meetup-metrics.mjs
      - name: Existing D ADMIN UI regression
        run: node --test scripts/ci/test-pages-admin-d.mjs
      - name: Install locked synthetic browser runtime
        run: npm ci --prefix scripts/ci/participant-runtime --ignore-scripts --no-audit --no-fund
      - name: Prepare mobile WebKit
        run: node scripts/ci/participant-runtime/node_modules/playwright/cli.js install --with-deps webkit
      - name: Full Pages participant flow on synthetic iPhone WebKit
        run: node scripts/ci/test-participant-ui-webkit.mjs
      - name: Existing ADMIN D WebKit regression
        env:
          NODE_PATH: scripts/ci/participant-runtime/node_modules
        run: |
          ln -s scripts/ci/participant-runtime/node_modules node_modules
          node scripts/ci/test-pages-admin-d-webkit.mjs
      - name: Protected code and public boundary
        run: node --test scripts/ci/test-participant-ui-scope.mjs
      - name: Preserve synthetic mobile screenshots
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: participant-csv-synthetic-webkit
          path: test-results/
          retention-days: 7
