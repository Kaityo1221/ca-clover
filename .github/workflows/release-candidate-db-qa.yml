# Integrated Draft release candidate. Synthetic PostgreSQL only.
# No SUPABASE_* credentials and no production connections.
name: Release candidate / Master + Medal PostgreSQL QA

on:
  push:
    branches:
      - safety/release-candidate-master-and-medal-20261010
  pull_request:
    branches:
      - safety/ca-master-exclusive-lease-20261010
      - safety/release-candidate-master-and-medal-20261010
      - safety/ca-master-phase-c-guards-20261012

permissions:
  contents: read

jobs:
  atomic-master-and-medal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: ca_clover_release_qa
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d ca_clover_release_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test-only
      PGDATABASE: ca_clover_release_qa
    steps:
      - uses: actions/checkout@v4
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Test safe FK and CA master link changes
        run: psql -v ON_ERROR_STOP=1 -f scripts/ci/ca-master-safety-postgres.sql
      - name: Phase D / Reproduce CASCADE and verify NO ACTION vs RESTRICT (synthetic only)
        run: psql -v ON_ERROR_STOP=1 -f scripts/ci/phase-d-fk-no-action-vs-restrict-postgres.sql
      - name: Test actual link RPC, crash recovery and exclusive lease
        run: psql -v ON_ERROR_STOP=1 -f scripts/ci/ca-master-atomic-rpc-postgres.sql
      - name: Test unlisted CA approval RPC with real self-medal function
        run: psql -v ON_ERROR_STOP=1 -f scripts/ci/unlisted-ca-medal-rpc-postgres.sql
      - name: Verify production RLS policy predicates for CA and ADMIN
        run: psql -v ON_ERROR_STOP=1 -f scripts/ci/release-candidate-rls-postgres.sql
      - name: Rehearse separate committed metadata write and failed next REST stage
        run: psql -v ON_ERROR_STOP=1 -f scripts/ci/ca-master-multi-transaction-recovery-postgres.sql
      - name: Phase D / Restore-schema read-only audit on fake local-only database
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps -q --filter ancestor=postgres:16 | head -n 1)"
          test -n "$PG_CONTAINER"
          docker exec "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "create database ca_clover_phase_d;"
          docker exec -i "$PG_CONTAINER" psql -X -U postgres -d ca_clover_phase_d -v ON_ERROR_STOP=1 < scripts/ci/phase-d-restored-local-fixture.sql
          docker exec -i "$PG_CONTAINER" psql -X -U postgres -d ca_clover_phase_d -v ON_ERROR_STOP=1 -t -A < supabase/review/phase-d-restored-local-readonly.sql > "$RUNNER_TEMP/ca-phase-d-audit.txt"
          grep -F 'integrity/orphan_ca_identities|0|0|PASS' "$RUNNER_TEMP/ca-phase-d-audit.txt"
          grep -F 'integrity/duplicate_primary_users|0|0|PASS' "$RUNNER_TEMP/ca-phase-d-audit.txt"
          grep -F 'integrity/verified_own_medal_missing|0|0|PASS' "$RUNNER_TEMP/ca-phase-d-audit.txt"
          grep -F 'state/2099_master_pause|FUTURE_SENTINEL|PASS' "$RUNNER_TEMP/ca-phase-d-audit.txt"
          grep -F 'schema/identity_fk_delete_action|CASCADE_OLD_BASELINE|NOT_PROTECTED_DO_NOT_SYNC' "$RUNNER_TEMP/ca-phase-d-audit.txt"
          echo "PASS: local unix-socket, read-only restored-db audit checks, and unsafe baseline flagged"

      - name: Phase D Step 2 / exact RESTRICT FK review SQL plus actual reconcile RPC
        run: |
          set -euo pipefail
          createdb ca_clover_identity_fk_qa
          PGDATABASE=ca_clover_identity_fk_qa psql -X -v ON_ERROR_STOP=1 -f scripts/ci/phase-d-identity-fk-rpc-integration.sql
          dropdb ca_clover_identity_fk_qa
