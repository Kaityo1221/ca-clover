name: Campfire anonymous probe

on:
  push:
    branches:
      - phase-7-auth-provider-research
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe logged-out Campfire GraphQL
        shell: bash
        run: |
          cat > /tmp/campfire-probe.mjs <<'EOF'
          const normal = "https://niantic-social-api.nianticlabs.com/graphql";
          const publicEndpoint = "https://niantic-social-api.nianticlabs.com/public/graphql";
          const eventId = "3796727a-317e-4835-bc90-f56f99ddc028";
          const clubId = "32ad8f6a-a0f9-404c-a9b6-ac22b04f1c7c";

          async function run(label, endpoint, query, variables, summarize) {
            try {
              const response = await fetch(endpoint, {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "X-APOLLO-OPERATION-NAME": label,
                },
                body: JSON.stringify({ query, variables }),
              });
              const payload = await response.json().catch(() => null);
              const errors = (payload?.errors ?? []).map((error) => String(error?.message ?? "GraphQL error"));
              const summary = payload?.data ? summarize(payload.data) : null;
              console.log(JSON.stringify({
                label,
                httpStatus: response.status,
                ok: response.ok && errors.length === 0 && Boolean(payload?.data),
                errors,
                summary,
              }));
            } catch (error) {
              console.log(JSON.stringify({
                label,
                ok: false,
                networkError: error instanceof Error ? error.message : String(error),
              }));
            }
          }

          await run(
            "ProbeAnonymousEvent",
            normal,
            `query ProbeAnonymousEvent($id: ID!) {
              event(id: $id) {
                id
                clubId
                createdByCommunityAmbassador
                checkedInMembersCount
                members(first: 1) { totalCount }
                campfireLiveEvent { id }
              }
            }`,
            { id: eventId },
            (data) => ({
              event: data.event ? {
                id: data.event.id,
                clubId: data.event.clubId,
                ca: data.event.createdByCommunityAmbassador,
                rsvpCount: data.event.members?.totalCount ?? null,
                checkinCount: data.event.checkedInMembersCount ?? null,
                hasLiveEvent: Boolean(data.event.campfireLiveEvent?.id),
              } : null,
            }),
          );

          await run(
            "ProbeAnonymousClub",
            normal,
            `query ProbeAnonymousClub($id: ID!) {
              club(id: $id) {
                id
                createdByCommunityAmbassador
                members { totalCount }
              }
            }`,
            { id: clubId },
            (data) => ({
              club: data.club ? {
                id: data.club.id,
                ca: data.club.createdByCommunityAmbassador,
                memberCount: data.club.members?.totalCount ?? null,
              } : null,
            }),
          );

          await run(
            "ProbeAnonymousActiveFeed",
            normal,
            `query ProbeAnonymousActiveFeed($id: ID!) {
              club(id: $id) {
                id
                activeFeed(first: 1) {
                  totalCount
                  edges {
                    node {
                      __typename
                      ... on Event { id clubId }
                    }
                  }
                  pageInfo { hasNextPage endCursor }
                }
              }
            }`,
            { id: clubId },
            (data) => ({
              clubId: data.club?.id ?? null,
              totalCount: data.club?.activeFeed?.totalCount ?? null,
              firstEventId: data.club?.activeFeed?.edges?.[0]?.node?.id ?? null,
              hasNextPage: data.club?.activeFeed?.pageInfo?.hasNextPage ?? null,
            }),
          );

          await run(
            "ProbeAnonymousArchivedFeed",
            normal,
            `query ProbeAnonymousArchivedFeed($id: ID!) {
              club(id: $id) {
                id
                archivedFeed(first: 1) {
                  totalCount
                  edges {
                    node {
                      __typename
                      ... on Event { id clubId }
                    }
                  }
                  pageInfo { hasNextPage endCursor }
                }
              }
            }`,
            { id: clubId },
            (data) => ({
              clubId: data.club?.id ?? null,
              totalCount: data.club?.archivedFeed?.totalCount ?? null,
              firstEventId: data.club?.archivedFeed?.edges?.[0]?.node?.id ?? null,
              hasNextPage: data.club?.archivedFeed?.pageInfo?.hasNextPage ?? null,
            }),
          );

          await run(
            "ProbePublicById",
            publicEndpoint,
            `query ProbePublicById($ids: [ID!]!) {
              publicMapObjectsById(ids: $ids) {
                id
                event {
                  id
                  clubId
                  eventTime
                  eventEndTime
                }
              }
            }`,
            { ids: [eventId] },
            (data) => ({
              count: data.publicMapObjectsById?.length ?? 0,
              first: data.publicMapObjectsById?.[0]?.event ? {
                id: data.publicMapObjectsById[0].event.id,
                clubId: data.publicMapObjectsById[0].event.clubId,
                hasStart: Boolean(data.publicMapObjectsById[0].event.eventTime),
                hasEnd: Boolean(data.publicMapObjectsById[0].event.eventEndTime),
              } : null,
            }),
          );
          EOF
          node /tmp/campfire-probe.mjs
