# Disposable DB regression test. Public repo's standard GitHub-hosted runner.
# No Supabase project credentials. No production DB connections.
name: CA Master Safety / Disposable PostgreSQL

on:
  push:
    branches:
      - safety/ca-master-dedicated-pause-gates-20261010
      - safety/ca-master-integrated-free-qa-20261010
  pull_request:
    branches:
      - safety/preserve-live-sync-campfire-auto-v10-20261010
      - safety/ca-master-dedicated-pause-gates-20261010

permissions:
  contents: read

jobs:
  fk-and-gate-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: ca_master_safety
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ca_master_safety"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test-only
      PGDATABASE: ca_master_safety
    steps:
      - uses: actions/checkout@v4
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Test dedicated OFF flag and FK RESTRICT
        run: psql -v ON_ERROR_STOP=1 -f scripts/ci/ca-master-safety-postgres.sql
      - name: Test actual atomic link reconciliation RPC, fail-closed and rollback
        run: psql -v ON_ERROR_STOP=1 -f scripts/ci/ca-master-atomic-rpc-postgres.sql
