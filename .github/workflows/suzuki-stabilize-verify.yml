name: Suzuki cleanup final verify

on:
  push:
    branches: [pages]

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[suzuki-final-verified]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages
          fetch-depth: 0

      - name: Finalize RAF cleanup and cache keys
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/suzuki-native-cleanup-button.js')
          s=p.read_text()
          pairs=[
            ('let startRaf2=0;\nlet lastActivateAt=0;', 'let startRaf2=0;\nlet insertRaf=0;\nlet lastActivateAt=0;'),
            (' if(startRaf2){cancelAnimationFrame(startRaf2);startRaf2=0}\n if(brushAnimation)', ' if(startRaf2){cancelAnimationFrame(startRaf2);startRaf2=0}\n if(insertRaf){cancelAnimationFrame(insertRaf);insertRaf=0}\n if(brushAnimation)'),
            ('function tryInsert(attempt){\n if(insertButton())return;\n if(attempt>=12)return;\n requestAnimationFrame(()=>tryInsert(attempt+1));\n}', 'function tryInsert(attempt){\n insertRaf=0;\n if(insertButton())return;\n if(attempt>=12)return;\n insertRaf=requestAnimationFrame(()=>tryInsert(attempt+1));\n}'),
            (' setPhase("burned");\n requestAnimationFrame(()=>tryInsert(0));', ' setPhase("burned");\n insertRaf=requestAnimationFrame(()=>tryInsert(0));'),
            ('native-burn-cleanup-state-20260924-1135', 'native-burn-cleanup-state-20260924-1145')
          ]
          for old,new in pairs:
            if s.count(old)!=1:
              raise SystemExit(f'cleanup patch mismatch: {old[:60]!r}, count={s.count(old)}')
            s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('docs/community-icon.js')
          s=p.read_text()
          for old,new in [
            ('./suzuki-native-flow.js?v=20260924-1135','./suzuki-native-flow.js?v=20260924-1145'),
            ('./suzuki-native-cleanup-button.js?v=20260924-1135','./suzuki-native-cleanup-button.js?v=20260924-1145')
          ]:
            if s.count(old)!=1:
              raise SystemExit(f'cache patch mismatch: {old}, count={s.count(old)}')
            s=s.replace(old,new,1)
          p.write_text(s)

          html=Path('docs/stamp-rally.html').read_text()
          if 'String.prototype.toLowerCase' in Path('docs/suzuki-native-cleanup-button.js').read_text():
            raise SystemExit('String.prototype monkey patch still present')
          cleanup=Path('docs/suzuki-native-cleanup-button.js').read_text()
          if 'data-design-dir' in cleanup or '.click()' in cleanup:
            raise SystemExit('pseudo-click cleanup dependency still present')
          required=[
            'shouldDrawSuzukiBurn=Boolean(options&&options.suzukiBurned)',
            'window.CAStampRallyMedalBridge',
            'rerenderSuzuki()',
            'window.CASuzukiMedalState?.phase!=="clean_complete"',
            'ca:stamp-medal-rendered'
          ]
          for needle in required:
            if needle not in html:
              raise SystemExit(f'missing renderer invariant: {needle}')

          scripts=[]
          start=0
          while True:
            a=html.find('<script>',start)
            if a<0: break
            b=html.find('</script>',a)
            if b<0: raise SystemExit('unterminated inline script')
            scripts.append(html[a+8:b])
            start=b+9
          if not scripts:
            raise SystemExit('no inline script found')
          Path('/tmp/stamp-inline.js').write_text(scripts[-1])
          Path('.github/workflows/suzuki-stabilize-verify.yml').unlink()
          PY

          node --check docs/suzuki-native-flow.js
          node --check docs/suzuki-native-cleanup-button.js
          node --check /tmp/stamp-inline.js
          git diff --check

      - name: Commit verified stabilization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Suzuki cleanup lifecycle [suzuki-final-verified]"
          git push origin HEAD:pages
