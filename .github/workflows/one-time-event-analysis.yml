name: One-time Event Analysis

on:
  push:
    paths:
      - '.github/workflows/one-time-event-analysis.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Preserve patch script
        run: cp .github/scripts/patch_event_analysis.py /tmp/patch_event_analysis.py
      - name: Switch to pages
        run: |
          git fetch origin pages
          git checkout pages
      - name: Add official event analysis
        run: python /tmp/patch_event_analysis.py docs/index.html
      - name: Commit patch to pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          git commit -m 'feat: add official event analysis'
          git push origin pages
