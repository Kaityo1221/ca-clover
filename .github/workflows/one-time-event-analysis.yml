name: One-time Event Analysis

on:
  push:
    paths:
      - '.github/workflows/one-time-event-analysis.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages
      - name: Add official event analysis
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/index.html')
          s = p.read_text()

          anchor = '  function route(){return (location.hash||"#my").slice(1)}\n'
          assert anchor in s, 'route anchor not found'
          helper = r'''  function eventAnalysisHtml(rows,periodLabel){
    const groups=new Map();
    (rows||[]).forEach(function(row){
      const name=String(row.campfire_live_event_name||"").trim();
      if(!name)return;
      if(!groups.has(name))groups.set(name,{name:name,count:0,rsvpTotal:0,rsvpN:0,checkinTotal:0,checkinN:0,lastAt:0});
      const g=groups.get(name);
      g.count++;
      const r=Number(row.rsvp_count),c=Number(row.checkin_count),t=new Date(row.starts_at).getTime();
      if(row.rsvp_count!=null&&Number.isFinite(r)){g.rsvpTotal+=r;g.rsvpN++}
      if(row.checkin_count!=null&&Number.isFinite(c)){g.checkinTotal+=c;g.checkinN++}
      if(Number.isFinite(t))g.lastAt=Math.max(g.lastAt,t);
    });
    const items=[...groups.values()].sort(function(a,b){return b.lastAt-a.lastAt||a.name.localeCompare(b.name,"ja")});
    function avg(total,n){if(!n)return "—";const v=total/n;return Math.abs(v-Math.round(v))<0.05?String(Math.round(v)):v.toFixed(1)}
    function rate(g){if(g.rsvpTotal<=0)return "算出不可";const v=g.checkinTotal/g.rsvpTotal*100;return (Math.abs(v-Math.round(v))<0.05?String(Math.round(v)):v.toFixed(1))+"%"}
    let body="";
    if(!items.length){
      body='<div class="notice section">この期間には公式イベントタグ付きMeetupがありません。</div>';
    }else{
      body='<div class="grid g2 section">'+items.map(function(g){
        return '<div class="metric"><span class="pill" style="max-width:100%;white-space:normal;line-height:1.35;background:#eff6ff;color:#475569">🏷️ '+e(g.name)+'</span>'+
          '<div class="tags"><span class="pill slate">開催 '+e(g.count)+'回</span><span class="pill slate">平均RSVP '+e(avg(g.rsvpTotal,g.rsvpN))+'</span><span class="pill slate">平均Check-in '+e(avg(g.checkinTotal,g.checkinN))+'</span><span class="pill slate">参加率 '+e(rate(g))+'</span></div></div>';
      }).join("")+'</div>';
    }
    return '<section class="card section"><h2>🏷️ 公式イベント別 / '+e(periodLabel)+'</h2><p class="muted small strong">Campfireの公式イベントタグが付いたMeetupだけを集計しています。表示順は最近開催したイベント順です。</p>'+body+'</section>';
  }
'''
          s = s.replace(anchor, helper + anchor, 1)

          anchor2 = '''    if(memberSince)memberSnapshotQuery=memberSnapshotQuery.gte("observed_on",memberSince);\n\n    const results=await Promise.all([\n'''
          assert anchor2 in s, 'member query anchor not found'
          insert2 = '''    if(memberSince)memberSnapshotQuery=memberSnapshotQuery.gte("observed_on",memberSince);\n\n    let eventMetricQuery=client.from("meetups")\n      .select("campfire_live_event_name,rsvp_count,checkin_count,starts_at")\n      .eq("community_id",id)\n      .lte("starts_at",nowIso)\n      .not("campfire_live_event_name","is",null)\n      .order("starts_at",{ascending:false})\n      .limit(1000);\n    if(since)eventMetricQuery=eventMetricQuery.gte("starts_at",since);\n\n    const results=await Promise.all([\n'''
          s = s.replace(anchor2, insert2, 1)

          old3 = '''      client.rpc("community_activity_trend",{p_community_id:id,p_bucket:trendBucket,p_days:period}),\n      memberSnapshotQuery\n    ]);\n'''
          new3 = '''      client.rpc("community_activity_trend",{p_community_id:id,p_bucket:trendBucket,p_days:period}),\n      memberSnapshotQuery,\n      eventMetricQuery\n    ]);\n'''
          assert old3 in s, 'promise list anchor not found'
          s = s.replace(old3, new3, 1)

          old4 = '''    const memberSnapshots=results[5].data||[];\n    const cardMeetups=upcoming.concat(meetups);\n'''
          new4 = '''    const memberSnapshots=results[5].data||[];\n    const eventMetricRows=results[6].data||[];\n    const cardMeetups=upcoming.concat(meetups);\n'''
          assert old4 in s, 'results anchor not found'
          s = s.replace(old4, new4, 1)

          old5 = '''      activityChartHtml(trend,trendBucket,periodLabel)+\n      '<section class="card section"><h2>🔥 Meetup履歴 / '+e(periodLabel)+'</h2>'''
          new5 = '''      activityChartHtml(trend,trendBucket,periodLabel)+\n      eventAnalysisHtml(eventMetricRows,periodLabel)+\n      '<section class="card section"><h2>🔥 Meetup履歴 / '+e(periodLabel)+'</h2>'''
          assert old5 in s, 'render anchor not found'
          s = s.replace(old5, new5, 1)

          s = s.replace('const VERSION="my-community-20260927-growth-wrap1";', 'const VERSION="my-community-20260927-event-analysis1";', 1)
          p.write_text(s)
          PY
      - name: Commit patch to pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          git commit -m 'feat: add official event analysis'
          git push origin pages
