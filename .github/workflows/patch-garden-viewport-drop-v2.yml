name: Patch Garden viewport drop v2

on:
  push:
    branches: [pages]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages
          fetch-depth: 0
      - name: Apply Garden viewport drop fix
        run: python scripts/patch-garden-viewport-drop-v2.py
      - name: Syntax check
        run: node --check docs/clover-garden.js
      - name: Commit patch
        run: |
          if git diff --quiet -- docs/clover-garden.js docs/index.html; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/clover-garden.js docs/index.html
          git commit -m "fix: trigger Garden drop on viewport and restore four-leaf specimen"
          git push origin HEAD:pages
