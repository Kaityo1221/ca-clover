name: One-time Remove Event Analysis

on:
  push:
    paths:
      - '.github/workflows/one-time-remove-event-analysis.yml'
      - '.github/scripts/remove_event_analysis.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Preserve patch script
        run: cp .github/scripts/remove_event_analysis.py /tmp/remove_event_analysis.py
      - name: Switch to pages
        run: git fetch origin pages && git checkout pages
      - name: Remove standalone official event analysis
        run: python /tmp/remove_event_analysis.py
      - name: Commit patch to pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          git commit -m 'refactor: keep official event tags in Meetup history only'
          git push origin pages
