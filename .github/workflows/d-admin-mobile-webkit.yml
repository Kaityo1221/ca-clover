name: D ADMIN Mobile WebKit Candidate (No Deploy)

on:
  push:
    branches:
      - feature/pages-admin-d-20261016
  pull_request:
    paths:
      - "docs/admin.html"
      - "scripts/ci/test-pages-admin-d-webkit.mjs"
      - ".github/workflows/d-admin-mobile-webkit.yml"

permissions:
  contents: read

jobs:
  mobile-webkit:
    name: Isolated iPhone-width WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Playwright for this workflow only
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Install isolated WebKit and Linux libraries
        run: npx playwright install --with-deps webkit
      - name: Test synthetic D administration (network blocked, no production access)
        run: node scripts/ci/test-pages-admin-d-webkit.mjs
      - name: Test GitHub HTML preview with synthetic accounts (strictly offline)
        run: node scripts/ci/test-d-admin-preview-webkit.mjs
      - name: Store only synthetic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d-admin-synthetic-webkit-screenshots
          path: test-results/d-admin-webkit/
          if-no-files-found: ignore
          retention-days: 7
