name: Sendai MAP Pages tests
on:
  pull_request:
    paths:
      - 'docs/sendai-map.mjs'
      - 'docs/index.html'
      - 'scripts/ci/test-sendai-map-browser.mjs'
      - '.github/workflows/sendai-map-tests.yml'
  push:
    branches: [pages]
    paths:
      - 'docs/sendai-map.mjs'
      - 'docs/index.html'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix scripts/ci/participant-runtime --no-audit --no-fund
      - run: node scripts/ci/participant-runtime/node_modules/playwright/cli.js install --with-deps chromium
      - run: node scripts/ci/test-sendai-map-browser.mjs
      - run: node scripts/ci/verify-public-boundary.mjs
