name: One-time Fix Community Hub Handlers

on:
  push:
    paths:
      - '.github/workflows/one-time-fix-community-hub-handlers.yml'
      - '.github/scripts/fix_community_hub_handlers.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Preserve patch script
        run: cp .github/scripts/fix_community_hub_handlers.py /tmp/fix_community_hub_handlers.py
      - name: Switch to pages
        run: git fetch origin pages && git checkout pages
      - name: Fix Community hub handlers
        run: python /tmp/fix_community_hub_handlers.py
      - name: Syntax check embedded app script
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('docs/index.html').read_text()
          a=s.rfind('<script>')+len('<script>')
          b=s.rfind('</script>')
          Path('/tmp/app.js').write_text(s[a:b])
          PY
          node --check /tmp/app.js
      - name: Commit patch to pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          git commit -m 'fix: wire Community feature hub buttons correctly'
          git push origin pages
