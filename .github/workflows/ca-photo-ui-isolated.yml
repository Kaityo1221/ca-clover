name: CA Photo Mobile Layout Isolated
on:
  pull_request:
    branches:
      - pages
    paths:
      - .github/workflows/ca-photo-ui-isolated.yml
      - docs/index.html
      - docs/profile-photo.mjs
      - docs/settings-accordion.mjs
      - docs/settings-accordion.css
      - docs/exchange-message.mjs
      - docs/stamp-rally.html
      - scripts/test-profile-photo-isolated.mjs
      - scripts/test-profile-photo-browser-isolated.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ca-photo-mobile-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: CA Photo static source regression
        run: node scripts/test-profile-photo-isolated.mjs
      - name: Install pinned Playwright
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - name: Use runner Chromium when available
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$CHROME" ]; then
            echo "QA_CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
          echo "CA_PHOTO_QA_BROWSERS=chromium" >> "$GITHUB_ENV"
      - name: QA mobile medal frame, fallback and WebP compression
        run: node scripts/test-profile-photo-browser-isolated.mjs
      - name: Attach synthetic UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ca-photo-synthetic-mobile-screenshots
          path: qa-artifacts/ca-photo/*.png
          if-no-files-found: ignore
          retention-days: 3

  webkit-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser driver
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - name: Install WebKit only with required libraries
        run: npx playwright install --with-deps webkit
      - name: Execute synthetic WebKit mobile and WebP QA
        env:
          CA_PHOTO_QA_BROWSERS: webkit
        run: node scripts/test-profile-photo-browser-isolated.mjs
      - name: Attach WebKit layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ca-photo-synthetic-webkit-screenshots
          path: qa-artifacts/ca-photo/webkit-*.png
          if-no-files-found: ignore
          retention-days: 3
