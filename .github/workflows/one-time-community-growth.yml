name: One-time Community Growth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-community-growth.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages
      - name: Apply Community Growth patch
        run: |
          git fetch origin main --depth=1
          git show origin/main:.github/patches/community-growth-patch.py > /tmp/community-growth-patch.py
          python /tmp/community-growth-patch.py
      - name: Commit patch to pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "feat: add Community Growth member trend"
          git push origin HEAD:pages
