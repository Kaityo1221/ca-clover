name: One-time Community Growth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-community-growth.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages
      - name: Add Community Growth
        shell: python
        run: |
          from pathlib import Path
          import base64
          p=Path('docs/index.html')
          s=p.read_text()
          s=s.replace('const VERSION="my-community-20260927-period-rate1";', 'const VERSION="my-community-20260927-growth1";', 1)
          helper=base64.b64decode(' nOmMsuOBi+OCiikuOiLigJQiKSsnPC9kaXY+JzonJykrJzwvc2VjdGlvbj4nOwogIH0K'.replace(' ','')).decode()
          query_code=base64.b64decode('').decode()
          marker='  function meetupCardHtml(m,index){'
          assert marker in s
          s=s.replace(marker,helper+marker,1)
          result_marker='    const results=await Promise.all([\n      meetupQuery,\n      upcomingQuery,'
          assert result_marker in s
          s=s.replace(result_marker,query_code+result_marker,1)
          trend_line='      client.rpc("community_activity_trend",{p_community_id:id,p_bucket:trendBucket,p_days:period})\n    ]);'
          assert trend_line in s
          s=s.replace(trend_line,'      client.rpc("community_activity_trend",{p_community_id:id,p_bucket:trendBucket,p_days:period}),\n      memberSnapshotQuery\n    ]);',1)
          result_line='    const trend=results[4].data||[];'
          assert result_line in s
          s=s.replace(result_line,result_line+'\n    const memberSnapshots=results[5].data||[];',1)
          period_pos=s.index('    html+=\'<div class="periodbar">')
          metrics_pos=s.index('      \'<section class="grid g4 section">',period_pos)
          s=s[:metrics_pos]+'      memberGrowthHtml(memberSnapshots,periodLabel,community.member_count)+\n'+s[metrics_pos:]
          p.write_text(s)
      - name: Commit patch to pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "feat: add Community Growth member trend"
          git push origin HEAD:pages
