name: Meetup Roster Pages Release QA (No Deploy)
on:
  push:
    branches: [release/meetup-roster-pages-20261110]
permissions:
  contents: read
jobs:
  static-roster-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --check docs/meetup-roster-ui.mjs
      - run: node --test scripts/test-meetup-roster-pages.mjs
  live-pages-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify canonical Pages has the newly merged module
        run: |
          set -euo pipefail
          root='https://kaityo1221.github.io/ca-clover/'
          curl -fsSL --retry 3 --retry-delay 2 --max-time 20 "$root" -o /tmp/ca-clover-home.html
          curl -fsSL --retry 3 --retry-delay 2 --max-time 20 "${root}meetup-roster-ui.mjs" -o /tmp/meetup-roster-ui.mjs
          grep -q 'meetup-roster-ui.mjs' /tmp/ca-clover-home.html
          grep -q '名簿CSVを取得' /tmp/meetup-roster-ui.mjs
          grep -q '/functions/v1/meetup-roster' /tmp/meetup-roster-ui.mjs
          echo 'PAGES_LIVE_ROSTER_PASS=true'
