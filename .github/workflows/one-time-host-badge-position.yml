name: One-time host badge position patch

on:
  push:
    branches: [pages]
    paths:
      - '.github/workflows/one-time-host-badge-position.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages
      - name: Move Host badge beside Meetup time
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/index.html')
          s = p.read_text()
          old_version = 'const VERSION="my-community-20260927-historysplit1";'
          new_version = 'const VERSION="my-community-20260927-hostbadge1";'
          assert old_version in s
          s = s.replace(old_version, new_version, 1)
          old = '''<div class="tiny strong" style="color:#65a30d">'+e(fmt(m.starts_at))+'</div><h3 style="margin-top:5px">'''
          new = '''<div class="tiny strong" style="color:#65a30d;display:flex;align-items:center;gap:5px">'+e(fmt(m.starts_at))+(m.is_ca_meetup?'<span title="Host: Ambassador" aria-label="Host: Ambassador" style="display:inline-block;font-size:9px;line-height:1">🟪</span>':'')+'</div><h3 style="margin-top:5px">'''
          assert old in s
          s = s.replace(old, new, 1)
          old_right = '''<div class="tags" style="margin-top:0">'+(m.is_ca_meetup?'<span title="Host: Ambassador" aria-label="Host: Ambassador">🟪</span>':'')+(m.is_passcode_reward_eligible===true?'''
          new_right = '''<div class="tags" style="margin-top:0">'+(m.is_passcode_reward_eligible===true?'''
          assert old_right in s
          s = s.replace(old_right, new_right, 1)
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "fix: move Host badge beside Meetup time"
          git push origin HEAD:pages
