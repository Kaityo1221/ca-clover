name: Suzuki PM daily HP snapshot

on:
  schedule:
    - cron: '40 18 * * *' # 03:40 JST, after the previous day's member-sync
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: suzuki-pm-hp-daily
  cancel-in-progress: false

jobs:
  export:
    # Never publish from an isolated development branch.
    if: github.ref == 'refs/heads/pages'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages
          persist-credentials: true
      - name: Export completed CA Clover member totals (SELECT only)
        env:
          PGURL: ${{ secrets.SUZUKI_HP_READONLY_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PGURL:-}" ]; then
            echo 'SKIPPED: SUZUKI_HP_READONLY_DATABASE_URL is not configured.'
            exit 0
          fi
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          # The SQL itself checks sync finished_at, failed IDs, and snapshot date.
          psql -X -Atq -v ON_ERROR_STOP=1 "$PGURL" -f scripts/export-suzuki-hp.sql > /tmp/suzuki-hp-export.json
          node scripts/refresh-suzuki-hp.mjs /tmp/suzuki-hp-export.json docs/suzuki-pm-hp.json
          git add -- docs/suzuki-pm-hp.json
          if git diff --cached --quiet; then
            echo 'UNCHANGED: No new prefecture HP totals.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'data(suzuki): refresh daily CA Clover prefecture HP totals'
          git push origin HEAD:pages
