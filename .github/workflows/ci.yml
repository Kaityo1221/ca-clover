name: CI

on:
  pull_request:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Anan Meetup event
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT='https://niantic-social-api.nianticlabs.com/graphql'
          EVENT_ID='38da9239-cde9-4f75-8aa1-b3d16e80c0d7'
          Q='query Probe($id: ID!) { event(id: $id) { id name clubId address location eventTime eventEndTime createdByCommunityAmbassador checkedInMembersCount members { totalCount } club { id name location game visibility badgeGrants } creator { displayName username badges { badgeType alias } } } }'
          BODY="$(jq -nc --arg q "$Q" --arg id "$EVENT_ID" '{query:$q,variables:{id:$id}}')"
          curl -sS -X POST "$ENDPOINT" -H 'Content-Type: application/json' -H 'Accept: application/json' --data "$BODY" | jq .
