name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Diagnostic discovery input schema
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(jq -nc '{query:"query Probe { __type(name: \"RealityChannelMapObjectsInLatLngBoundsInput\") { name kind inputFields { name defaultValue type { kind name ofType { kind name ofType { kind name } } } } } }"}')"
          curl -sS -X POST 'https://niantic-social-api.nianticlabs.com/graphql'             -H 'Content-Type: application/json' -H 'Accept: application/json'             --data "$BODY" | jq .
          echo '=== EMPTY INPUT PROBE ==='
          BODY2="$(jq -nc '{query:"query Probe($input: RealityChannelMapObjectsInLatLngBoundsInput!) { realityChannelMapObjectsInLatLngBounds(input: $input) { id mapObjectType event { id eventTime eventEndTime } } }",variables:{input:{}}}')"
          curl -sS -X POST 'https://niantic-social-api.nianticlabs.com/graphql'             -H 'Content-Type: application/json' -H 'Accept: application/json'             --data "$BODY2" | jq .
