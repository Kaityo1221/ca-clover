name: CI

on:
  pull_request:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe old and current Tokushima club IDs
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT='https://niantic-social-api.nianticlabs.com/graphql'
          Q='query Probe($clubId: ID!) { club(id: $clubId) { id name address location createdByCommunityAmbassador members { totalCount } } }'
          for CLUB_ID in             '2cba3ab5-4785-41ba-be31-ffd5e84cfcf9'             '8f173f1e-49a0-4344-bfc9-062762790e01'
          do
            echo "=== CLUB $CLUB_ID ==="
            BODY="$(jq -nc --arg q "$Q" --arg id "$CLUB_ID" '{query:$q,variables:{clubId:$id}}')"
            curl -sS -X POST "$ENDPOINT" -H 'Content-Type: application/json' -H 'Accept: application/json' --data "$BODY" | jq .
          done
