name: CI
on:
  pull_request:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe discovery input shapes
        shell: bash
        run: |
          set -euo pipefail
          Q='query Probe($input: RealityChannelMapObjectsInLatLngBoundsInput!) { realityChannelMapObjectsInLatLngBounds(input: $input) { id mapObjectType event { id eventTime eventEndTime createdByCommunityAmbassador } } }'
          probe() {
            label="$1"; input="$2"
            echo "=== $label ==="
            BODY="$(jq -nc --arg q "$Q" --argjson input "$input" '{query:$q,variables:{input:$input}}')"
            curl -sS -X POST 'https://niantic-social-api.nianticlabs.com/graphql'               -H 'Content-Type: application/json' -H 'Accept: application/json'               --data "$BODY" | jq '{errors, count:(.data.realityChannelMapObjectsInLatLngBounds|length), sample:(.data.realityChannelMapObjectsInLatLngBounds[0:3])}'
          }
          probe empty_bounds '{"bounds":{}}'
          probe nwse '{"bounds":{"north":36.0,"south":35.0,"east":140.5,"west":139.0}}'
          probe nesw_objects '{"bounds":{"northEast":{"latitude":36.0,"longitude":140.5},"southWest":{"latitude":35.0,"longitude":139.0}}}'
          probe ne_sw_objects '{"bounds":{"northeast":{"latitude":36.0,"longitude":140.5},"southwest":{"latitude":35.0,"longitude":139.0}}}'
          probe top_bottom '{"bounds":{"topRight":{"latitude":36.0,"longitude":140.5},"bottomLeft":{"latitude":35.0,"longitude":139.0}}}'
          probe coords_array '{"bounds":[[139.0,35.0],[140.5,36.0]]}'
