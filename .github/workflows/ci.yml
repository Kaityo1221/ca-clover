name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test:share-url
      - run: npm run test:ca-link-diff
      - run: node scripts/test-ca-master-recovery.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check CA master and scheduler Edge Function types
        run: deno check supabase/functions/sync-ca-master/index.ts supabase/functions/sync-ca-master-admin/index.ts supabase/functions/sync-campfire-auto/index.ts
      - run: npm run build
