name: CI
on:
  pull_request:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Find discovery source defaults
        shell: bash
        run: |
          set -euo pipefail
          curl -LfsS -A 'Mozilla/5.0' 'https://campfire.scopely.com/discover/collection/all-meetups' -o /tmp/page.html
          python - <<'PY'
          import re, urllib.request
          html=open('/tmp/page.html',encoding='utf-8',errors='ignore').read()
          srcs=re.findall(r'<script[^>]+src="([^"]+)"',html)
          terms=['selectedRealityChannelSources','selectedRealityChannelId','RealityChannelSourceInput','realityChannelId','limitDropCount']
          for src in srcs:
              try:
                  data=urllib.request.urlopen(urllib.request.Request(src,headers={'User-Agent':'Mozilla/5.0'}),timeout=15).read().decode('utf-8','ignore')
              except Exception:
                  continue
              found=False
              for term in terms:
                  positions=[m.start() for m in re.finditer(re.escape(term),data)]
                  if not positions: continue
                  if not found:
                      print('\n###',src)
                      found=True
                  for i in positions[:8]:
                      print('\nTERM',term,'AT',i)
                      print(data[max(0,i-1200):i+2200].replace('\n',' ')[:3400])
          PY
