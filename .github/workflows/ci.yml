name: CI

on:
  pull_request:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm step CA Meetup after appointment
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT='https://niantic-social-api.nianticlabs.com/graphql'
          EVENT_ID='e000653d-77f0-4a4a-8f0e-a52dddcb2c4a'
          Q='query Probe($id: ID!) { event(id: $id) { id name clubId address eventTime createdByCommunityAmbassador club { id name location visibility badgeGrants } creator { displayName username badges { badgeType alias } } } }'
          BODY="$(jq -nc --arg q "$Q" --arg id "$EVENT_ID" '{query:$q,variables:{id:$id}}')"
          curl -sS -X POST "$ENDPOINT" -H 'Content-Type: application/json' -H 'Accept: application/json' --data "$BODY" | jq .
