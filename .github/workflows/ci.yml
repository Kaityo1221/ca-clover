name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/ci/verify-public-boundary.mjs
      - run: node scripts/ci/test-zoroark-room-preview.mjs
      - run: node scripts/ci/test-zoroark-guest-isolation.mjs
      - run: node scripts/test-community-title-fit.mjs
      - run: node scripts/test-medal-face-hires.mjs
      - run: node scripts/test-stamp-exchange-stats.mjs
      - run: node scripts/test-stamp-exchange-community-entry.mjs
      - run: node scripts/test-stamp-exchange-breakdown.mjs
      - run: node --check docs/meetup-roster-ui.mjs
      - run: node --test scripts/test-meetup-roster-pages.mjs
      - run: node --check docs/meetup-roster-ui.mjs
      - run: node --test scripts/test-meetup-roster-pages.mjs
      - run: node --check docs/meetup-roster-ui.mjs
      - run: node --test scripts/test-meetup-roster-pages.mjs
      - run: npm run build
