name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Diagnostic public collection query
        shell: bash
        run: |
          set -euo pipefail
          URL='https://campfire.scopely.com/discover/collection/all-meetups'
          curl -LfsS -A 'Mozilla/5.0' "$URL" -o /tmp/campfire.html
          echo '=== HTML HEAD ==='
          head -c 1200 /tmp/campfire.html | tr '\n' ' '
          echo
          echo '=== SCRIPT SRCS ==='
          grep -oE '<script[^>]+src="[^"]+"' /tmp/campfire.html | sed -E 's/.*src="([^"]+)".*/\1/' | head -80 | tee /tmp/scripts.txt || true
          python - <<'PY'
          import re, urllib.parse, urllib.request
          base='https://campfire.scopely.com'
          html=open('/tmp/campfire.html',encoding='utf-8',errors='ignore').read()
          srcs=re.findall(r'<script[^>]+src="([^"]+)"',html)
          needles=['all-meetups','collection','publicMapObjectsById','activeFeed','archivedFeed','GraphQL','graphql']
          print('=== BUNDLE MATCHES ===')
          for src in srcs[:80]:
              url=urllib.parse.urljoin(base,src)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  data=urllib.request.urlopen(req,timeout=15).read().decode('utf-8','ignore')
              except Exception as e:
                  continue
              hits=[n for n in needles if n in data]
              if not hits:
                  continue
              print('BUNDLE',url,'HITS',','.join(hits))
              for n in hits:
                  i=data.find(n)
                  if i>=0:
                      snippet=data[max(0,i-220):i+500].replace('\n',' ')
                      print('NEEDLE',n,'SNIPPET',snippet[:720])
          PY
          echo '=== RELAY ARTIFACT NAMES ==='
          python - <<'PY2'
          import re, urllib.parse, urllib.request
          html=open('/tmp/campfire.html',encoding='utf-8',errors='ignore').read()
          srcs=re.findall(r'<script[^>]+src="([^"]+)"',html)
          base='https://campfire.scopely.com'
          seen=set()
          for src in srcs:
              url=urllib.parse.urljoin(base,src)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  data=urllib.request.urlopen(req,timeout=15).read().decode('utf-8','ignore')
              except Exception:
                  continue
              names=set()
              for m in re.finditer(r'name:"([A-Za-z0-9_]+)"',data):
                  name=m.group(1)
                  window=data[max(0,m.start()-1200):m.end()+2200]
                  if 'operationKind:"query"' in window or 'kind:"Request"' in window:
                      names.add(name)
              for m in re.finditer(r'([A-Za-z][A-Za-z0-9_]*(?:Meetup|Collection|Discover)[A-Za-z0-9_]*)',data):
                  val=m.group(1)
                  if len(val)<120:
                      names.add(val)
              interesting=sorted(x for x in names if any(k.lower() in x.lower() for k in ['meetup','collection','discover','map']))
              if interesting:
                  print('BUNDLE',url)
                  for x in interesting[:120]:
                      if (url,x) not in seen:
                          print('NAME',x)
                          seen.add((url,x))
              for needle in ['operationKind:"query"','kind:"Request"','allMeetups','all_meetups','AllMeetups','collectionId']:
                  pos=data.find(needle)
                  if pos>=0 and ('all-meetups' in url or '/3310-' in url or '/8236-' in url or '/1121-' in url or '/1966-' in url or '/7484-' in url):
                      print('CONTEXT',url,needle,data[max(0,pos-800):pos+2400].replace('\n',' ')[:3200])
          PY2
          echo '=== TARGET QUERY ARTIFACT ==='
          python - <<'PY3'
          import urllib.request
          url='https://campfire-web-assets.nianticlabs.com/_next/static/chunks/3248-4db68ec4bf2822ee.js'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          data=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','ignore')
          for needle in [
              'DiscoveryMapObjectsProvider_meetupMapObjects_Query',
              'DiscoveryMapObjectsProvider_mapObjectsInLatLng_Query',
              'meetupMapObjectsByLiveEventIdInLatLngBounds',
              'realityChannelMapObjectsInLatLngBounds'
          ]:
              print('---',needle,'---')
              start=0
              count=0
              while True:
                  pos=data.find(needle,start)
                  if pos<0 or count>=5:
                      break
                  print(data[max(0,pos-2500):pos+9000].replace('\\n',' ')[:11500])
                  print()
                  start=pos+len(needle)
                  count+=1
          PY3
          echo '=== TARGET INPUT BUILDERS ==='
          python - <<'PY4'
          import urllib.request
          url='https://campfire-web-assets.nianticlabs.com/_next/static/chunks/3248-4db68ec4bf2822ee.js'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          data=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','ignore')
          for needle in [
              'realityChannelMapObjectsInLatLngBoundsInput:',
              'meetupMapObjectsByLiveEventIdInLatLngBoundsInput:',
              'fetchMeetupMapObjectsForCurrentLiveEvent',
              'fetchMeetupMapObjectsByLiveEventId',
              'mapObjectsInLatLngBounds'
          ]:
              print('---',needle,'---')
              start=0
              count=0
              while True:
                  pos=data.find(needle,start)
                  if pos<0 or count>=12: break
                  print(data[max(0,pos-3500):pos+6500].replace('\\n',' ')[:10000])
                  print()
                  start=pos+len(needle)
                  count+=1
          PY4
          echo '=== REALITY CHANNEL DEFAULTS ==='
          python - <<'PY5'
          import re, urllib.request
          urls=[
            'https://campfire-web-assets.nianticlabs.com/_next/static/chunks/3248-4db68ec4bf2822ee.js',
            'https://campfire-web-assets.nianticlabs.com/_next/static/chunks/1121-71d6a92e10785376.js',
            'https://campfire-web-assets.nianticlabs.com/_next/static/chunks/app/(web)/discover/layout-0f75c2dd1c3a2cc4.js'
          ]
          for url in urls:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              data=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','ignore')
              print('BUNDLE',url)
              for needle in ['selectedRealityChannelId','selectedRealityChannelSources','realityChannelId','realityChannelById','sources:', 'PGO']:
                  poses=[m.start() for m in re.finditer(re.escape(needle),data)]
                  print('NEEDLE',needle,'COUNT',len(poses))
                  for pos in poses[:8]:
                      print(data[max(0,pos-2200):pos+4200].replace('\\n',' ')[:6400])
                      print()
          PY5
          echo '=== RC IDS AND MAP DEFAULTS ==='
          python - <<'PY6'
          import re, urllib.parse, urllib.request
          html=open('/tmp/campfire.html',encoding='utf-8',errors='ignore').read()
          srcs=re.findall(r'<script[^>]+src="([^"]+)"',html)
          urls=['https://campfire.scopely.com']+[urllib.parse.urljoin('https://campfire.scopely.com',s) for s in srcs]
          uuid_re=re.compile(r'(?i)[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}')
          seen=set()
          for url in urls:
              try:
                  if url=='https://campfire.scopely.com':
                      data=html
                  else:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                      data=urllib.request.urlopen(req,timeout=15).read().decode('utf-8','ignore')
              except Exception:
                  continue
              for m in uuid_re.finditer(data):
                  ctx=data[max(0,m.start()-700):m.end()+700]
                  if any(k.lower() in ctx.lower() for k in ['realitychannel','reality channel','pokemon','pgo','source']):
                      key=(url,m.group(0))
                      if key not in seen:
                          print('UUID',m.group(0),'URL',url)
                          print(ctx.replace('\\n',' ')[:1500])
                          seen.add(key)
              for needle in ['realityChannelId:', 'realityChannelId=', 'realityChannelId"', 'realityChannelId\\":']:
                  for m in list(re.finditer(re.escape(needle),data))[:20]:
                      print('RCCTX',url,needle,data[max(0,m.start()-1500):m.start()+3500].replace('\\n',' ')[:5000])
              if '/3248-' in url:
                  for module_id in ['3481:function','97145:function']:
                      pos=data.find(module_id)
                      print('MODULE',module_id,'POS',pos)
                      if pos>=0: print(data[pos:pos+10000].replace('\\n',' ')[:10000])
          print('HTML_UUIDS',sorted(set(uuid_re.findall(html)))[:100])
          PY6
          echo '=== ANON RC QUERY ==='
          BODY="$(jq -nc --arg id '8947de81-e387-4e03-89c6-31ce2ca47c3c' '{query:"query RC($id: ID!) { realityChannelById(id: $id) { id metadata { isWebEmbed showUGC showGameIP } sources { name dropTypes } } }",variables:{id:$id}}')"
          curl -sS -X POST 'https://niantic-social-api.nianticlabs.com/graphql' -H 'Content-Type: application/json' -H 'Accept: application/json' --data "$BODY" | jq .

          echo '=== FIND MAP CONSTANT MODULES ==='
          python - <<'PY7'
          import re, urllib.parse, urllib.request
          html=open('/tmp/campfire.html',encoding='utf-8',errors='ignore').read()
          srcs=re.findall(r'<script[^>]+src="([^"]+)"',html)
          for src in srcs:
              url=urllib.parse.urljoin('https://campfire.scopely.com',src)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  data=urllib.request.urlopen(req,timeout=15).read().decode('utf-8','ignore')
              except Exception:
                  continue
              for mid in ['3481','97145']:
                  for pat in [mid+':function(',mid+':(',mid+':function']:
                      pos=data.find(pat)
                      if pos>=0:
                          print('FOUND MODULE',mid,'URL',url,'PAT',pat)
                          print(data[pos:pos+14000].replace('\\n',' ')[:14000])
                          break
          PY7

          echo '=== SOURCE PROP WIRING ==='
          python - <<'PY8'
          import re, urllib.parse, urllib.request
          html=open('/tmp/campfire.html',encoding='utf-8',errors='ignore').read()
          srcs=re.findall(r'<script[^>]+src="([^"]+)"',html)
          needles=['selectedRealityChannelSources','selectedRealityChannelMetadata','sources.map','dropTypes']
          for src in srcs:
              url=urllib.parse.urljoin('https://campfire.scopely.com',src)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  data=urllib.request.urlopen(req,timeout=15).read().decode('utf-8','ignore')
              except Exception:
                  continue
              hits=[]
              for needle in needles:
                  for m in re.finditer(re.escape(needle),data):
                      hits.append((m.start(),needle))
              if hits:
                  print('BUNDLE',url)
                  for pos,needle in sorted(hits)[:30]:
                      print('NEEDLE',needle,data[max(0,pos-2500):pos+5000].replace('\\n',' ')[:7500])
          PY8


          echo '=== ANON CLUB LOCATION QUERY ==='
          CLUB_QUERY='query ClubProbe($id: ID!) { club(id: $id) { id name address location createdByCommunityAmbassador members { totalCount } } }'
          for ITEM in 'YOKOHAMA|1816a36d-1560-41ec-962c-4f27ae3e221d' 'BUKURO|21ebceac-0796-475c-9056-cba006922779' 'UENO|'; do
            LABEL="${ITEM%%|*}"; ID="${ITEM#*|}"
            [ -z "$ID" ] && continue
            BODY="$(jq -nc --arg query "$CLUB_QUERY" --arg id "$ID" '{query:$query,variables:{id:$id}}')"
            echo "--- $LABEL ---"
            curl -sS -X POST 'https://niantic-social-api.nianticlabs.com/graphql' -H 'Content-Type: application/json' -H 'Accept: application/json' --data "$BODY" | jq .
          done
          echo '=== ANON MAP QUERY VARIANTS ==='
          MAP_QUERY='query MapMeetups($input: RealityChannelMapObjectsInLatLngBoundsInput!) { realityChannelMapObjectsInLatLngBounds(input: $input) { id mapObjectType event { id eventTime eventEndTime createdByCommunityAmbassador location mapObjectLocation { latitude longitude } } } }'
          probe() {
            LABEL="$1"; VARS="$2"
            BODY="$(jq -nc --arg query "$MAP_QUERY" --argjson variables "$VARS" '{query:$query,variables:$variables}')"
            RESP="$(curl -sS -X POST 'https://niantic-social-api.nianticlabs.com/graphql' -H 'Content-Type: application/json' -H 'Accept: application/json' --data "$BODY")"
            echo "--- $LABEL ---"
            echo "$RESP" | jq '{errors, count:(.data.realityChannelMapObjectsInLatLngBounds|length), types:(.data.realityChannelMapObjectsInLatLngBounds // [] | group_by(.mapObjectType)|map({type:.[0].mapObjectType,count:length})), sample:(.data.realityChannelMapObjectsInLatLngBounds // [] | map(select(.event != null)) | .[:8])}'
          }
          V1="$(jq -nc '{input:{zoomLevel:12,bounds:{sw:{lat:35.45,lng:139.45},ne:{lat:35.90,lng:140.05}},sources:[{name:"PGO",dropTypes:["EVENT","CA_EVENT"]}],realityChannelId:"8947de81-e387-4e03-89c6-31ce2ca47c3c",limitDropCount:false}}')"
          probe 'TOKYO_Z12_OBJECT_SOURCES' "$V1"
          V2="$(jq -nc '{input:{zoomLevel:15,bounds:{sw:{lat:35.60,lng:139.60},ne:{lat:35.80,lng:139.90}},sources:[{name:"PGO",dropTypes:["EVENT","CA_EVENT"]}],realityChannelId:"8947de81-e387-4e03-89c6-31ce2ca47c3c",limitDropCount:false}}')"
          probe 'TOKYO_Z15_OBJECT_SOURCES' "$V2"
          V3="$(jq -nc '{input:{zoomLevel:12,bounds:{sw:{lat:35.45,lng:139.45},ne:{lat:35.90,lng:140.05}},sources:["PGO"],realityChannelId:"8947de81-e387-4e03-89c6-31ce2ca47c3c",limitDropCount:false}}')"
          probe 'TOKYO_Z12_STRING_SOURCES' "$V3"
          echo '=== ANON MAP MEETUP QUERY TOKYO ==='
          MAP_QUERY='query MapMeetups($input: RealityChannelMapObjectsInLatLngBoundsInput!) { realityChannelMapObjectsInLatLngBounds(input: $input) { id mapObjectType event { id eventTime eventEndTime createdByCommunityAmbassador location mapObjectLocation { latitude longitude } } } }'
          MAP_VARS="$(jq -nc '{input:{zoomLevel:8,bounds:{sw:{lat:34.8,lng:138.5},ne:{lat:36.3,lng:141.0}},sources:[{name:"PGO",dropTypes:["EVENT","CA_EVENT"]}],realityChannelId:"8947de81-e387-4e03-89c6-31ce2ca47c3c",limitDropCount:true}}')"
          MAP_BODY="$(jq -nc --arg query "$MAP_QUERY" --argjson variables "$MAP_VARS" '{query:$query,variables:$variables}')"
          MAP_RESP="$(curl -sS -X POST 'https://niantic-social-api.nianticlabs.com/graphql' -H 'Content-Type: application/json' -H 'Accept: application/json' --data "$MAP_BODY")"
          echo "$MAP_RESP" | jq '{errors, count:(.data.realityChannelMapObjectsInLatLngBounds|length), sample:(.data.realityChannelMapObjectsInLatLngBounds // [] | map(select(.event != null)) | .[:20])}'
