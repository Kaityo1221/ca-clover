name: CI
on:
  pull_request:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe anonymous meetup detail from map discovery
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT='https://niantic-social-api.nianticlabs.com/graphql'
          EVENT_ID='ccddd200-8ef5-4112-af60-e3abd5b83825'
          Q='query CA_Clover_Event($id: ID!) { event(id: $id) { id name clubId address location eventTime eventEndTime createdByCommunityAmbassador creator { displayName username badges { badgeType alias } } checkedInMembersCount members(first: 1) { totalCount } campfireLiveEvent { eventName } } }'
          BODY="$(jq -nc --arg q "$Q" --arg id "$EVENT_ID" '{query:$q,variables:{id:$id}}')"
          curl -sS -X POST "$ENDPOINT" -H 'Content-Type: application/json' -H 'Accept: application/json' --data "$BODY" | jq .
