name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Diagnostic all-meetups Relay operations
        shell: bash
        run: |
          set -euo pipefail
          URL='https://campfire.scopely.com/discover/collection/all-meetups'
          curl -LfsS -A 'Mozilla/5.0' "$URL" -o /tmp/page.html
          BUNDLE="$(grep -oE 'https://campfire-web-assets\.nianticlabs\.com[^"]+all-meetups/page-[^"]+\.js' /tmp/page.html | head -1)"
          echo "BUNDLE=$BUNDLE"
          test -n "$BUNDLE"
          curl -LfsS -A 'Mozilla/5.0' "$BUNDLE" -o /tmp/all-meetups.js
          python - <<'PY'
          import re
          s=open('/tmp/all-meetups.js',encoding='utf-8',errors='ignore').read()
          print('SIZE',len(s))
          print('=== REQUEST NAMES ===')
          for n in sorted(set(re.findall(r'name:"([^"]+_Query)"',s))):
              print(n)
          print('=== ALL GRAPHQL FIELD NAMES ===')
          fields=sorted(set(re.findall(r'kind:"LinkedField",name:"([^"]+)"',s)))
          for x in fields:
              print(x)
          print('=== REQUEST BLOCKS ===')
          for m in re.finditer(r'kind:"Request"',s):
              block=s[max(0,m.start()-5000):m.start()+10000]
              names=re.findall(r'name:"([^"]+)"',block)
              print('NAMES', names[-80:])
              print('SNIP', block.replace('\n',' ')[:12000])
              print('---')
          PY
