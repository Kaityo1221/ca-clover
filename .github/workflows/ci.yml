name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Diagnostic discovery map query
        shell: bash
        run: |
          set -euo pipefail
          URL='https://campfire.scopely.com/discover/collection/all-meetups'
          curl -LfsS -A 'Mozilla/5.0' "$URL" -o /tmp/page.html
          python - <<'PY'
          import re, urllib.request
          html=open('/tmp/page.html',encoding='utf-8',errors='ignore').read()
          srcs=re.findall(r'<script[^>]+src="([^"]+)"',html)
          targets=['87878:function','89312:function','realityChannelMapObjectsInLatLngBoundsInput','RealityChannelMapObjectsInLatLngBounds','realityChannelMapObjectsInLatLngBounds']
          print('SCRIPT_COUNT',len(srcs))
          for src in srcs:
              try:
                  req=urllib.request.Request(src,headers={'User-Agent':'Mozilla/5.0'})
                  data=urllib.request.urlopen(req,timeout=15).read().decode('utf-8','ignore')
              except Exception:
                  continue
              hits=[x for x in targets if x in data]
              if not hits: continue
              print('\nBUNDLE',src,'HITS',hits)
              for x in hits:
                  pos=0
                  count=0
                  while count<8:
                      i=data.find(x,pos)
                      if i<0: break
                      print('\nTERM',x)
                      print(data[max(0,i-6000):i+14000].replace('\n',' ')[:20000])
                      pos=i+len(x); count+=1
          PY
