name: CI
on:
  pull_request:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public Tokyo meetup discovery
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT='https://niantic-social-api.nianticlabs.com/graphql'
          RC_ID='8947de81-e387-4e03-89c6-31ce2ca47c3c'

          RC_Q='query Probe($realityChannelId: ID!) { realityChannelById(id: $realityChannelId) { id metadata { isWebEmbed showUGC showGameIP } sources { name dropTypes } } }'
          RC_BODY="$(jq -nc --arg q "$RC_Q" --arg id "$RC_ID" '{query:$q,variables:{realityChannelId:$id}}')"
          curl -sS -X POST "$ENDPOINT" -H 'Content-Type: application/json' -H 'Accept: application/json' --data "$RC_BODY" -o /tmp/rc.json
          echo '=== REALITY CHANNEL ==='
          jq . /tmp/rc.json

          SOURCES="$(jq -c '.data.realityChannelById.sources' /tmp/rc.json)"
          test "$SOURCES" != "null"

          MAP_Q='query Probe($input: RealityChannelMapObjectsInLatLngBoundsInput!) { realityChannelMapObjectsInLatLngBounds(input: $input) { id mapObjectType event { id location campfireLiveEventId mapObjectLocation { latitude longitude } eventTime eventEndTime createdByCommunityAmbassador } } }'
          INPUT="$(jq -nc --arg id "$RC_ID" --argjson sources "$SOURCES" '{zoomLevel:12,bounds:{sw:{lat:35.65,lng:139.70},ne:{lat:35.75,lng:139.85}},sources:$sources,realityChannelId:$id,limitDropCount:false}')"
          echo '=== MAP INPUT ==='
          echo "$INPUT" | jq .
          MAP_BODY="$(jq -nc --arg q "$MAP_Q" --argjson input "$INPUT" '{query:$q,variables:{input:$input}}')"
          echo '=== TOKYO MAP RESULT ==='
          curl -sS -X POST "$ENDPOINT" -H 'Content-Type: application/json' -H 'Accept: application/json' --data "$MAP_BODY" | jq '{errors,count:(.data.realityChannelMapObjectsInLatLngBounds|length),items:(.data.realityChannelMapObjectsInLatLngBounds // [])}'
