name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Diagnostic creator username
        shell: bash
        run: |
          set -euo pipefail
          ID='706952b6-929a-43db-ab4a-3516da3012eb'
          BODY="$(jq -nc --arg id "$ID" '{query:"query Probe($id: ID!) { event(id: $id) { id clubId createdByCommunityAmbassador creator { displayName username badges { badgeType alias } } } }",variables:{id:$id}}')"
          curl -sS -X POST 'https://niantic-social-api.nianticlabs.com/graphql' -H 'Content-Type: application/json' -H 'Accept: application/json' --data "$BODY" | jq '{errors, event: .data.event}'
