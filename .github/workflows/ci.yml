name: CI
on:
  pull_request:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe LatLngBounds shape
        shell: bash
        run: |
          set -euo pipefail
          Q='query Probe($input: RealityChannelMapObjectsInLatLngBoundsInput!) { realityChannelMapObjectsInLatLngBounds(input: $input) { id event { id } } }'
          probe() {
            echo "=== $1 ==="
            BODY="$(jq -nc --arg q "$Q" --argjson input "$2" '{query:$q,variables:{input:$input}}')"
            curl -sS -X POST 'https://niantic-social-api.nianticlabs.com/graphql' -H 'Content-Type: application/json' -H 'Accept: application/json' --data "$BODY" | jq .
          }
          probe sw_empty '{"bounds":{"sw":{}}}'
          probe sw_latlng '{"bounds":{"sw":{"lat":35.0,"lng":139.0}}}'
          probe sw_latlong '{"bounds":{"sw":{"latitude":35.0,"longitude":139.0}}}'
          probe sw_xy '{"bounds":{"sw":{"x":139.0,"y":35.0}}}'
          probe sw_ne_latlng '{"bounds":{"sw":{"lat":35.0,"lng":139.0},"ne":{"lat":36.0,"lng":140.5}}}'
          probe sw_ne_latlong '{"bounds":{"sw":{"latitude":35.0,"longitude":139.0},"ne":{"latitude":36.0,"longitude":140.5}}}'
