name: CI

on:
  pull_request:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe current Tokushima event club name
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT='https://niantic-social-api.nianticlabs.com/graphql'
          EVENT_ID='7f0edc7c-8b4f-4d59-8a33-e882050fb357'
          Q='query Probe($id: ID!) { event(id: $id) { id name clubId club { id name location game visibility badgeGrants } creator { displayName username badges { badgeType alias } } } }'
          BODY="$(jq -nc --arg q "$Q" --arg id "$EVENT_ID" '{query:$q,variables:{id:$id}}')"
          curl -sS -X POST "$ENDPOINT" -H 'Content-Type: application/json' -H 'Accept: application/json' --data "$BODY" | jq .
