name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Diagnostic public collection query
        shell: bash
        run: |
          set -euo pipefail
          URL='https://campfire.scopely.com/discover/collection/all-meetups'
          curl -LfsS -A 'Mozilla/5.0' "$URL" -o /tmp/campfire.html
          echo '=== HTML HEAD ==='
          head -c 1200 /tmp/campfire.html | tr '\n' ' '
          echo
          echo '=== SCRIPT SRCS ==='
          grep -oE '<script[^>]+src="[^"]+"' /tmp/campfire.html | sed -E 's/.*src="([^"]+)".*/\1/' | head -80 | tee /tmp/scripts.txt || true
          python - <<'PY'
          import re, urllib.parse, urllib.request
          base='https://campfire.scopely.com'
          html=open('/tmp/campfire.html',encoding='utf-8',errors='ignore').read()
          srcs=re.findall(r'<script[^>]+src="([^"]+)"',html)
          needles=['all-meetups','collection','publicMapObjectsById','activeFeed','archivedFeed','GraphQL','graphql']
          print('=== BUNDLE MATCHES ===')
          for src in srcs[:80]:
              url=urllib.parse.urljoin(base,src)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  data=urllib.request.urlopen(req,timeout=15).read().decode('utf-8','ignore')
              except Exception as e:
                  continue
              hits=[n for n in needles if n in data]
              if not hits:
                  continue
              print('BUNDLE',url,'HITS',','.join(hits))
              for n in hits:
                  i=data.find(n)
                  if i>=0:
                      snippet=data[max(0,i-220):i+500].replace('\n',' ')
                      print('NEEDLE',n,'SNIPPET',snippet[:720])
          PY
          echo '=== RELAY ARTIFACT NAMES ==='
          python - <<'PY2'
          import re, urllib.parse, urllib.request
          html=open('/tmp/campfire.html',encoding='utf-8',errors='ignore').read()
          srcs=re.findall(r'<script[^>]+src="([^"]+)"',html)
          base='https://campfire.scopely.com'
          seen=set()
          for src in srcs:
              url=urllib.parse.urljoin(base,src)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  data=urllib.request.urlopen(req,timeout=15).read().decode('utf-8','ignore')
              except Exception:
                  continue
              names=set()
              for m in re.finditer(r'name:"([A-Za-z0-9_]+)"',data):
                  name=m.group(1)
                  window=data[max(0,m.start()-1200):m.end()+2200]
                  if 'operationKind:"query"' in window or 'kind:"Request"' in window:
                      names.add(name)
              for m in re.finditer(r'([A-Za-z][A-Za-z0-9_]*(?:Meetup|Collection|Discover)[A-Za-z0-9_]*)',data):
                  val=m.group(1)
                  if len(val)<120:
                      names.add(val)
              interesting=sorted(x for x in names if any(k.lower() in x.lower() for k in ['meetup','collection','discover','map']))
              if interesting:
                  print('BUNDLE',url)
                  for x in interesting[:120]:
                      if (url,x) not in seen:
                          print('NAME',x)
                          seen.add((url,x))
              for needle in ['operationKind:"query"','kind:"Request"','allMeetups','all_meetups','AllMeetups','collectionId']:
                  pos=data.find(needle)
                  if pos>=0 and ('all-meetups' in url or '/3310-' in url or '/8236-' in url or '/1121-' in url or '/1966-' in url or '/7484-' in url):
                      print('CONTEXT',url,needle,data[max(0,pos-800):pos+2400].replace('\n',' ')[:3200])
          PY2
          echo '=== TARGET QUERY ARTIFACT ==='
          python - <<'PY3'
          import urllib.request
          url='https://campfire-web-assets.nianticlabs.com/_next/static/chunks/3248-4db68ec4bf2822ee.js'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          data=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','ignore')
          for needle in [
              'DiscoveryMapObjectsProvider_meetupMapObjects_Query',
              'DiscoveryMapObjectsProvider_mapObjectsInLatLng_Query',
              'meetupMapObjectsByLiveEventIdInLatLngBounds',
              'realityChannelMapObjectsInLatLngBounds'
          ]:
              print('---',needle,'---')
              start=0
              count=0
              while True:
                  pos=data.find(needle,start)
                  if pos<0 or count>=5:
                      break
                  print(data[max(0,pos-2500):pos+9000].replace('\\n',' ')[:11500])
                  print()
                  start=pos+len(needle)
                  count+=1
          PY3
          echo '=== TARGET INPUT BUILDERS ==='
          python - <<'PY4'
          import urllib.request
          url='https://campfire-web-assets.nianticlabs.com/_next/static/chunks/3248-4db68ec4bf2822ee.js'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          data=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','ignore')
          for needle in [
              'realityChannelMapObjectsInLatLngBoundsInput:',
              'meetupMapObjectsByLiveEventIdInLatLngBoundsInput:',
              'fetchMeetupMapObjectsForCurrentLiveEvent',
              'fetchMeetupMapObjectsByLiveEventId',
              'mapObjectsInLatLngBounds'
          ]:
              print('---',needle,'---')
              start=0
              count=0
              while True:
                  pos=data.find(needle,start)
                  if pos<0 or count>=12: break
                  print(data[max(0,pos-3500):pos+6500].replace('\\n',' ')[:10000])
                  print()
                  start=pos+len(needle)
                  count+=1
          PY4
          echo '=== REALITY CHANNEL DEFAULTS ==='
          python - <<'PY5'
          import re, urllib.request
          urls=[
            'https://campfire-web-assets.nianticlabs.com/_next/static/chunks/3248-4db68ec4bf2822ee.js',
            'https://campfire-web-assets.nianticlabs.com/_next/static/chunks/1121-71d6a92e10785376.js',
            'https://campfire-web-assets.nianticlabs.com/_next/static/chunks/app/(web)/discover/layout-0f75c2dd1c3a2cc4.js'
          ]
          for url in urls:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              data=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','ignore')
              print('BUNDLE',url)
              for needle in ['selectedRealityChannelId','selectedRealityChannelSources','realityChannelId','realityChannelById','sources:', 'PGO']:
                  poses=[m.start() for m in re.finditer(re.escape(needle),data)]
                  print('NEEDLE',needle,'COUNT',len(poses))
                  for pos in poses[:8]:
                      print(data[max(0,pos-2200):pos+4200].replace('\\n',' ')[:6400])
                      print()
          PY5
