name: CI
on:
  pull_request:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect discovery defaults
        shell: bash
        run: |
          set -euo pipefail
          curl -LfsS -A 'Mozilla/5.0' 'https://campfire.scopely.com/discover/collection/all-meetups' -o /tmp/page.html
          python - <<'PY'
          import re, urllib.request
          html=open('/tmp/page.html',encoding='utf-8',errors='ignore').read()
          srcs=re.findall(r'<script[^>]+src="([^"]+)"',html)
          terms=['3481:function','selectedRealityChannelSources','selectedRealityChannelId','limitDropCount','zoomLevel','bounds:','hb:','n4:']
          for src in srcs:
              try:
                  data=urllib.request.urlopen(urllib.request.Request(src,headers={'User-Agent':'Mozilla/5.0'}),timeout=15).read().decode('utf-8','ignore')
              except Exception:
                  continue
              hits=[x for x in terms if x in data]
              if not hits: continue
              print('\nBUNDLE',src,'HITS',hits)
              for x in hits:
                  i=data.find(x)
                  print('\nTERM',x)
                  print(data[max(0,i-5000):i+10000].replace('\n',' ')[:15000])
          PY
