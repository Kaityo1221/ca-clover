name: CI

on:
  pull_request:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Campfire bundles for username profile queries
        shell: bash
        run: |
          set -euo pipefail
          URL='https://campfire.scopely.com/discover?language=ja'
          curl -LfsS -A 'Mozilla/5.0' "$URL" -o /tmp/page.html
          python - <<'PY'
          import re, urllib.request
          html=open('/tmp/page.html',encoding='utf-8',errors='ignore').read()
          srcs=re.findall(r'<script[^>]+src="([^"]+)"',html)
          terms=[
            'userByUsername','UserByUsername','profileByUsername','ProfileByUsername',
            'username_Query','UserProfile','ProfilePage','socialUser','clubs {',
            'communityMembership','memberOf','memberships'
          ]
          print('SCRIPT_COUNT',len(srcs))
          for src in srcs:
              try:
                  req=urllib.request.Request(src,headers={'User-Agent':'Mozilla/5.0'})
                  data=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','ignore')
              except Exception:
                  continue
              hits=[t for t in terms if t in data]
              if not hits: continue
              print('\nBUNDLE',src,'HITS',hits)
              for t in hits:
                  pos=0
                  n=0
                  while n<5:
                      i=data.find(t,pos)
                      if i<0: break
                      print('\nTERM',t)
                      print(data[max(0,i-2500):i+6500].replace('\n',' ')[:9000])
                      pos=i+len(t); n+=1
          PY
