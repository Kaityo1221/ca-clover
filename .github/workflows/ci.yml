name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test:share-url
      - run: npm run test:medal-contract
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check community claim Edge types
        run: deno check --node-modules-dir=auto supabase/functions/community-claim/index.ts
      - run: npm run build
