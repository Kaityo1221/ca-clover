name: One-time Compact Community Buttons

on:
  push:
    paths:
      - '.github/workflows/one-time-compact-community-buttons.yml'
      - '.github/scripts/compact_community_feature_buttons.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Preserve patch script
        run: cp .github/scripts/compact_community_feature_buttons.py /tmp/compact_community_feature_buttons.py
      - name: Switch to pages
        run: git fetch origin pages && git checkout pages
      - name: Compact Community feature buttons
        run: python /tmp/compact_community_feature_buttons.py
      - name: Syntax check embedded app script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('docs/index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          app=scripts[-1]
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False) as f:
              f.write(app)
              path=f.name
          subprocess.run(['node','--check',path],check=True)
          PY
      - name: Commit patch to pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          git commit -m 'ui: compact Community feature buttons'
          git push origin pages
