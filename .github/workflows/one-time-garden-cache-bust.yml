name: One-time Clover Garden cache bust

on:
  push:
    branches: [pages]
    paths:
      - .github/workflows/one-time-garden-cache-bust.yml

permissions:
  contents: write

jobs:
  cache-bust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages
          fetch-depth: 0
      - name: Bump Garden script version
        run: sed -i 's/clover-garden.js?v=20260926-gardentest2/clover-garden.js?v=20260926-garden-polish1/' docs/index.html
      - name: Verify change
        run: grep -q 'clover-garden.js?v=20260926-garden-polish1' docs/index.html
      - name: Commit cache bust
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "chore: bust Clover Garden script cache"
          git push origin HEAD:pages
