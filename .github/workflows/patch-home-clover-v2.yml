name: Patch home Clover cache v2

on:
  push:
    branches: [pages]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages
          fetch-depth: 0
      - name: Bust home Clover cache
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/index.html')
          s = p.read_text(encoding='utf-8')
          old = '<script src="./home-clover.js?v=20260926-1" defer></script>'
          new = '<script src="./home-clover.js?v=20260926-2" defer></script>'
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          elif new not in s:
              raise SystemExit('home Clover loader marker not found')
      - name: Commit patch
        run: |
          if git diff --quiet -- docs/index.html; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "chore: bust home Clover cache"
          git push origin HEAD:pages
