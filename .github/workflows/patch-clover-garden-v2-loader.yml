name: Patch Clover Garden v2 loader

on:
  push:
    branches: [pages]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages
          fetch-depth: 0
      - name: Patch loader
        run: python scripts/patch-clover-garden-v2-loader.py
      - name: Syntax check
        run: node --check docs/clover-garden.js
      - name: Commit patch
        run: |
          if git diff --quiet -- docs/index.html; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "feat: enable Clover Garden scrapbook v2"
          git push origin HEAD:pages
