name: One-time Clover Garden polish

on:
  push:
    branches: [pages]
    paths:
      - .github/workflows/one-time-garden-polish.yml

permissions:
  contents: write

jobs:
  patch-garden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages
          fetch-depth: 0

      - name: Apply Garden polish
        run: python scripts/one_time_garden_polish.py

      - name: Verify JavaScript syntax
        run: node --check docs/clover-garden.js

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- docs/clover-garden.js; then
            echo "No Garden changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/clover-garden.js
          git commit -m "fix: polish Clover Garden material and drop timing"
          git push origin HEAD:pages
