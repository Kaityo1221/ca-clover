name: One-time History Count

on:
  push:
    paths:
      - '.github/workflows/one-time-history-count.yml'
      - '.github/scripts/patch_history_limit.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Preserve patch script
        run: cp .github/scripts/patch_history_limit.py /tmp/patch_history_limit.py
      - name: Switch to pages
        run: git fetch origin pages && git checkout pages
      - name: Patch Meetup history count selector
        run: python /tmp/patch_history_limit.py
      - name: Commit patch to pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          git commit -m 'feat: switch Meetup history to 25 50 100 count selector'
          git push origin pages
