name: One-time period participation summary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-period-participation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages
      - name: Add period participation summary
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/index.html')
          s = p.read_text()
          s = s.replace('const VERSION="my-community-20260927-eventtag-reward1";', 'const VERSION="my-community-20260927-period-rate1";', 1)
          s = s.replace('.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}', '.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}', 1)
          s = s.replace('@media(max-width:760px){.g2,.g3{grid-template-columns:1fr}', '@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}', 1)
          old = '    const totalRsvp=Number(summary.rsvp_count||0);\n    const totalCheckin=Number(summary.checkin_count||0);\n    const caMeetups=Number(summary.ca_meetup_count||0);\n    const meetupCount=Number(summary.meetup_count||0);'
          new = old + '\n    const periodRate=totalRsvp>0?(totalCheckin/totalRsvp*100):null;\n    const periodRateText=periodRate==null?"算出不可":(Math.abs(periodRate-Math.round(periodRate))<0.05?String(Math.round(periodRate)):periodRate.toFixed(1))+"%";'
          assert old in s
          s = s.replace(old, new, 1)
          start_marker = "'<section class=\"grid g3 section\"><div class=\"metric\"><span class=\"tiny strong muted\">🔥 Meetup / '"
          end_marker = "'<div class=\"metric\"><span class=\"tiny strong muted\">✅ Check-in / '+e(periodLabel)+'</span><b>'+totalCheckin.toLocaleString(\"ja-JP\")+'</b></div></section>'"
          start = s.index(start_marker)
          end = s.index(end_marker, start) + len(end_marker)
          replacement = "'<section class=\"grid g4 section\"><div class=\"metric\"><span class=\"tiny strong muted\">🔥 Meetup / '+e(periodLabel)+'</span><b>'+meetupCount.toLocaleString(\"ja-JP\")+'</b></div>'+" + "'<div class=\"metric\"><span class=\"tiny strong muted\">🍀 CA Meetup / '+e(periodLabel)+'</span><b>'+caMeetups.toLocaleString(\"ja-JP\")+'</b></div>'+" + "'<div class=\"metric\"><span class=\"tiny strong muted\">✅ Check-in / '+e(periodLabel)+'</span><b>'+totalCheckin.toLocaleString(\"ja-JP\")+'</b></div>'+" + "'<div class=\"metric\"><span class=\"tiny strong muted\">📊 参加率 / '+e(periodLabel)+'</span><b>'+e(periodRateText)+'</b>'+(periodRate==null?'<div class=\"tiny muted strong\" style=\"margin-top:5px\">RSVP 0のため</div>':'<div class=\"tiny muted strong\" style=\"margin-top:5px\">RSVP → Check-in</div>')+'</div></section>'"
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
      - name: Commit patch to pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "feat: add period participation summary"
          git push origin HEAD:pages
