name: Patch Clover growth animation v1

on:
  push:
    branches: [pages]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages
          fetch-depth: 0
      - name: Apply Clover growth patch
        run: python scripts/patch-clover-growth-v1.py
      - name: Syntax check
        run: |
          node --check docs/monthly-clover.js
          node --check docs/home-clover.js
      - name: Commit patch
        run: |
          if git diff --quiet -- docs/monthly-clover.js docs/home-clover.js docs/index.html; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/monthly-clover.js docs/home-clover.js docs/index.html
          git commit -m "feat: add monthly Clover growth sequence"
          git push origin HEAD:pages
