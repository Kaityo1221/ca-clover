name: One-time Clover Garden natural drop

on:
  push:
    branches: [pages]
    paths:
      - .github/workflows/one-time-garden-natural-drop.yml

permissions:
  contents: write

jobs:
  patch-garden-natural-drop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages
          fetch-depth: 0

      - name: Apply Garden natural drop patch
        run: python scripts/one_time_garden_natural_drop.py

      - name: Verify JavaScript syntax
        run: node --check docs/clover-garden.js

      - name: Verify cache key
        run: grep -q 'garden-natural1' docs/index.html

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/clover-garden.js docs/index.html
          git commit -m "fix: make Clover Garden drop more natural"
          git push origin HEAD:pages
