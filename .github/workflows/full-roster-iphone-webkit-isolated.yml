name: Full Roster iPhone WebKit Isolated QA
on:
  push:
    branches:
      - feature/meetup-full-roster-ui-isolated-20261109
    paths:
      - docs/participant-export-ui.mjs
      - docs/participant-export/**
      - scripts/ci/test-full-roster-webkit.mjs
      - scripts/ci/fixtures/full-roster-webkit.html
      - .github/workflows/full-roster-iphone-webkit-isolated.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webkit-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned WebKit test engine in isolated temp folder
        run: |
          npm install --prefix .qa-browser --no-save --package-lock=false --ignore-scripts playwright@1.57.0
          .qa-browser/node_modules/.bin/playwright install --with-deps webkit
      - name: Run six iPhone WebKit flows with no real participant data or backend writes
        run: node scripts/ci/test-full-roster-webkit.mjs
