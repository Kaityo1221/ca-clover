name: One-time Nudge Community Buttons

on:
  push:
    paths:
      - '.github/workflows/one-time-nudge-community-buttons.yml'
      - '.github/scripts/nudge_community_feature_buttons.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Preserve patch script
        run: cp .github/scripts/nudge_community_feature_buttons.py /tmp/nudge_community_feature_buttons.py
      - name: Switch to pages
        run: git fetch origin pages && git checkout pages
      - name: Nudge Community feature buttons
        run: python /tmp/nudge_community_feature_buttons.py
      - name: Commit patch to pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          git commit -m 'ui: align Community feature buttons with CA tag row'
          git push origin pages
