<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5efe4">
<title>CA Clover | Monthly Clover B Preview</title>
<script src="./monthly-clover.js?v=20260925-b1"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f7f0e5,#fff 35rem);font-family:Inter,"Noto Sans JP",system-ui,-apple-system,sans-serif;color:#3f4541}.wrap{max-width:980px;margin:auto;padding:20px 16px 60px}.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}.back{color:#557c4b;font-weight:900;text-decoration:none}.title{font-size:clamp(25px,5vw,40px);margin:0;color:#405c36}.sub{color:#7b8792;font-weight:800;line-height:1.7}.panel{margin-top:18px;background:rgba(255,255,255,.84);border:1px solid #eadfce;border-radius:24px;padding:18px}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.ctrl{background:#fff;border:1px solid #e6dfd4;border-radius:18px;padding:12px}.ctrl b{display:block;color:#405c36}.ctrl select{width:100%;margin-top:8px;padding:10px;border:1px solid #d8ddcf;border-radius:12px;background:#fff;font:inherit;font-weight:900}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:14px;padding:11px 14px;background:#78c668;color:#214b2d;font-weight:950;cursor:pointer}.btn.line{background:#fff;border:1px solid #d8ddcf;color:#557c4b}.note{font-size:12px;color:#7b8792;font-weight:800;line-height:1.6}.axis-pop{position:fixed;inset:0;background:rgba(28,36,31,.38);display:grid;place-items:center;padding:16px;z-index:20}.axis-pop[hidden]{display:none}.axis-card{width:min(420px,100%);background:#fffaf2;border:1px solid #eadfce;border-radius:24px;padding:20px;box-shadow:0 28px 80px rgba(41,55,45,.22)}@media(max-width:680px){.controls{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><main class="wrap"><div class="top"><a class="back" href="./">← CA Clover</a></div><h1 class="title">公式クローバー B案 実装プレビュー 🍀</h1><p class="sub">やさしいイラスト調。4枚の葉を独立パーツとして扱い、Stage 0〜4を別々に変更できます。</p><div id="preview"></div><section class="panel"><h2>Stage確認</h2><div class="controls" id="controls"></div><div class="actions"><button class="btn" id="flipAll">4枚を順にめくる</button><button class="btn line" id="demoGrow">活動が増えた例</button><button class="btn line" id="reset">Stage 0へ戻す</button></div><p class="note">このページはデザイン確認用です。正式取得データには一切保存しません。</p></section></main><div class="axis-pop" id="axisPop" hidden><div class="axis-card"><div id="axisText"></div><button class="btn" id="closePop" style="width:100%;margin-top:12px">閉じる</button></div></div>
<script>
(function(){
 const axes=window.CAMonthlyClover.AXES;
 let stages={host:1,join:2,exchange:1,continue:3};
 const preview=document.getElementById("preview"),controls=document.getElementById("controls");
 function detail(key,stage){const map={host:["まだ開催記録はありません","Meetup 1回","Meetup 2回","Meetup 3回","Meetup 4回以上"],join:["Check-in記録なし","Check-in 1〜4","Check-in 5〜14","Check-in 15〜29","Check-in 30以上"],exchange:["交換記録なし","新しい交流 1人","新しい交流 2人","新しい交流 3〜4人","新しい交流 5人以上"],continue:["活動週なし","1週活動","2週活動","3週活動","4週以上活動"]};return map[key][stage]}
 function render(){const details={};axes.forEach(a=>details[a.key]=detail(a.key,stages[a.key]));preview.innerHTML=window.CAMonthlyClover.cardHtml({date:new Date(),stages,details});bindCard()}
 function renderControls(){controls.innerHTML=axes.map(a=>'<label class="ctrl"><b>'+a.icon+' '+a.label+'</b><select data-stage="'+a.key+'">'+[0,1,2,3,4].map(n=>'<option value="'+n+'" '+(stages[a.key]===n?'selected':'')+'>Stage '+n+'</option>').join("")+'</select></label>').join("");controls.querySelectorAll("[data-stage]").forEach(s=>s.onchange=()=>{const key=s.dataset.stage;stages[key]=Number(s.value);render();setTimeout(()=>window.CAMonthlyClover.flip(preview,key),30)})}
 function bindCard(){preview.querySelectorAll("[data-clover-axis]").forEach(b=>b.onclick=()=>{const key=b.dataset.cloverAxis,a=axes.find(x=>x.key===key);document.getElementById("axisText").innerHTML='<div style="font-size:12px;font-weight:950;color:#8e7758">'+a.position+'の葉</div><h2 style="margin:6px 0;color:#405c36">'+a.icon+' '+a.label+'</h2><p class="note">現在 Stage '+stages[key]+'。'+detail(key,stages[key])+'。</p>';document.getElementById("axisPop").hidden=false})}
 render();renderControls();
 document.getElementById("flipAll").onclick=()=>axes.forEach((a,i)=>setTimeout(()=>window.CAMonthlyClover.flip(preview,a.key),i*280));
 document.getElementById("demoGrow").onclick=()=>{stages={host:3,join:4,exchange:2,continue:3};render();renderControls();setTimeout(()=>axes.forEach((a,i)=>setTimeout(()=>window.CAMonthlyClover.flip(preview,a.key),i*260)),80)};
 document.getElementById("reset").onclick=()=>{stages={host:0,join:0,exchange:0,continue:0};render();renderControls()};
 document.getElementById("closePop").onclick=()=>document.getElementById("axisPop").hidden=true;document.getElementById("axisPop").onclick=e=>{if(e.target.id==="axisPop")e.currentTarget.hidden=true};
})();
</script></body></html>
