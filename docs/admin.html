<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#84cc16">\n<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n<meta http-equiv="Pragma" content="no-cache">\n<meta http-equiv="Expires" content="0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--clover-50:#f7fee7;--clover-100:#ecfccb;--clover-200:#d9f99d;--clover-300:#bef264;--clover-400:#a3e635;--clover-700:#4d7c0f;--ink:#213018;--line:#e5eed7;--bg:#f8fce9;font-family:Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:var(--ink);background:var(--bg)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 0 0,rgba(190,242,100,.30),transparent 30rem),linear-gradient(180deg,#fbfff4 0%,var(--bg) 100%)}
button,input,select,textarea{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}
.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.90);backdrop-filter:blur(20px);border-bottom:1px solid var(--clover-100)}
.topin{max-width:1152px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:16px;background:var(--clover-300);display:grid;place-items:center;font-size:24px}
.brand{font-weight:950;color:#1f3b0b}.sub{font-size:11px;font-weight:800;color:var(--clover-700)}.grow{flex:1}
.wrap{max-width:1024px;margin:0 auto;padding:32px 16px 72px}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button,.nav a{border:0;border-radius:999px;padding:9px 13px;background:#f7fee7;color:#4d7c0f;font-weight:900}
.card{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 14px 40px rgba(77,124,15,.08)}
.hero{background:linear-gradient(135deg,var(--clover-100),#fff,#ecfdf5);border-radius:30px}h1,h2,h3{margin:0;color:#365314}h1{font-size:clamp(28px,5vw,42px);letter-spacing:-.03em}h2{font-size:22px}
p{line-height:1.65}.muted{color:#64748b}.small{font-size:12px}.tiny{font-size:11px}.strong{font-weight:900}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.section{margin-top:18px}.row{display:flex;align-items:flex-start;gap:12px}.between{justify-content:space-between}.wraprow{flex-wrap:wrap}.center{text-align:center}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:6px 10px;background:#ecfccb;color:#4d7c0f;font-size:12px;font-weight:900}
.pill.amber{background:#fef3c7;color:#92400e}.pill.rose{background:#ffe4e6;color:#be123c}.pill.blue{background:#e0f2fe;color:#075985}.pill.violet{background:#ede9fe;color:#6d28d9}.pill.slate{background:#f1f5f9;color:#475569}.pill.dark{background:#0f172a;color:#fff}
.btn{border:0;border-radius:15px;padding:12px 15px;font-weight:950;background:#84cc16;color:#1a2e05}.btn.line{background:#fff;border:1px solid #d9f99d;color:#4d7c0f}.btn.rose{background:#fff1f2;border:1px solid #fecdd3;color:#be123c}.btn.dark{background:#365314;color:#fff}.btn:disabled{opacity:.42;cursor:not-allowed}
.input{width:100%;border:1px solid #d9f99d;border-radius:15px;padding:12px 14px;background:#fff;font-weight:750;outline:none}.input:focus{border-color:#84cc16;box-shadow:0 0 0 4px rgba(132,204,22,.12)}
.notice{border-radius:18px;padding:13px 15px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-size:12px;font-weight:800;line-height:1.6}.notice.ok{background:#f0fdf4;border-color:#bbf7d0;color:#166534}.notice.err{background:#fff1f2;border-color:#fecdd3;color:#be123c}
.menu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}@keyframes adminAttention{0%,100%{box-shadow:0 14px 40px rgba(245,158,11,.08);border-color:#fde68a;background:#fff}50%{box-shadow:0 0 0 4px rgba(245,158,11,.18),0 20px 46px rgba(245,158,11,.20);border-color:#f59e0b;background:#fffbeb}}.menucard{position:relative;min-height:160px;text-align:left;transition:.18s transform,.18s border-color,.18s box-shadow}.menucard.attention{animation:adminAttention 1.45s ease-in-out infinite}.menucard:hover{transform:translateY(-4px);border-color:var(--clover-300);box-shadow:0 20px 45px rgba(77,124,15,.14)}.menucard .icon{display:grid;width:48px;height:48px;place-items:center;border-radius:16px;background:var(--clover-100);font-size:28px}.menucard .count{position:absolute;right:14px;top:14px}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #f1f5f9;text-align:left;vertical-align:top;font-size:12px}.table th{color:#64748b;font-size:11px}
.claim{border:1px solid #ecfccb;border-radius:20px;padding:16px;background:#fff}.claim+.claim{margin-top:10px}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.metric{padding:16px;border-radius:20px;background:#fff;border:1px solid #ecfccb}.metric b{display:block;font-size:26px;color:#365314;margin-top:4px}
.progress{height:12px;background:#f7fee7;border-radius:999px;overflow:hidden}.bar{height:100%;background:#a3e635;border-radius:999px;transition:.2s width}
.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{border:1px solid #d9f99d;background:#fff;color:#4d7c0f;border-radius:999px;padding:9px 14px;font-weight:950}.tab.on{background:#a3e635}
.previewbox{border-radius:28px;border:1px solid #dbeafe;background:#f8fafc;padding:18px}.device{margin:0 auto;overflow:hidden;border-radius:26px;border:1px solid #dbeafe;background:#fff;box-shadow:0 14px 40px rgba(15,23,42,.08)}.device.desktop{max-width:1000px}.device.mobile{max-width:430px}
.hl{background:#fecaca;color:#991b1b;padding:0 2px;border-radius:4px}.stickytools{position:sticky;top:75px;z-index:20}
pre.json{white-space:pre-wrap;word-break:break-word;background:#0f172a;color:#e2e8f0;padding:14px;border-radius:16px;max-height:300px;overflow:auto;font-size:11px}

.iconstamps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.iconstamp{position:relative;border:1px dashed #d9f99d;background:rgba(255,255,255,.92);border-radius:28px;padding:16px;text-align:center;transition:.18s transform,.18s box-shadow,.18s border-color}
.iconstamp:nth-child(3n+1){transform:rotate(-.6deg)}.iconstamp:nth-child(3n+2){transform:rotate(.6deg)}
.iconstamp.pending{border:2px solid #fbbf24;background:#fffbeb;animation:adminAttention 1.45s ease-in-out infinite}
.iconstamp .avatar{width:92px;height:92px;margin:0 auto;border-radius:999px;overflow:hidden;border:4px solid #fff;background:#f7fee7;display:grid;place-items:center;font-size:38px;box-shadow:0 8px 22px rgba(77,124,15,.14)}
.iconstamp .avatar{position:relative}.iconstamp .avatar .icon-fallback{position:absolute;inset:0;display:grid;place-items:center}.iconstamp .avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.stampname{font-weight:950;color:#365314;margin-top:10px;line-height:1.3}.stamparea{font-size:11px;font-weight:800;color:#65a30d;margin-top:4px}.stampdetail{font-size:11px;font-weight:950;color:#4d7c0f;margin-top:10px}.icongroup+.icongroup{margin-top:30px}.icongrouptitle{display:flex;align-items:center;gap:8px;margin:0 0 12px}.iconsearch{margin-top:16px}
.adminmodalback{position:fixed;inset:0;z-index:120;background:rgba(15,23,42,.48);overflow-y:auto;padding:16px;display:flex;align-items:center;justify-content:center}
.adminmodal{width:min(680px,100%);max-height:calc(100dvh - 32px);overflow-y:auto;background:#fff;border-radius:30px;padding:22px;box-shadow:0 30px 80px rgba(15,23,42,.28)}
.compareicons{display:grid;grid-template-columns:1fr 1fr;gap:14px}.comparebox{background:#f8fafc;border-radius:22px;padding:14px;text-align:center}.comparebox .avatar{width:132px;height:132px;margin:10px auto 0;border-radius:999px;overflow:hidden;border:4px solid #fff;background:#fff;display:grid;place-items:center}.comparebox img{width:100%;height:100%;object-fit:cover}
.leveltabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.leveltab{border:1px solid #d9f99d;background:#fff;color:#4d7c0f;border-radius:16px;padding:12px 8px;font-weight:950}.leveltab.on{background:#a3e635;border-color:#84cc16;color:#365314}
@media(max-width:820px){.iconstamps{grid-template-columns:repeat(2,minmax(0,1fr))}.compareicons{grid-template-columns:1fr}.adminmodalback{align-items:flex-start;padding:12px}.adminmodal{max-height:calc(100dvh - 24px)}}

@media(max-width:820px){#masterSummary{grid-template-columns:repeat(2,minmax(0,1fr))!important}.menu,.g3,.g2{grid-template-columns:1fr}.topin{align-items:flex-start}.brandblock{display:none}.nav{max-width:62vw;justify-content:flex-end}.wrap{padding-top:14px}.card{padding:17px}.table{display:block;overflow:auto}}
</style>

<body>
<header class="top"><div class="topin">
  <a class="logo" href="./">🍀</a>
  <div class="brandblock"><div class="brand">CA Clover</div><div class="sub">Japan Community Activity Dashboard</div></div>
  <div class="grow"></div>
  <nav class="nav"><a href="./">一般ユーザーページ</a><button id="homeBtn">管理メニュー</button><button id="logoutBtn">ログアウト</button></nav>
</div></header>
<main id="app" class="wrap"></main>
<script>
(function(){
"use strict";
const SUPABASE_URL="https://wgiittrvgtiosogyhfcl.supabase.co";
const SUPABASE_KEY="sb_publishable_QTCqijfNvnysUTMylNIyTA_6ngosaPN";
const ROOT="https://kaityo1221.github.io/ca-clover/";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce"}});
const app=document.getElementById("app");
let session=null,profile=null,busy=false;
function e(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c])}
function fmt(v){if(!v)return "—";const d=new Date(v);return Number.isFinite(d.getTime())?d.toLocaleString("ja-JP"):"—"}
function num(v){return Number(v||0).toLocaleString("ja-JP")}
function route(){return (location.hash||"#home").slice(1)}
function go(r){location.hash=r}
function statusPill(s){const cls=s==="success"||s==="approved"||s==="ready"?"":s==="pending"||s==="running"||s==="partial"?"amber":"rose";return '<span class="pill '+cls+'">'+e(s)+'</span>'}
function msg(text,type){return '<div class="notice '+(type||"")+' section">'+e(text)+'</div>'}
async function loadAuth(){
 const r=await client.auth.getSession();session=r.data.session||null;
 if(session){const p=await client.from("profiles").select("role,niantic_id,email").eq("id",session.user.id).maybeSingle();profile=p.data||null}
}
async function login(){await client.auth.signInWithOAuth({provider:"google",options:{redirectTo:ROOT+"admin.html"}})}
async function logout(){await client.auth.signOut();location.href=ROOT}
document.getElementById("homeBtn").onclick=()=>go("home");
document.getElementById("logoutBtn").onclick=logout;
window.addEventListener("hashchange",render);
window.addEventListener("focus",()=>{if(route()==="assignments") void assignments();});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&route()==="assignments") void assignments();});

async function guard(){
 if(!session){app.innerHTML='<section class="card center" style="max-width:480px;margin:8vh auto"><div style="font-size:50px">🍀</div><h1 class="section">CA Clover ADMIN</h1><p class="muted strong">ログインが必要です。</p><button id="loginBtn" class="btn section">Googleでログイン</button></section>';document.getElementById("loginBtn").onclick=login;return false}
 if(profile?.role!=="admin"){app.innerHTML='<section class="card center" style="max-width:480px;margin:8vh auto"><div style="font-size:50px">🔒</div><h2 class="section">ADMIN専用です</h2><p class="muted strong">このアカウントにはADMIN権限がありません。</p></section>';return false}
 return true;
}
function title(back,badge,heading,desc){
 return (back?'<button class="btn line" onclick="location.hash=\''+back+'\'">← 戻る</button>':'')+
 '<section class="card hero section"><span class="pill '+(badge==="ADMIN"?"violet":"")+'">'+e(badge)+'</span><h1 style="margin-top:10px">'+heading+'</h1>'+(desc?'<p class="muted strong">'+desc+'</p>':'')+'</section>';
}

async function dashboard(){
 app.innerHTML='<button class="btn line" onclick="location.href=\'./\'">← CA Clover Home</button><span class="pill section">管理する</span><h1 class="section">⚙️ 管理メニュー</h1><p class="muted strong">ADMIN権限でログイン中</p>';
 const [claims,watch,icons,caCount,communityRows,membershipRows]=await Promise.all([
  client.from("community_access_requests").select("id",{count:"exact",head:true}).eq("status","pending"),
  client.from("meetup_watch_cases").select("id",{count:"exact",head:true}).eq("review_required",true).eq("status","unreviewed"),
  client.from("community_icon_changes").select("id",{count:"exact",head:true}).eq("change_type","changed").is("reviewed_at",null),
  client.from("ca_members").select("id",{count:"exact",head:true}),
  client.from("communities").select("id"),
  client.from("community_memberships").select("community_id")
 ]);
 const assignedCommunityIds=new Set((membershipRows.data||[]).map(x=>x.community_id));
 const unassignedCount=(communityRows.data||[]).filter(x=>!assignedCommunityIds.has(x.id)).length;
 const items=[
  ["map","🗾","Activity Map","全国Communityの活動を地図で確認",0],
  ["icons","🖼️","アイコン一覧","アイコン一覧とCommunity詳細",icons.count||0],
  ["watch","🔍","要確認Meetup",(watch.count||0)+"件の未確認",watch.count||0],
  ["claims","🛎️","Community申請",(claims.count||0)+"件の承認待ち",claims.count||0],
  ["ca","🏕️","CA一覧",(caCount.count||0)+" CA / 1st・2nd切替",0],
  ["campfire","🔐","Campfire接続","tokenと接続状態を管理",0],
  ["sync","🔄","データ同期","Campfire Activityを全国更新",0],
  ["assignments","🔗","Community権限調整","通常は自動割当 / 手動補正用",unassignedCount],
  ["preview","👀","一般ユーザーページ","一般ユーザーUIを確認",0],
  ["accounts","👥","CAアカウント","pending / CA / ADMINを管理",0],
  ["sync-runs","🧾","同期履歴","最新100件の同期結果",0],
  ["coverage","📊","Data Coverage","全国取得状態・未解決CAを確認",0],
  ["windows","🕐","イベント時間マスター","公式イベント時間窓",0],
  ["general","🏠","ホームへ","カテゴリホームに戻る",0],
  ["stamp-rally","🍀","CA Stamp Rally LAB","全国スタンプシートUIを確認",0],
 ];
 app.innerHTML+='<div class="menu section">'+items.map(x=>'<button class="card menucard '+((x[0]==="watch"||x[0]==="claims"||x[0]==="icons")&&x[4]?'attention':'')+'" data-route="'+x[0]+'"><div class="icon">'+x[1]+'</div><h3 class="section">'+x[2]+'</h3><p class="small muted strong">'+x[3]+'</p>'+(x[4]?'<span class="pill '+(x[0]==="assignments"?'slate':'amber')+' count">'+(x[0]==="assignments"?'未割当 ':x[0]==="icons"?'要確認 ':'')+x[4]+'</span>':'')+'</button>').join("")+'</div>';
 app.innerHTML+='<div class="section center"><a href="./changelog.html" class="tiny muted strong">更新履歴</a></div>';
 app.querySelectorAll("[data-route]").forEach(b=>b.onclick=()=>{if(b.dataset.route==="general")location.href="./";else if(b.dataset.route==="map")location.href="./map.html";else if(b.dataset.route==="stamp-rally")location.href="./stamp-rally.html";else go(b.dataset.route)});
}

async function claims(){
 app.innerHTML=title("home","CLAIMS","🛎️ Community申請","Community招待URL / ミートアップ共有URLからの申請を審査します。")+'<div id="claimList" class="section">'+msg("読み込み中...")+'</div>';
 const [rq,pr]=await Promise.all([
  client.from("community_access_requests").select("id,user_id,meetup_title,meetup_url,input_url,request_source,community_name_snapshot,community_prefecture_snapshot,is_ca_meetup,master_match,creator_display_name,creator_username,creator_username_matches_profile,creator_ca_badge_verified,ca_level_snapshot,ca_role_verified,ca_map_status,status,requested_at,reviewed_at").order("requested_at",{ascending:false}).limit(200),
  client.from("profiles").select("id,email,niantic_id,role")
 ]);
 const profiles={};(pr.data||[]).forEach(x=>profiles[x.id]=x);
 const rows=rq.data||[];
 document.getElementById("claimList").innerHTML=rows.length?rows.map(c=>{
  const p=profiles[c.user_id]||{},invite=c.request_source==="community_invite";
  const mapFallback=!invite&&c.ca_map_status==="not_listed"&&c.creator_ca_badge_verified===true&&c.creator_username_matches_profile===true&&c.is_ca_meetup===true;
  const can=c.status==="pending"&&(invite||c.creator_ca_badge_verified===true)&&c.creator_username_matches_profile===true&&(mapFallback||(c.ca_role_verified===true&&c.ca_map_status==="matched"));
  return '<section class="claim"><div class="row between wraprow"><div><div class="tiny strong" style="color:#65a30d">'+e(c.community_prefecture_snapshot||"—")+'</div><h2 style="margin-top:4px">'+e(c.community_name_snapshot)+'</h2><div class="small muted strong">'+e(p.email||"—")+' / '+e(p.niantic_id||"未登録")+'</div></div>'+statusPill(c.status)+'</div><div class="tags"><span class="pill '+(invite?"":"violet")+'">'+(invite?"コミュニティ招待URL":"ミートアップ共有URL")+'</span><span class="pill '+(c.creator_username_matches_profile===true?"blue":"rose")+'">Niantic ID '+(c.creator_username_matches_profile===true?"一致":"不一致")+'</span><span class="pill '+(c.ca_map_status==="matched"?"":"rose")+'">CA地図 '+e(c.ca_map_status||"未確認")+'</span>'+(invite?"":'<span class="pill '+(c.creator_ca_badge_verified===true?"":"rose")+'">紫CA '+(c.creator_ca_badge_verified===true?"確認済み":"未確認")+'</span>')+'</div>'+(c.input_url?'<p class="small"><a target="_blank" rel="noreferrer" href="'+e(c.input_url)+'" style="color:#65a30d;font-weight:900">Campfireを確認 ↗</a></p>':'')+(c.status==="pending"?'<div class="actions"><button class="btn rose" data-review="reject" data-id="'+c.id+'">却下</button><button class="btn" data-review="approve" data-id="'+c.id+'" '+(can?"":"disabled")+'>承認</button></div>':'')+(c.ca_map_status==="not_listed"?'<div class="notice section">'+(mapFallback?'日本CA地図は未掲載ですが、本人主催Meetup・Niantic ID一致・紫CAバッジをCampfireで確認済みです。ADMIN手動審査で承認できます。':'日本CA地図に未掲載です。本人主催Meetupで追加確認してください。')+'</div>':'')+'<div class="tiny muted section">申請 '+e(fmt(c.requested_at))+'</div></section>';
 }).join(""):'<section class="card center">申請はありません 🍀</section>';
 app.querySelectorAll("[data-review]").forEach(b=>b.onclick=async()=>{b.disabled=true;const r=await client.functions.invoke("community-claim",{body:{action:b.dataset.review,requestId:b.dataset.id}});if(r.error)alert(r.error.message);await claims()});
}

async function caList(){
 app.innerHTML=title("home","CA MASTER","🏕️ CA一覧","1st / 2ndを切り替えて確認できます。")+'<div id="caTabs" class="leveltabs section"></div><div id="caList" class="grid g3 section">'+msg("読み込み中...")+'</div>';
 const r=await client.from("ca_members").select("id,trainer_name,ca_level,prefecture,join_date,status").order("prefecture").order("trainer_name");
 const rows=r.data||[];let filter="all";
 const counts={all:rows.length,"1st":rows.filter(x=>x.ca_level==="1st").length,"2nd":rows.filter(x=>x.ca_level==="2nd").length};
 function draw(){
  document.getElementById("caTabs").innerHTML=[["all","全員"],["1st","1st"],["2nd","2nd"]].map(x=>'<button class="leveltab '+(filter===x[0]?"on":"")+'" data-level="'+x[0]+'">'+x[1]+' <span class="tiny">'+counts[x[0]]+'</span></button>').join("");
  const visible=filter==="all"?rows:rows.filter(x=>x.ca_level===filter);
  document.getElementById("caList").innerHTML=visible.map(x=>'<section class="claim"><div class="row between"><div class="tiny strong" style="color:#65a30d">'+e(x.prefecture||"—")+'</div><span class="pill '+(x.ca_level==="2nd"?"blue":"")+'">'+e(x.ca_level||"CA")+'</span></div><h3 class="section">'+e(x.trainer_name)+'</h3><div class="small muted strong">就任: '+e(x.join_date||"未取得")+'</div><div class="small muted strong">Status: '+e(x.status||"—")+'</div></section>').join("");
  document.querySelectorAll("[data-level]").forEach(b=>b.onclick=()=>{filter=b.dataset.level;draw()});
 }
 draw();
}

async function icons(){
 app.innerHTML=title("home","ICON REVIEW","🖼️ アイコン一覧","アイコンから全国のCommunityを探して詳細を確認できます。実際のアイコン変更だけ要確認として表示します。")+'<div id="iconSummary" class="section"></div><div class="iconsearch"><input id="iconSearch" class="input" placeholder="Community名・都道府県で検索"></div><div id="iconGroups" class="section">'+msg("読み込み中...")+'</div>';

 }
 document.getElementById("unresolvedBtn").onclick=()=>{open=!open;drawUnresolved()};
 function draw(){const q=document.getElementById("covSearch").value.trim().toLowerCase(),f=rows.filter(x=>!q||(x.name+" "+(x.prefecture||"")).toLowerCase().includes(q));const complete=rows.filter(x=>x.coverage==="complete").length,partial=rows.filter(x=>x.coverage==="partial").length,missing=rows.filter(x=>x.coverage==="missing").length;document.getElementById("covSummary").innerHTML='<div class="metric"><span class="tiny strong muted">Complete</span><b>'+complete+'</b></div><div class="metric"><span class="tiny strong muted">Partial</span><b>'+partial+'</b></div><div class="metric"><span class="tiny strong muted">Missing</span><b>'+missing+'</b></div>';document.getElementById("covList").innerHTML=f.map(x=>'<section class="claim"><div class="row between wraprow"><div><div class="tiny strong" style="color:#65a30d">'+e(x.prefecture||"—")+'</div><h3>'+e(x.name)+'</h3><div class="small muted strong">Member '+num(x.member_count)+'</div></div>'+statusPill(x.coverage||"missing")+'</div><div class="tags">'+(byCommunity[x.id]||[]).filter(Boolean).map(a=>'<span class="pill">'+e(a.ca_level||"CA")+': '+e(a.trainer_name)+'</span>').join("")+'</div><div class="grid g3 section"><div><div class="tiny muted strong">開始</div>'+e(fmt(x.coverage_from))+'</div><div><div class="tiny muted strong">終了</div>'+e(fmt(x.coverage_to))+'</div><div><div class="tiny muted strong">最終取得</div>'+e(fmt(x.fetched_at))+'</div></div></section>').join("")}
 document.getElementById("covSearch").oninput=draw;draw();

async function watch(){
 app.innerHTML=title("home","MEETUP WATCH v1.0","🔍 要確認Meetup","検知した事実と理由を表示し、最終判断はADMINが行います。")+'<div class="actions section"><button id="discordTest" class="btn line">🔔 Discordテスト通知</button><button id="windowsBtn" class="btn line">🕐 イベント時間マスター</button></div><div id="watchMsg"></div><div id="watchList" class="section">'+msg("読み込み中...")+'</div>';
 document.getElementById("windowsBtn").onclick=()=>go("windows");
 document.getElementById("discordTest").onclick=async()=>{const r=await client.functions.invoke("meetup-watch-notify",{body:{action:"test"}});document.getElementById("watchMsg").innerHTML=r.error?msg(r.error.message,"err"):msg("Discordテスト通知を送信しました","ok")};
 const cr=await client.from("meetup_watch_cases").select("id,meetup_id,community_id,status,review_required,score,priority,priority_level,high_priority,discord_candidate,is_hot_trigger,flags,reason_summary,last_evaluated_at").eq("review_required",true).eq("status","unreviewed").order("priority",{ascending:false}).order("score",{ascending:false}).limit(100);
 const cases=cr.data||[],ids=cases.map(x=>x.meetup_id),cids=[...new Set(cases.map(x=>x.community_id).filter(Boolean))];
 const [mr,fr,com,hot]=await Promise.all([
  ids.length?client.from("meetups").select("id,community_id,title,details,starts_at,ends_at,location,event_url,campfire_created_at,rsvp_count,checkin_count").in("id",ids):Promise.resolve({data:[]}),
  ids.length?client.from("meetup_watch_findings").select("id,meetup_id,flag_code,reason,score_weight,matched_field,matched_text,active").in("meetup_id",ids).eq("active",true):Promise.resolve({data:[]}),
  cids.length?client.from("communities").select("id,name,prefecture").in("id",cids):Promise.resolve({data:[]}),
  cids.length?client.from("watch_community_state").select("community_id,hot_until,hot_reasons").in("community_id",cids):Promise.resolve({data:[]})
 ]);
 const mm=new Map((mr.data||[]).map(x=>[x.id,x])),cm=new Map((com.data||[]).map(x=>[x.id,x])),hm=new Map((hot.data||[]).map(x=>[x.community_id,x]));
 function duration(a,b){if(!a||!b)return null;const d=(Date.parse(b)-Date.parse(a))/60000;return Number.isFinite(d)?Math.round(d):null}
 document.getElementById("watchList").innerHTML=cases.length?cases.map(cs=>{const m=mm.get(cs.meetup_id);if(!m)return"";const community=cm.get(cs.community_id),find=(fr.data||[]).filter(x=>x.meetup_id===m.id),h=hm.get(cs.community_id),hotActive=h?.hot_until&&Date.parse(h.hot_until)>Date.now();return '<section class="claim"><div class="row between wraprow"><div><div class="tiny strong" style="color:#65a30d">'+e(community?.prefecture||"—")+' / '+e(community?.name||"Community未取得")+'</div><h2 class="section">'+e(m.title)+'</h2></div><div class="tags">'+(hotActive?'<span class="pill amber">🔥 HOT監視中</span>':'')+'<span class="pill amber">'+(cs.high_priority?"🟠 高優先":"🟡 要確認")+' / '+e(cs.score)+'点</span>'+(cs.discord_candidate?'<span class="pill dark">Discord対象</span>':'')+'</div></div><div class="section" style="white-space:pre-wrap;background:#f8fafc;border-radius:16px;padding:14px">'+(m.details?e(m.details):'<span class="muted">概要なし</span>')+'</div><div class="grid g3 section small strong muted"><div>🕒 '+e(fmt(m.starts_at))+'</div><div>⏱️ '+e(duration(m.starts_at,m.ends_at)??"—")+'分</div><div>📍 '+e(m.location||"未取得")+'</div><div>📨 RSVP '+e(m.rsvp_count??"—")+'</div><div>✅ Check-in '+e(m.checkin_count??"—")+'</div></div><div class="tags">'+(cs.flags||[]).map(x=>'<span class="pill slate">'+e(x)+'</span>').join("")+'</div><div class="section">'+find.map(x=>'<div class="small muted strong">・'+e(x.reason)+' <b>+'+e(x.score_weight)+'</b></div>').join("")+'</div><div class="actions section"><select class="input" style="max-width:190px" data-case="'+cs.id+'">'+[["unreviewed","未確認"],["contact_host","本人確認"],["no_issue","問題なし"],["sop_in_progress","対応中"],["completed","完了"]].map(x=>'<option value="'+x[0]+'" '+(x[0]===cs.status?"selected":"")+'>'+x[1]+'</option>').join("")+'</select>'+(m.event_url?'<a class="btn line" target="_blank" rel="noreferrer" href="'+e(m.event_url)+'">Campfireを開く ↗</a>':'')+'</div></section>'}).join(""):'<section class="card center"><div style="font-size:40px">🍀</div><h3 class="section">現在、要確認Meetupはありません</h3></section>';
 app.querySelectorAll("[data-case]").forEach(s=>s.onchange=async()=>{s.disabled=true;const r=await client.functions.invoke("meetup-watch-admin",{body:{action:"set_status",caseId:s.dataset.case,status:s.value}});if(r.error)alert(r.error.message);else await watch()});
}

async function windows(){
 app.innerHTML=title("watch","EVENT WINDOWS","🕐 イベント時間マスター","みんポケiCal参照データと手動補正を管理します。")+'<div class="actions section"><button id="syncCalendar" class="btn">🔄 みんポケから今すぐ同期</button></div><div id="winMsg"></div><section class="card section"><h2>手動追加・補正</h2><div class="grid g2 section"><input id="evName" class="input" placeholder="イベント名"><input id="evNote" class="input" placeholder="メモ"><input id="evStart" class="input" type="datetime-local"><input id="evEnd" class="input" type="datetime-local"></div><button id="evAdd" class="btn section">登録</button></section><div id="winList" class="section"></div><div id="longList" class="section"></div>';
 async function load(){const from=new Date(Date.now()-7*86400000).toISOString();const [w,c]=await Promise.all([client.from("official_event_windows").select("id,event_name,starts_at,ends_at,enabled,notes,source,auto_managed").order("starts_at",{ascending:false}),client.from("event_calendar_entries").select("id,event_name,starts_at,ends_at,duration_minutes,watch_window_eligible,is_all_day,last_seen_at").gte("ends_at",from).order("starts_at",{ascending:true}).limit(300)]);document.getElementById("winList").innerHTML='<h2>Watchで使う時間窓</h2><div class="section">'+(w.data||[]).map(x=>'<section class="claim"><div class="row between wraprow"><div><h3>'+e(x.event_name)+'</h3><div class="small muted strong">'+e(fmt(x.starts_at))+' 〜 '+e(fmt(x.ends_at))+'</div><div class="tiny muted">'+e(x.source)+'</div></div><button class="btn '+(x.enabled?"":"line")+'" data-window="'+x.id+'" data-on="'+(x.enabled?"1":"0")+'">'+(x.enabled?"ON":"OFF")+'</button></div></section>').join("")+'</div>';const longs=(c.data||[]).filter(x=>!x.watch_window_eligible);document.getElementById("longList").innerHTML='<h2>長期イベント・参考のみ</h2><div class="section">'+longs.slice(0,60).map(x=>'<section class="claim"><div class="row between"><div><h3>'+e(x.event_name)+'</h3><div class="small muted strong">'+e(fmt(x.starts_at))+' 〜 '+e(fmt(x.ends_at))+'</div></div><span class="pill slate">'+e(x.duration_minutes)+'分</span></div></section>').join("")+'</div>';document.querySelectorAll("[data-window]").forEach(b=>b.onclick=async()=>{await client.from("official_event_windows").update({enabled:b.dataset.on!=="1",updated_at:new Date().toISOString()}).eq("id",b.dataset.window);await load()})}
 document.getElementById("syncCalendar").onclick=async()=>{const r=await client.functions.invoke("sync-event-calendar",{body:{}});document.getElementById("winMsg").innerHTML=r.error?msg(r.error.message,"err"):msg("同期完了","ok");await load()};
 document.getElementById("evAdd").onclick=async()=>{const name=document.getElementById("evName").value.trim(),st=document.getElementById("evStart").value,en=document.getElementById("evEnd").value;if(!name||!st||!en)return;const r=await client.from("official_event_windows").insert({event_name:name,starts_at:new Date(st).toISOString(),ends_at:new Date(en).toISOString(),notes:document.getElementById("evNote").value.trim()||null,source:"manual",auto_managed:false,enabled:true,updated_at:new Date().toISOString()});if(r.error)alert(r.error.message);else await load()};await load();
}

 const cr=await client.from("communities").select("id,name,prefecture,member_count,campfire_url").order("prefecture").order("name");const rows=cr.data||[],sel=document.getElementById("prevCommunity");sel.innerHTML=rows.map(x=>'<option value="'+x.id+'">'+e((x.prefecture?x.prefecture+" / ":"")+x.name)+'</option>').join("");const tokyo=rows.find(x=>x.name==="Pokémon GO Club Tokyo");if(tokyo)sel.value=tokyo.id;let mode="home",width="desktop";

 sel.onchange=draw;document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll("[data-mode]").forEach(x=>x.classList.toggle("on",x.dataset.mode===mode));draw()});document.querySelectorAll("[data-width]").forEach(b=>b.onclick=()=>{width=b.dataset.width;document.getElementById("previewDevice").className="device "+width});await draw();

async function render(){
 if(!(await guard()))return;
 const r=route();
 if(r==="home")return dashboard();
 if(r==="claims"||r==="community-claims")return claims();
 if(r==="icons")return icons();
 if(r==="ca")return caList();
 if(r==="accounts")return accounts();
 if(r==="assignments")return assignments();
 if(r==="campfire")return campfire();
 if(r==="sync")return syncPage();
 if(r==="sync-runs")return syncRuns();
 if(r==="coverage")return coverage();
 if(r==="watch")return watch();
 if(r==="windows")return windows();
 if(r==="preview")return preview();
 go("home");
}
(async()=>{await loadAuth();await render()})();
})();
