<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
  <title id="title">CA Clover official clover B</title>
  <desc id="desc">Four independently addressable clover leaves for monthly activity growth.</desc>
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#315b35" flood-opacity=".16"/>
    </filter>
    <linearGradient id="stemGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#70bf58"/>
      <stop offset="1" stop-color="#2f7f45"/>
    </linearGradient>
    <path id="leafShape" d="M200 197 C181 178 137 162 126 121 C114 78 143 49 177 58 C191 62 199 72 200 88 C201 72 209 62 223 58 C257 49 286 78 274 121 C263 162 219 178 200 197 Z"/>
    <path id="leafHighlight" d="M199 188 C183 168 155 155 144 128 C134 104 144 79 165 71 C148 92 150 121 164 143 C174 159 188 170 199 188 Z"/>
    <g id="leafVeins">
      <path d="M200 190 C200 161 199 128 200 89"/>
      <path d="M200 151 C185 137 173 124 162 107"/>
      <path d="M200 137 C215 126 227 113 238 96"/>
      <path d="M200 167 C185 158 173 149 161 138"/>
      <path d="M200 160 C215 151 228 142 240 130"/>
    </g>
  </defs>
  <style>
    .leaf-fill{fill:#67c567;stroke:#438d4c;stroke-width:1.6;stroke-linejoin:round}
    .leaf-highlight{fill:#fff;opacity:.18}
    .vein{fill:none;stroke:#245d38;stroke-width:1.4;stroke-linecap:round;opacity:.25}
    .leaf-group{filter:url(#softShadow)}
    #stem{fill:none;stroke:url(#stemGradient);stroke-width:12;stroke-linecap:round}
    #stem-highlight{fill:none;stroke:#b6e695;stroke-width:3;stroke-linecap:round;opacity:.65}
  </style>
  <path id="stem" d="M198 202 C190 238 179 274 161 308 C151 327 145 344 143 357"/>
  <path id="stem-highlight" d="M195 211 C188 247 176 282 160 312"/>
  <g id="leaf-top" class="leaf-group">
    <use href="#leafShape" class="leaf-fill"/>
    <use href="#leafHighlight" class="leaf-highlight"/>
    <g class="vein"><use href="#leafVeins"/></g>
  </g>
  <g id="leaf-right" class="leaf-group" transform="rotate(90 200 200)">
    <use href="#leafShape" class="leaf-fill"/>
    <use href="#leafHighlight" class="leaf-highlight"/>
    <g class="vein"><use href="#leafVeins"/></g>
  </g>
  <g id="leaf-bottom" class="leaf-group" transform="rotate(180 200 200)">
    <use href="#leafShape" class="leaf-fill"/>
    <use href="#leafHighlight" class="leaf-highlight"/>
    <g class="vein"><use href="#leafVeins"/></g>
  </g>
  <g id="leaf-left" class="leaf-group" transform="rotate(270 200 200)">
    <use href="#leafShape" class="leaf-fill"/>
    <use href="#leafHighlight" class="leaf-highlight"/>
    <g class="vein"><use href="#leafVeins"/></g>
  </g>
</svg>
