<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8ef">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>CA Clover イベントモード</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#403a35;background:#fff8ef}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#fffaf4,#fff4e8)}a{text-decoration:none;color:inherit}button,input,select{font:inherit}
.wrap{max-width:720px;margin:auto;padding:22px 16px 54px}.head{display:flex;justify-content:space-between;align-items:center}.back{font-size:13px;font-weight:900;color:#567d48}.pill{border-radius:999px;background:#eef5e8;padding:6px 11px;font-size:10px;font-weight:950;color:#587848}
.hero{margin-top:18px;border:1px solid #efd7bd;border-radius:30px;background:linear-gradient(135deg,#f6c58f,#f7d7ae,#fff0dc);padding:20px;box-shadow:0 18px 45px rgba(154,97,42,.12)}.hero .icon{font-size:40px}.hero h1{margin:7px 0 0;font-size:26px}.hero p{margin:8px 0 0;font-size:12px;line-height:1.7;font-weight:800;color:#6f6257}
.notice{margin-top:14px;border-radius:18px;padding:13px;font-size:12px;font-weight:850}.error{background:#fff0f2;color:#b4233b;border:1px solid #fecdd3}
.events{display:grid;gap:14px;margin-top:18px}.event{border:1px solid #ead6c2;border-radius:26px;background:#fff;padding:18px;box-shadow:0 10px 28px rgba(92,69,45,.06)}.event.activeMine{border-color:#9fc78f;background:#f2f8ee}.row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{border-radius:999px;padding:5px 9px;font-size:9px;font-weight:950;background:#f1f1f1;color:#666}.tag.active{background:#dff0d7;color:#4f753f}.tag.scheduled{background:#fff1d5;color:#8b682d}.tag.joined{background:#e8eef8;color:#55709a}
.event h2{margin:9px 0 0;font-size:18px}.meta{margin-top:5px;font-size:11px;line-height:1.6;font-weight:800;color:#82756a}.mission{margin-top:14px;border-radius:20px;background:#fff;padding:14px}.mission .k{font-size:10px;font-weight:950;color:#678057}.mission .t{margin-top:7px;font-size:14px;font-weight:950}.mission .d{margin-top:4px;font-size:12px;line-height:1.6;font-weight:800;color:#7e7166}.mission .note{margin-top:7px;font-size:9px;font-weight:800;color:#a09285}
.btn{width:100%;border:0;border-radius:16px;padding:13px 14px;font-size:13px;font-weight:950;cursor:pointer}.primary{background:#5f8e50;color:white}.muted{background:#f2eee9;color:#75695f}.grid2{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:14px}.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.joinedBox{border-radius:16px;background:#edf5e8;padding:13px 14px;font-size:12px;font-weight:950;color:#587848}
.empty{margin-top:18px;border:1px dashed #d8c7b5;border-radius:24px;background:#fff9;padding:28px;text-align:center;font-size:13px;font-weight:800;color:#8d7c6c}.foot{margin-top:16px;border-radius:20px;background:#fff9;padding:14px;font-size:10px;line-height:1.7;font-weight:800;color:#8d7c6c}
@media(max-width:520px){.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
  <div class="head"><a href="./stamp-rally.html" class="back">← スタンプ一覧</a><span class="pill">EVENT MODE</span></div>
  <section class="hero">
    <div class="icon">🎪</div>
    <h1>イベントモード</h1>
    <p>参加するイベントを一度選ぶだけ。開催中のQR交換にはイベント名・場所・現地日付が自動で入ります。</p>
  </section>
  <div id="status"></div>
  <section id="events" class="events"></section>
  <div class="foot">開催時刻を過ぎると参加モードは自動でOFFになります。端末時刻ではなくサーバー時刻とイベントのタイムゾーンで判定します。</div>
</main>
<script>
(function(){
"use strict";
const SUPABASE_URL="https://wgiittrvgtiosogyhfcl.supabase.co";
const SUPABASE_KEY="sb_publishable_QTCqijfNvnysUTMylNIyTA_6ngosaPN";
const ROOT="https://kaityo1221.github.io/ca-clover/";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce"}});
const status=document.getElementById("status"),eventsEl=document.getElementById("events");
let busyId=null;

function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c])}
async function invoke(body){
 const authState=await client.auth.getSession();
 const accessToken=authState.data.session&&authState.data.session.access_token;
 if(!accessToken)throw new Error("ログインセッションが切れています。再ログインしてください。");
 const r=await client.functions.invoke("stamp-event",{body,headers:{Authorization:"Bearer "+accessToken}});
 if(r.error){
  let detail=r.error.message;
  try{
   if(r.error.context){
    const p=await r.error.context.clone().json();
    if(p&&p.error)detail=String(p.error);
   }
  }catch{}
  throw new Error(detail);
 }
 if(r.data&&r.data.error)throw new Error(r.data.error);
 return r.data;
}
async function auth(){
 const s=await client.auth.getSession(),session=s.data.session;
 if(!session){location.href=ROOT;return false}
 const [p,u]=await Promise.all([
  client.from("profiles").select("role").eq("id",session.user.id).maybeSingle(),
  client.from("user_permissions").select("permission_code").eq("user_id",session.user.id).eq("permission_code","S")
 ]);
 const ok=p.data&&p.data.role==="admin"||(u.data||[]).some(x=>x.permission_code==="S");
 if(!ok){status.innerHTML='<div class="notice error">S権限が必要です。</div>';return false}
 return true;
}
function render(data){
 status.innerHTML="";
 const rows=(data.events||[]).filter(x=>x.phase!=="cancelled");
 if(!rows.length){eventsEl.innerHTML='<div class="empty">現在参加できるイベントはありません。</div>';return}
 eventsEl.innerHTML=rows.map(ev=>{
  const active=ev.phase==="active",scheduled=ev.phase==="scheduled",ended=ev.phase==="ended";
  const phaseTag='<span class="tag '+(active?"active":scheduled?"scheduled":"")+'">'+(active?"開催中":scheduled?"開催前":"終了")+'</span>';
  const joined=ev.joined?'<span class="tag joined">'+(ev.active_for_me?"イベントモード ON":"参加済み")+'</span>':"";
  const mission=ev.active_for_me?'<div class="mission"><div class="k">TODAY\'S MISSION ・ '+esc(ev.today_local_date)+'</div>'+(ev.today_mission?'<div class="t">'+esc(ev.today_mission.title)+'</div><div class="d">'+esc(ev.today_mission.instruction)+'</div><div class="note">遊びの合図です。端末で動作判定はしません。</div>':'<div class="d">今日のミッションは設定されていません。</div>')+'</div>':"";
  const action=!ended&&!ev.joined?'<button class="btn primary" data-join="'+esc(ev.id)+'" '+(busyId===ev.id?"disabled":"")+'>'+(busyId===ev.id?"参加設定中...":"このイベントに参加する")+'</button>'
   :!ended&&ev.joined&&!ev.active_for_me?'<div class="grid2"><div class="joinedBox">✓ 参加登録済み</div><button class="btn muted" data-leave="'+esc(ev.id)+'">取消</button></div>'
   :ev.active_for_me?'<div class="grid g2" style="margin-top:14px"><a class="btn primary" style="display:block;text-align:center" href="./stamp-exchange.html">1対1交換 →</a><a class="btn" style="display:block;text-align:center;background:#d99039;color:white" href="./stamp-bulk.html">🪙 大交換モード →</a></div>':"";
  return '<article class="event '+(ev.active_for_me?"activeMine":"")+'"><div class="row"><div><div class="tags">'+phaseTag+joined+'</div><h2>'+esc(ev.name)+'</h2><div class="meta">📍 '+esc(ev.location||"場所未設定")+'<br>'+esc(ev.starts_local.replace("T"," "))+' → '+esc(ev.ends_local.replace("T"," "))+' ・ '+esc(ev.timezone)+'</div></div><div style="font-size:30px">'+(active?"🔥":"🎟️")+'</div></div>'+mission+'<div style="margin-top:14px">'+action+'</div></article>';
 }).join("");
 eventsEl.querySelectorAll("[data-join]").forEach(b=>b.onclick=()=>join(b.dataset.join));
 eventsEl.querySelectorAll("[data-leave]").forEach(b=>b.onclick=()=>leaveEvent(b.dataset.leave));
}
async function load(){
 if(!await auth())return;
 try{render(await invoke({action:"list"}))}
 catch(err){status.innerHTML='<div class="notice error">'+esc(err.message||String(err))+'</div>'}
}
async function join(id){
 busyId=id;await load();
 try{const d=await invoke({action:"join",eventId:id});busyId=null;render(d)}
 catch(err){busyId=null;status.innerHTML='<div class="notice error">'+esc(err.message||String(err))+'</div>';await load()}
}
async function leaveEvent(id){
 busyId=id;
 try{const d=await invoke({action:"leave",eventId:id});busyId=null;render(d)}
 catch(err){busyId=null;status.innerHTML='<div class="notice error">'+esc(err.message||String(err))+'</div>'}
}
load();
})();
</script>
</body>
</html>
