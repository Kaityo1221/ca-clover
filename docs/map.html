<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Activity Map | CA Clover</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
:root{font-family:Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#213018;background:#f8faf6}
*{box-sizing:border-box}body{margin:0}.top{position:sticky;top:0;z-index:1500;background:rgba(255,255,255,.94);border-bottom:1px solid #e5efd9;backdrop-filter:blur(12px)}.topin{max-width:1180px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:12px}.logo{font-size:28px;text-decoration:none}.brand{font-weight:950;color:#365314}.grow{flex:1}.btn,.pillbtn{border:0;border-radius:999px;padding:10px 15px;font-weight:900;cursor:pointer;background:#bef264;color:#365314}.btn.line,.pillbtn{background:#fff;border:1px solid #d9f99d}.pillbtn.on{background:#bef264;border-color:#a3e635}.wrap{max-width:1180px;margin:auto;padding:24px 16px 60px}.card{background:white;border:1px solid #e7f1dc;border-radius:24px;padding:18px;box-shadow:0 10px 28px rgba(54,83,20,.05)}.hero{background:linear-gradient(135deg,#f7fee7,#fff)}.section{margin-top:16px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.muted{color:#64748b}.strong{font-weight:800}.tiny{font-size:11px}.small{font-size:12px}.pill{display:inline-flex;border-radius:999px;padding:6px 10px;background:#ecfccb;color:#4d7c0f;font-size:11px;font-weight:900}.pill.slate{background:#f1f5f9;color:#475569}.pill.amber{background:#fef3c7;color:#92400e}.grid{display:grid;gap:12px}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.metric{background:#fff;border:1px solid #e7f1dc;border-radius:20px;padding:15px}.metric b{display:block;font-size:24px;margin-top:6px}.controls{display:flex;flex-wrap:wrap;gap:8px}.input{width:100%;border:1px solid #d9f99d;border-radius:16px;background:#fff;padding:11px 13px;font-weight:800;color:#334155}.controlgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mapstage{position:relative}.mapstage.fullscreen{position:fixed;inset:0;z-index:2000;background:#fff}.mapstage.fullscreen .mapwrap{height:100dvh;border:0;border-radius:0}.mapwrap{height:560px;border-radius:24px;overflow:hidden;border:1px solid #d9f99d;background:#eef4e8}.mapwrap.scroll-mode{touch-action:pan-y}.mapwrap.interact-mode{touch-action:none}.maptoggle{display:none;position:absolute;right:12px;top:12px;z-index:1200;border:0;border-radius:999px;padding:10px 14px;background:#bef264;color:#365314;font-size:12px;font-weight:900;box-shadow:0 8px 22px rgba(54,83,20,.20)}.maptoggle.on{background:#0f172a;color:#fff}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid #eef2e8}.table th{color:#64748b;font-size:11px}.notice{border-radius:18px;padding:13px;background:#fef3c7;color:#92400e;font-weight:800}.searchlist{display:grid;gap:7px}.searchitem{width:100%;text-align:left;border:1px solid #e7f1dc;background:#fff;border-radius:14px;padding:10px;cursor:pointer}.leaflet-popup-content a{color:#4d7c0f;font-weight:900}.version{text-align:center;color:#94a3b8;font-size:10px;margin-top:24px}
@media(max-width:760px){.g3,.controlgrid{grid-template-columns:1fr}.mapwrap{height:62vh}.maptoggle{display:block}.mapwrap.scroll-mode .leaflet-control-zoom{display:none}.wrap{padding-top:14px}.card{padding:15px}.topin{align-items:flex-start}.brand{display:none}}
</style>
</head>
<body>
<header class="top"><div class="topin"><a class="logo" href="./admin.html">🍀</a><div class="brand">CA Clover / Activity Map</div><div class="grow"></div><a class="btn" href="./admin.html">管理画面</a></div></header>
<main id="app" class="wrap"><section class="card hero"><h1>🗾 Activity Map</h1><p class="muted strong">読み込み中...</p></section></main>
<script>
(function(){
"use strict";
const SUPABASE_URL="https://wgiittrvgtiosogyhfcl.supabase.co";
const SUPABASE_KEY="sb_publishable_QTCqijfNvnysUTMylNIyTA_6ngosaPN";
const ROOT="https://kaityo1221.github.io/ca-clover/";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce"}});
const app=document.getElementById("app");
const periods=[[30,"30日"],[90,"90日"],[180,"180日"],[365,"1年"],[0,"全期間"]];
const metrics=[["checkin_count","✅ Check-in"],["meetup_count","🔥 Meetup"],["ca_meetup_count","🍀 CA Meetup"],["rsvp_count","📨 RSVP"]];
let period=30,metric="checkin_count",mode="activity",pref="all",search="",rows=[],allRows=[],map=null,selected=null,mapInteract=false;
function e(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]})}
function n(v){return Number(v||0).toLocaleString("ja-JP")}
function labelFor(list,value){const x=list.find(function(v){return v[0]===value});return x?x[1]:""}
function daysSince(v){if(!v)return null;return Math.floor((Date.now()-Date.parse(v))/86400000)}
async function login(){await client.auth.signInWithOAuth({provider:"google",options:{redirectTo:ROOT+"map.html"}})}
async function guard(){
 const got=await client.auth.getSession(),session=got.data.session||null;
 if(!session){app.innerHTML='<section class="card hero"><h1>🗾 Activity Map</h1><p class="muted strong">ログインが必要です</p><button id="login" class="btn section">Googleでログイン</button></section>';document.getElementById("login").onclick=login;return false}
 const p=await client.from("profiles").select("role").eq("id",session.user.id).maybeSingle();
 if(p.data?.role!=="admin"){location.replace(ROOT+"#my");return false}
 return true;
}
async function load(){
 app.innerHTML='<section class="card hero"><h1>🗾 Activity Map</h1><p class="muted strong">全国Communityを読み込み中...</p></section>';
 const r=await Promise.all([
  client.rpc("activity_map_summary",{p_days:period}),
  client.rpc("activity_map_summary",{p_days:0})
 ]);
 if(r[0].error){app.innerHTML='<section class="notice">Activity Mapを読み込めませんでした: '+e(r[0].error.message)+'</section>';return}
 rows=r[0].data||[];allRows=r[1].data||[];render();
}
function filtered(){
 const q=search.normalize("NFKC").trim().toLowerCase();
 return rows.filter(function(x){
  if(pref!=="all"&&x.prefecture!==pref)return false;
  if(!q)return true;
  return String(x.community_name||"").normalize("NFKC").toLowerCase().includes(q)||String(x.prefecture||"").normalize("NFKC").toLowerCase().includes(q);
 });
}
function render(){
 const prefs=[...new Set(rows.map(function(x){return x.prefecture}).filter(Boolean))].sort(function(a,b){return String(a).localeCompare(String(b),"ja")});
 const visible=filtered();
 const total=visible.reduce(function(s,x){return s+Number(x[metric]||0)},0);
 const active=visible.filter(function(x){return Number(x[metric]||0)>0}).length;
 const latest=visible.reduce(function(v,x){if(!x.last_event_at)return v;return !v||Date.parse(x.last_event_at)>Date.parse(v)?x.last_event_at:v},null);
 const searchMatches=search.trim()?rows.filter(function(x){const q=search.normalize("NFKC").trim().toLowerCase();return String(x.community_name||"").normalize("NFKC").toLowerCase().includes(q)||String(x.prefecture||"").normalize("NFKC").toLowerCase().includes(q)}).slice(0,8):[];
 const top=[...visible].sort(function(a,b){return Number(b[metric]||0)-Number(a[metric]||0)}).slice(0,15);
 const grouped={};rows.forEach(function(x){const k=x.prefecture||"未設定";if(!grouped[k])grouped[k]={count:0,active:0,total:0};grouped[k].count++;const v=Number(x[metric]||0);grouped[k].total+=v;if(v>0)grouped[k].active++});
 app.innerHTML=
  '<section class="card hero"><span class="pill">ADMIN</span><h1 style="margin-top:10px">🗾 Activity Map</h1><p class="muted strong">全国Communityの活動量を地図で比較</p></section>'+
  '<section class="card section"><div class="tiny strong muted">期間</div><div class="controls section">'+periods.map(function(x){return '<button class="pillbtn '+(period===x[0]?'on':'')+'" data-period="'+x[0]+'">'+x[1]+'</button>'}).join("")+'</div>'+
  '<div class="tiny strong muted section">指標</div><div class="controls section">'+metrics.map(function(x){return '<button class="pillbtn '+(metric===x[0]?'on':'')+'" data-metric="'+x[0]+'">'+x[1]+'</button>'}).join("")+'</div>'+
  '<div class="tiny strong muted section">地図モード</div><div class="controls section"><button class="pillbtn '+(mode==="activity"?'on':'')+'" data-mode="activity">活動量</button><button class="pillbtn '+(mode==="recency"?'on':'')+'" data-mode="recency">最終開催</button></div>'+
  '<div class="controlgrid section"><div><div class="tiny strong muted">都道府県</div><select id="pref" class="input section"><option value="all">全国</option>'+prefs.map(function(x){return '<option '+(pref===x?'selected':'')+'>'+e(x)+'</option>'}).join("")+'</select></div><div><div class="tiny strong muted">Community検索</div><input id="search" class="input section" value="'+e(search)+'" placeholder="Community名・都道府県で検索"></div></div>'+
  (searchMatches.length?'<div class="searchlist section">'+searchMatches.map(function(x){return '<button class="searchitem" data-find="'+e(x.community_id)+'"><b>'+e(x.community_name)+'</b><div class="tiny muted">'+e(x.prefecture||"—")+'</div></button>'}).join("")+'</div>':'')+
  '</section>'+
  '<section class="grid g3 section"><div class="metric"><span class="tiny strong muted">対象Community</span><b>'+n(visible.length)+'</b></div><div class="metric"><span class="tiny strong muted">活動あり</span><b>'+n(active)+'</b></div><div class="metric"><span class="tiny strong muted">'+e(labelFor(metrics,metric))+' 合計</span><b>'+n(total)+'</b><div class="tiny muted">最終 '+(latest?new Date(latest).toLocaleDateString("ja-JP"):"—")+'</div></div></section>'+
  '<div class="mapstage section"><div id="map" class="mapwrap"></div><button id="mapToggle" class="maptoggle">🗺️ 地図を操作</button></div>'+
  '<section class="card section"><h2>📊 上位Community / '+e(labelFor(periods,period))+'</h2><div style="overflow:auto"><table class="table"><thead><tr><th>Community</th><th>都道府県</th><th>'+e(labelFor(metrics,metric))+'</th><th>最終開催</th></tr></thead><tbody>'+top.map(function(x){return '<tr><td><b>'+e(x.community_name)+'</b></td><td>'+e(x.prefecture||"—")+'</td><td>'+n(x[metric])+'</td><td>'+(x.last_event_at?new Date(x.last_event_at).toLocaleDateString("ja-JP"):"—")+'</td></tr>'}).join("")+'</tbody></table></div></section>'+
  '<section class="card section"><h2>🗾 都道府県サマリー</h2><div style="overflow:auto"><table class="table"><thead><tr><th>都道府県</th><th>Community</th><th>活動あり</th><th>'+e(labelFor(metrics,metric))+'</th></tr></thead><tbody>'+Object.keys(grouped).sort(function(a,b){return a.localeCompare(b,"ja")}).map(function(k){const g=grouped[k];return '<tr><td><b>'+e(k)+'</b></td><td>'+n(g.count)+'</td><td>'+n(g.active)+'</td><td>'+n(g.total)+'</td></tr>'}).join("")+'</tbody></table></div></section>'+
  '<div class="version">Pages Activity Map / 2026-09-21</div>';
 bind();
 drawMap(visible);
}
function bind(){
 document.querySelectorAll("[data-period]").forEach(function(b){b.onclick=function(){period=Number(b.dataset.period);selected=null;load()}});
 document.querySelectorAll("[data-metric]").forEach(function(b){b.onclick=function(){metric=b.dataset.metric;selected=null;render()}});
 document.querySelectorAll("[data-mode]").forEach(function(b){b.onclick=function(){mode=b.dataset.mode;selected=null;render()}});
 document.getElementById("pref").onchange=function(){pref=this.value;selected=null;render()};
 document.getElementById("search").onchange=function(){search=this.value;selected=null;render()};
 document.getElementById("search").onkeydown=function(ev){if(ev.key==="Enter"){search=this.value;selected=null;render()}};
 document.querySelectorAll("[data-find]").forEach(function(b){b.onclick=function(){selected=b.dataset.find;const x=rows.find(function(r){return r.community_id===selected});if(x){search=x.community_name;pref=x.prefecture||"all";render()}}});
 const toggle=document.getElementById("mapToggle");
 if(toggle)toggle.onclick=function(){mapInteract=!mapInteract;applyMapInteraction()};
}
function isMobile(){return window.matchMedia("(max-width:760px)").matches}
function applyMapInteraction(){
 const el=document.getElementById("map"),toggle=document.getElementById("mapToggle"),stage=document.querySelector(".mapstage");
 if(!el)return;
 const active=!isMobile()||mapInteract;
 el.classList.toggle("interact-mode",active);
 el.classList.toggle("scroll-mode",!active);
 if(stage)stage.classList.toggle("fullscreen",active&&isMobile());
 document.body.style.overflow=active&&isMobile()?"hidden":"";
 if(toggle){
  toggle.textContent=active&&isMobile()?"× 地図を閉じる":"🗺️ 地図を操作";
  toggle.classList.toggle("on",active&&isMobile());
 }
 if(map){
  ["dragging","touchZoom","doubleClickZoom","boxZoom","keyboard","scrollWheelZoom"].forEach(function(key){
   const handler=map[key];
   if(handler&&typeof handler.enable==="function"&&typeof handler.disable==="function"){active?handler.enable():handler.disable()}
  });
  if(typeof map.invalidateSize==="function")setTimeout(function(){map.invalidateSize()},0);
 }
}
function drawMap(visible){
 if(map){map.remove();map=null}
 if(!visible.length){document.getElementById("map").innerHTML='<div style="padding:30px" class="muted strong">条件に一致するCommunityがありません。</div>';return}
 const active=!isMobile()||mapInteract;
 map=L.map("map",{zoomControl:true,scrollWheelZoom:active,dragging:active,touchZoom:active,doubleClickZoom:active,boxZoom:active,keyboard:active});
 L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap contributors",maxZoom:18}).addTo(map);
 const pts=visible.map(function(x){return [Number(x.latitude),Number(x.longitude)]}).filter(function(x){return Number.isFinite(x[0])&&Number.isFinite(x[1])});
 if(pts.length)map.fitBounds(L.latLngBounds(pts),{padding:[28,28],maxZoom:7});
 const max=Math.max(1,...visible.map(function(x){return Number(x[metric]||0)}));
 const lastMap=new Map(allRows.map(function(x){return [x.community_id,x.last_event_at]}));
 visible.forEach(function(x){
  const value=Number(x[metric]||0),scaled=value>0?Math.sqrt(value/max):0,last=lastMap.get(x.community_id)||null,days=daysSince(last);
  let color=value>0?"#4d7c0f":"#94a3b8",fill=value>0?"#84cc16":"#cbd5e1",radius=value>0?7+scaled*17:5,opacity=value>0?.38+scaled*.5:.16;
  if(mode==="recency"){radius=10;opacity=.72;if(days===null){color="#94a3b8";fill="#cbd5e1"}else if(days<=30){color="#4d7c0f";fill="#84cc16"}else if(days<=90){color="#b45309";fill="#fbbf24"}else{color="#475569";fill="#94a3b8"}}
  const html='<div style="min-width:230px"><div style="font-size:11px;font-weight:900;color:#65a30d">'+e(x.prefecture||"—")+'</div><div style="font-weight:950;margin-top:3px">'+e(x.community_name)+'</div><div style="font-size:11px;color:#64748b;margin-top:8px">'+e(labelFor(periods,period))+' / Meetup '+n(x.meetup_count)+' / CA '+n(x.ca_meetup_count)+' / RSVP '+n(x.rsvp_count)+' / Check-in '+n(x.checkin_count)+'</div><div style="font-size:11px;color:#64748b;margin-top:5px">最終開催: '+(last?new Date(last).toLocaleDateString("ja-JP"):"履歴なし")+'</div><a href="./#community:'+encodeURIComponent(x.community_id)+'">Community詳細を見る →</a></div>';
  const marker=L.circleMarker([Number(x.latitude),Number(x.longitude)],{radius:radius,color:color,weight:1.5,fillColor:fill,fillOpacity:opacity}).bindPopup(html,{maxWidth:340}).addTo(map);
  if(selected===x.community_id){map.setView([Number(x.latitude),Number(x.longitude)],14);marker.openPopup()}
 });
 applyMapInteraction();
}
(async function(){if(await guard())await load()})();
})();
</script>
</body>
</html>
