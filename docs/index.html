    .hero{background:linear-gradient(135deg,#ecfccb,#fff,#ecfdf5)}h1,h2,h3{color:#365314;margin:0}h1{font-size:clamp(28px,5vw,44px);letter-spacing:-.03em}h2{font-size:23px}p{line-height:1.7}
    .muted{color:#64748b}.small{font-size:12px}.tiny{font-size:11px}.strong{font-weight:900}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:6px 10px;background:#ecfccb;color:#4d7c0f;font-size:12px;font-weight:900}

    .input{width:100%;border:1px solid #d9f99d;border-radius:16px;padding:13px 14px;background:#fff;font-weight:750;outline:none}.input:focus{border-color:#84cc16;box-shadow:0 0 0 4px rgba(132,204,22,.12)}

    .ok{background:#f0fdf4;border-color:#bbf7d0;color:#166534}.err{background:#fff1f2;border-color:#fecdd3;color:#be123c}.row{display:flex;align-items:flex-start;gap:12px}.between{justify-content:space-between}.wraprow{flex-wrap:wrap}
    .metric{padding:16px;border-radius:20px;background:#fff;border:1px solid #ecfccb}.metric b{display:block;font-size:26px;color:#365314;margin-top:4px}
    .trendbox{overflow-x:auto;border:1px solid #ecfccb;border-radius:18px;background:#fff;margin-top:14px}.trendsvg{display:block;width:100%;min-width:760px}.trendlegend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:11px;font-weight:900;color:#64748b}.trendlegend span{display:inline-flex;align-items:center;gap:6px}
    .claim{border:1px solid #ecfccb;border-radius:20px;padding:16px;background:white}.claim+.claim{margin-top:10px}.claim.clickable{cursor:pointer;transition:.18s transform,.18s border-color,.18s box-shadow}.claim.clickable:hover{transform:translateY(-2px);border-color:#bef264;box-shadow:0 12px 30px rgba(77,124,15,.10)}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
    .community-avatar{position:relative;width:64px;height:64px;flex:0 0 64px;border-radius:21px;overflow:hidden;border:1px solid #ecfccb;background:#f7fee7;display:grid;place-items:center;font-size:30px;box-shadow:0 8px 22px rgba(77,124,15,.08)}.community-avatar.large{width:88px;height:88px;flex-basis:88px;border-radius:28px;font-size:38px;box-shadow:0 12px 30px rgba(77,124,15,.12)}.community-avatar .icon-fallback{position:absolute;inset:0;display:grid;place-items:center}.community-avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}.community-hero-row{display:flex;align-items:center;gap:16px;min-width:0}.community-hero-row>div:last-child{min-width:0}
    .actions{display:flex;gap:8px;flex-wrap:wrap}.actions .btn{width:auto;min-width:90px;padding:10px 14px}.linkbtn{border:0;background:none;color:#65a30d;font-weight:900;padding:0}.periodbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.periodbtn{border:1px solid #d9f99d;background:#fff;color:#4d7c0f;border-radius:999px;padding:10px 16px;font-weight:950;white-space:nowrap}.periodbtn.active{background:#a3e635;border-color:#84cc16;color:#365314}@media(max-width:480px){.periodbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.periodbtn{width:100%;min-width:0;padding:8px 2px;font-size:11px;line-height:1.1;text-align:center}.community-avatar.large{width:72px;height:72px;flex-basis:72px;border-radius:23px;font-size:32px}.community-hero-row{align-items:flex-start}}
    .center{text-align:center}.spacer{height:8px}.version{font-size:10px;color:#94a3b8;text-align:center;margin-top:18px}.modalback{position:fixed;inset:0;z-index:100;background:rgba(15,23,42,.46);overflow-y:auto;overscroll-behavior:contain;padding:16px;display:flex;align-items:center;justify-content:center}.modal{width:min(680px,100%);max-height:calc(100dvh - 32px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:#fff;border:1px solid #ecfccb;border-radius:28px;padding:22px;box-shadow:0 30px 80px rgba(15,23,42,.24)}.modalgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:#f7fee7;border-radius:18px;padding:14px}.modaltext{white-space:pre-wrap;border:1px solid #e2e8f0;background:#f8fafc;border-radius:18px;padding:14px;line-height:1.7}.closebtn{border:0;width:40px;height:40px;border-radius:999px;background:#f1f5f9;font-weight:950;font-size:18px}.extbtn{display:flex;align-items:center;justify-content:center;text-decoration:none;border-radius:16px;padding:13px 16px;font-weight:950;background:#fff;border:1px solid #d9f99d;color:#4d7c0f}
    .login{max-width:470px;margin:8vh auto 0}.login .logo{margin:0 auto;width:78px;height:78px;border-radius:26px;font-size:38px}
    @media(max-width:760px){.g2,.g3{grid-template-columns:1fr}.topin{align-items:flex-start}.nav{max-width:55vw;justify-content:flex-end}.brandblock{display:none}.wrap{padding-top:14px}.card{padding:18px}.modalback{align-items:flex-start;padding:12px}.modal{max-height:calc(100dvh - 24px);padding:18px}.modal>.row:first-child{position:sticky;top:-18px;z-index:5;background:#fff;padding:18px 0 10px}}

<body>
  <header class="top"><div class="topin">
    <div class="logo">🍀</div>
    <div class="brandblock"><div class="brand">CA Clover</div><div class="sub">My Community Management</div></div>
    <div class="grow"></div><nav id="nav" class="nav"></nav>
  </div></header>
  <main id="app" class="wrap"></main>

<script>
(function(){
  "use strict";
  const SUPABASE_URL="https://wgiittrvgtiosogyhfcl.supabase.co";
  const SUPABASE_KEY="sb_publishable_QTCqijfNvnysUTMylNIyTA_6ngosaPN";
  const ROOT="https://kaityo1221.github.io/ca-clover/";
  const VERSION="my-community-20260925";
  const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
    auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce"}
  });

  let session=null, profile=null, permissions=new Set(), busy=false, flash=null, communityPeriod=30;
  const COMMUNITY_PERIODS=[["1か月",30],["3か月",90],["6か月",180],["1年",365],["全期間",null]];
  const app=document.getElementById("app");
  const nav=document.getElementById("nav");

  function e(v){
    return String(v==null?"":v).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]});
  }
  function fmt(v){if(!v)return "—";const d=new Date(v);return Number.isFinite(d.getTime())?d.toLocaleString("ja-JP"):"—"}
  function communityIconHtml(community,large){
    const cls=large?"community-avatar large":"community-avatar";
    return '<div class="'+cls+'" aria-hidden="true"><span class="icon-fallback">🍀</span>'+(community&&community.avatar_url?'<img src="'+e(community.avatar_url)+'" alt="" loading="lazy" onerror="this.remove()">':'')+'</div>';
  }
  function activityBucket(period){
    if(period===30)return "day";
    if(period===90)return "week";
    if(period===null)return "year";
    return "month";
  }
  function activityUnit(bucket){
    if(bucket==="day")return "日別";
    if(bucket==="week")return "週別";
    if(bucket==="year")return "年別";
    return "月別";
  }
  function activityLabel(value,bucket,count){
    const p=String(value||"").slice(0,10).split("-").map(Number);
    const y=p[0]||0,m=p[1]||1,d=p[2]||1;
    if(bucket==="day"||bucket==="week")return m+"/"+d;
    if(bucket==="year")return String(y);
    return count>12?String(y).slice(-2)+"/"+m:m+"月";
  }
  function activityChartHtml(rows,bucket,periodLabel){
    rows=(rows||[]).map(function(r){return{bucket:r.bucket,meetup_count:Number(r.meetup_count)||0,checkin_count:Number(r.checkin_count)||0}});
    const W=900,H=290,L=48,R=62,T=25,B=46,PW=W-L-R,PH=H-T-B;
    const n=Math.max(1,rows.length),step=PW/n,barW=Math.min(25,Math.max(5,step*.34));
    const meetupMax=Math.max(1,...rows.map(function(r){return r.meetup_count}));
    const checkinMax=Math.max(1,...rows.map(function(r){return r.checkin_count}));
    const x=function(i){return L+step*i+step/2};
    const my=function(v){return T+PH-(v/meetupMax)*PH};
    const cy=function(v){return T+PH-(v/checkinMax)*PH};
    const every=rows.length<=14?1:Math.ceil(rows.length/10);
    let svg='<svg class="trendsvg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+e(periodLabel+'のActivity推移')+'"><rect width="'+W+'" height="'+H+'" fill="white"/>';
    for(let i=0;i<5;i++){
      const ratio=i/4,y=T+PH-ratio*PH;
      svg+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="#e5e7eb" stroke-dasharray="'+(i===0?'0':'4 5')+'"/>';
      svg+='<text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="#64748b">'+Math.round(meetupMax*ratio)+'</text>';
      svg+='<text x="'+(W-R+8)+'" y="'+(y+4)+'" text-anchor="start" font-size="10" fill="#64748b">'+Math.round(checkinMax*ratio).toLocaleString("ja-JP")+'</text>';
    }
    const line=[];
    rows.forEach(function(r,i){
      const xx=x(i),yy=my(r.meetup_count),hh=T+PH-yy;
      svg+='<rect x="'+(xx-barW/2)+'" y="'+yy+'" width="'+barW+'" height="'+Math.max(0,hh)+'" rx="4" fill="#fcd34d"><title>'+e(activityLabel(r.bucket,bucket,rows.length)+' Meetup '+r.meetup_count+'回')+'</title></rect>';
      if(i%every===0||i===rows.length-1)svg+='<text x="'+xx+'" y="'+(H-22)+'" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">'+e(activityLabel(r.bucket,bucket,rows.length))+'</text>';
      line.push(xx+','+cy(r.checkin_count));
    });
    if(line.length>1)svg+='<polyline points="'+line.join(' ')+'" fill="none" stroke="#65a30d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';
    rows.forEach(function(r,i){
      svg+='<circle cx="'+x(i)+'" cy="'+cy(r.checkin_count)+'" r="4" fill="#65a30d" stroke="white" stroke-width="2"><title>'+e(activityLabel(r.bucket,bucket,rows.length)+' Check-in '+r.checkin_count.toLocaleString("ja-JP"))+'</title></circle>';
    });
    svg+='<text x="'+L+'" y="14" font-size="10" font-weight="800" fill="#b45309">Meetup回数</text><text x="'+(W-R)+'" y="14" text-anchor="end" font-size="10" font-weight="800" fill="#4d7c0f">Check-in数</text></svg>';
    return '<section class="card section"><h2>📈 Activity推移 / '+e(periodLabel)+'</h2><p class="muted small strong">'+e(activityUnit(bucket))+' / Meetup回数とCheck-in数の推移</p><div class="trendlegend"><span>🟨 Meetup回数</span><span>🟢 Check-in数</span></div><div class="trendbox">'+svg+'</div></section>';
  }
  function route(){return (location.hash||"#my").slice(1)}
  function go(v){location.hash=v}
  function setFlash(text,type){flash={text:text,type:type||"ok"};render()}
  function flashHtml(){
    if(!flash)return "";
    const cls=flash.type==="err"?"notice err":"notice ok";
    return '<div class="'+cls+' section">'+e(flash.text)+'</div>';
  }
  async function loadProfile(){
    if(!session){profile=null;permissions=new Set();return}
    const results=await Promise.all([
      client.from("profiles").select("role,niantic_id,email").eq("id",session.user.id).maybeSingle(),
      client.from("user_permissions").select("permission_code").eq("user_id",session.user.id)
    ]);
    profile=results[0].data||{role:"pending",niantic_id:null,email:session.user.email||null};
    permissions=new Set((results[1].data||[]).map(function(x){return x.permission_code}));
  }
  function header(){
    if(!session){
      nav.innerHTML='<button id="loginTop">ログイン</button>';
      document.getElementById("loginTop").onclick=function(){login()};
      return;
    }
    const items=[["my","My Community"],["account","アカウント"]];
    if((profile&&profile.role==="admin")||permissions.has("S"))items.splice(1,0,["stamp","スタンプラリー"]);
    nav.innerHTML=items.map(function(x){
      return '<button data-go="'+x[0]+'" class="'+(route()===x[0]?"on":"")+'">'+x[1]+'</button>'
    }).join("")+(profile&&profile.role==="admin"?'<a href="./admin.html?v=20260921-1815" style="border:0;border-radius:999px;padding:9px 13px;background:#ede9fe;color:#6d28d9;font-weight:900;text-decoration:none">管理画面</a>':"");
    nav.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){
      flash=null;
      if(b.dataset.go==="stamp"){location.href="./stamp-rally.html";return}
      go(b.dataset.go)
    }})
  }
  async function login(){
    flash=null;
    const r=await client.auth.signInWithOAuth({provider:"google",options:{redirectTo:ROOT}});
    if(r.error)setFlash(r.error.message,"err");
  }
  async function logout(){
    await client.auth.signOut(); session=null;profile=null;permissions=new Set();flash=null;location.hash="";render();
  }
  async function init(){
    const got=await client.auth.getSession();
    session=got.data.session||null;
    if(session)await loadProfile();
    client.auth.onAuthStateChange(async function(_event,newSession){
      session=newSession||null;
      if(session)await loadProfile();else {profile=null;permissions=new Set()}
      render();
    });
    window.addEventListener("hashchange",function(){flash=null;render()});
    render();
  }
  function loginView(){
    app.innerHTML='<section class="card login center"><div class="logo">🍀</div><h1 style="margin-top:18px">CA Clover</h1><p class="muted strong">Japan Community Activity Dashboard</p><button id="google" class="btn section">G　Googleでログイン</button>'+flashHtml()+'<div class="version">mirror '+VERSION+'</div></section>';
    document.getElementById("google").onclick=login;
  }
  async function renderMy(){
    app.innerHTML='<section class="card hero"><span class="pill">MY COMMUNITY</span><h1 style="margin-top:12px">My Communityへようこそ。🍀</h1><p class="muted strong">読み込み中...</p></section>';
    const uid=session.user.id;
    const results=await Promise.all([
      client.from("community_memberships").select("community_id").eq("user_id",uid),
      client.from("community_access_requests").select("id,meetup_title,request_source,community_name_snapshot,community_prefecture_snapshot,master_match,creator_display_name,creator_username,creator_username_matches_profile,creator_ca_badge_verified,ca_level_snapshot,ca_role_verified,ca_map_status,status,requested_at,reviewed_at").eq("user_id",uid).order("requested_at",{ascending:false})
    ]);
    const memberships=results[0].data||[];
    const claims=results[1].data||[];
    let communities=[];
    if(memberships.length){
      const ids=memberships.map(function(x){return x.community_id});
      const cr=await client.from("communities").select("id,name,prefecture,member_count,avatar_url,coverage").in("id",ids).order("name");
      communities=cr.data||[];
    }
    const heroText=profile.role==="pending"?"CA登録が完了すると、自分に割り当てられたCommunityの活動を確認できます。":"自分に割り当てられたCommunityの活動だけを確認できます。";
    let html='<section class="card hero"><span class="pill">MY COMMUNITY</span><h1 style="margin-top:12px">My Communityへようこそ。🍀</h1><p class="muted strong">'+heroText+'</p>'+(profile.role!=="pending"?'<div class="tags"><span class="pill">✅ 認証済み '+communities.length+' Community</span></div>':'')+'</section>';
    html+=flashHtml();

    if(profile.role==="admin"||permissions.has("S")){
      html+='<section class="card section" style="border-color:#f0d7bd;background:linear-gradient(135deg,#fff8ef,#fff,#edf7e8)"><div class="row"><div style="font-size:34px">🍀</div><div><span class="pill">S / STAMP RALLY LAB</span><h2 style="margin-top:8px">CA Stamp Rally LAB</h2><p class="muted small strong">全国スタンプシートのテストページを開きます。</p></div></div><a class="btn section stamp-rally-open" href="./stamp-rally.html">スタンプラリーを開く →</a></section>';
    }

    if(profile.role==="pending"){
      html+='<section class="notice section"><div class="tiny strong">初回CA登録</div><h3 style="margin-top:5px;color:#78350f">Campfire URLでCA確認をします</h3><p>Niantic IDを登録してから、コミュニティ招待URLまたは自分が主催したミートアップ共有URLを提出してください。会長が承認するとCAアカウント化とCommunity割当が同時に完了します。</p>'+(profile.niantic_id?'<span class="pill amber">Niantic ID: '+e(profile.niantic_id)+' ✓</span>':'<button id="toAccount" class="btn line">先にNiantic IDを登録 →</button>')+'</section>';
    }

    if(profile.role==="pending"){
      html+='<section class="card section"><div class="row"><div style="font-size:30px">🔥</div><div><h2>Campfire URLからCommunityを申請</h2><p class="muted small strong">コミュニティ招待URL、または自分が主催したミートアップ共有URLを貼り付けてください。Niantic ID、Community、日本CA地図の1st/2ndを照合します。ミートアップ共有URLでは紫色CAバッジも確認します。</p></div></div><input id="claimUrl" class="input section" placeholder="コミュニティ招待URL / ミートアップ共有URL"><button id="submitClaim" class="btn section" '+((profile.role==="pending"&&!profile.niantic_id)?"disabled":"")+'>Communityを確認して申請</button><div id="claimResult"></div></section>';
    }

    if(profile.role==="ca"&&!communities.length){
      html+='<section class="notice section"><div class="tiny strong">Community情報を確認中</div><p>認証済みなのにCommunityが表示されない場合は、再申請せず管理者へお問い合わせください。</p></section>';
    }

    if(communities.length){
      html+='<section class="section"><h2>あなたのCommunity</h2><div class="grid g2 section">'+communities.map(function(c){
        return '<button type="button" class="claim clickable" style="text-align:left;width:100%;position:relative" data-community="'+e(c.id)+'"><span class="pill" style="position:absolute;right:14px;top:14px">✅ 認証済み</span><div class="row" style="align-items:center;padding-right:86px">'+communityIconHtml(c,false)+'<div style="min-width:0"><span class="pill">'+e(c.prefecture||"—")+'</span><h3 style="margin-top:7px">'+e(c.name)+'</h3></div></div><p class="muted small strong">Member: '+e(c.member_count==null?"未取得":Number(c.member_count).toLocaleString("ja-JP"))+'</p>'+(c.coverage!=="complete"?'<div class="notice section">⚠️ 一部の過去データが未取得のため、全期間集計は参考値です</div>':'')+'<div class="small strong" style="color:#65a30d;margin-top:10px">Community情報を見る →</div></button>'
      }).join("")+'</div></section>';
    }

    if(profile.role==="pending"&&claims.length){
      html+='<section class="section"><h2>申請履歴</h2><div class="section">'+claims.map(function(c){
        const status=c.status==="approved"?'<span class="pill">承認済み</span>':c.status==="rejected"?'<span class="pill rose">却下</span>':'<span class="pill amber">承認待ち</span>';
        const source=c.request_source==="community_invite"?'<span class="pill">コミュニティ招待URL</span>':'<span class="pill violet">ミートアップ共有URL</span>';
        return '<div class="claim"><div class="row between wraprow"><div><div class="tiny strong" style="color:#65a30d">'+e(c.community_prefecture_snapshot||"—")+'</div><h3 style="margin-top:4px">'+e(c.community_name_snapshot)+'</h3><div class="small muted strong" style="margin-top:4px">'+e(c.request_source==="community_invite"?"コミュニティ招待URLから申請":(c.meetup_title||"ミートアップ共有URLから申請"))+'</div></div>'+status+'</div><div class="tags">'+source+'<span class="pill slate">Niantic ID '+(c.creator_username_matches_profile===true?"一致":"未確認")+'</span><span class="pill slate">CA地図 '+e(c.ca_map_status||"要確認")+'</span></div><div class="tiny muted" style="margin-top:10px">申請 '+e(fmt(c.requested_at))+'</div></div>';
      }).join("")+'</div></section>';
    }

    app.innerHTML=html+'<div class="version">mirror '+VERSION+'</div>';
    const toAccount=document.getElementById("toAccount");if(toAccount)toAccount.onclick=function(){go("account")};
    const submit=document.getElementById("submitClaim");
    if(submit)submit.onclick=submitClaim;
    app.querySelectorAll("[data-community]").forEach(function(b){
      b.onclick=function(){go("community:"+encodeURIComponent(b.dataset.community))}
    });
  }

  async function renderCommunity(id){
    app.innerHTML='<section class="card hero"><button id="backMy" class="linkbtn">← My Community</button><h1 style="margin-top:12px">🍀 Community情報</h1><p class="muted strong">読み込み中...</p></section>';
    if(profile.role!=="admin"){
      const access=await client.from("community_memberships").select("community_id").eq("user_id",session.user.id).eq("community_id",id).maybeSingle();
      if(access.error||!access.data){
        app.innerHTML='<section class="card center"><h2>このCommunityは表示できません</h2><p class="muted strong">My Communityに割り当てられたCommunityだけを表示できます。</p><button id="backMy" class="btn line section">My Communityへ戻る</button></section>';
        document.getElementById("backMy").onclick=function(){go("my")};
        return;
      }
    }
    const base=await client.from("communities")
      .select("id,name,prefecture,member_count,avatar_url,coverage,coverage_from,coverage_to,fetched_at,campfire_url")
      .eq("id",id).maybeSingle();
    if(base.error||!base.data){
      app.innerHTML='<section class="card center"><h2>このCommunityは表示できません</h2><p class="muted strong">割り当て外、または存在しないCommunityです。</p><button id="backMy" class="btn line section">My Communityへ戻る</button></section>';
      document.getElementById("backMy").onclick=function(){go("my")};
      return;
    }
    const community=base.data;
    const period=communityPeriod;
    const periodLabel=(COMMUNITY_PERIODS.find(function(item){return item[1]===period})||["1か月"])[0];
    const trendBucket=activityBucket(period);
    const since=period===null?null:new Date(Date.now()-period*24*60*60*1000).toISOString();

    let meetupQuery=client.from("meetups")
      .select("id,title,starts_at,ends_at,location,event_url,details,is_ca_meetup,rsvp_count,checkin_count")
      .eq("community_id",id)
      .order("starts_at",{ascending:false})
      .limit(period===null?500:50);
    if(since) meetupQuery=meetupQuery.gte("starts_at",since);

    const results=await Promise.all([
      meetupQuery,
      client.from("community_ca_members").select("ca_member_id").eq("community_id",id),
      client.rpc("community_activity_summary",{p_community_id:id,p_days:period}),
      client.rpc("community_activity_trend",{p_community_id:id,p_bucket:trendBucket,p_days:period})
    ]);
    const meetups=results[0].data||[];
    const links=results[1].data||[];
    const summary=(results[2].data&&results[2].data[0])||{meetup_count:0,ca_meetup_count:0,rsvp_count:0,checkin_count:0,last_event_at:null};
    const trend=results[3].data||[];
    let cas=[];
    if(links.length){
      const cr=await client.from("ca_members").select("id,trainer_name,ca_level").in("id",links.map(function(x){return x.ca_member_id})).order("ca_level");
      cas=cr.data||[];
    }
    const totalRsvp=Number(summary.rsvp_count||0);
    const totalCheckin=Number(summary.checkin_count||0);
    const caMeetups=Number(summary.ca_meetup_count||0);
    const meetupCount=Number(summary.meetup_count||0);
    let html='<button id="backMy" class="linkbtn">← My Community</button>'+
      '<section class="card hero section"><div class="community-hero-row">'+communityIconHtml(community,true)+'<div><span class="pill">'+e(community.prefecture||"—")+'</span><h1 style="margin-top:10px">'+e(community.name)+'</h1></div></div>'+
      '<div class="tags">'+
      cas.map(function(ca){const mine=(profile&&profile.niantic_id?String(profile.niantic_id):"").replace(/^@+/,"").toLowerCase()===String(ca.trainer_name||"").replace(/^@+/,"").toLowerCase();const cls=ca.ca_level==="1st"?"amber":ca.ca_level==="2nd"?"blue":"";return '<span class="pill '+cls+'">'+e(ca.ca_level||"CA")+': '+e(ca.trainer_name)+(mine?'（あなた）':'')+'</span>'}).join("")+
      '</div><div class="tags"><span class="pill slate">Member: '+e(community.member_count==null?"未取得":Number(community.member_count).toLocaleString("ja-JP"))+'</span></div>'+(community.coverage!=="complete"?'<div class="notice section">⚠️ 一部の過去データが未取得のため、全期間集計は参考値です</div>':'')+(community.campfire_url?'<p><a href="'+e(community.campfire_url)+'" target="_blank" rel="noreferrer" style="color:#65a30d;font-weight:900">Campfireを開く ↗</a></p>':'')+'</section>'+
      '<div class="periodbar">'+COMMUNITY_PERIODS.map(function(item){return '<button type="button" class="periodbtn '+(item[1]===period?'active':'')+'" data-community-period="'+(item[1]===null?'all':item[1])+'">'+item[0]+'</button>'}).join("")+'</div>'+
      '<section class="grid g3 section"><div class="metric"><span class="tiny strong muted">🔥 Meetup / '+e(periodLabel)+'</span><b>'+meetupCount.toLocaleString("ja-JP")+'</b></div>'+
      '<div class="metric"><span class="tiny strong muted">🍀 CA Meetup / '+e(periodLabel)+'</span><b>'+caMeetups.toLocaleString("ja-JP")+'</b></div>'+
      '<div class="metric"><span class="tiny strong muted">✅ Check-in / '+e(periodLabel)+'</span><b>'+totalCheckin.toLocaleString("ja-JP")+'</b></div></section>'+
      activityChartHtml(trend,trendBucket,periodLabel)+
      '<section class="card section"><h2>🔥 Meetup履歴 / '+e(periodLabel)+'</h2><p class="muted small strong">RSVP '+totalRsvp.toLocaleString("ja-JP")+' / Check-in '+totalCheckin.toLocaleString("ja-JP")+' · '+(period===null?'最大500件':'最新50件')+'表示</p>';
    if(!meetups.length){
      html+='<div class="notice section">この期間のMeetupデータはありません。</div>';
    }else{
      html+='<div class="section">'+meetups.map(function(m,index){
        return '<button type="button" class="claim clickable" style="display:block;width:100%;text-align:left;margin-top:10px" data-meetup-index="'+index+'"><div class="row between wraprow"><div><div class="tiny strong" style="color:#65a30d">'+e(fmt(m.starts_at))+'</div><h3 style="margin-top:5px">'+e(m.title)+'</h3><div class="small muted strong" style="margin-top:4px">📍 '+e(m.location||"場所未取得")+'</div></div><div class="tags" style="margin-top:0">'+(m.is_ca_meetup?'<span class="pill">CA Meetup</span>':'')+'<span class="pill">概要を見る →</span></div></div><div class="tags"><span class="pill slate">RSVP '+e(m.rsvp_count==null?"—":m.rsvp_count)+'</span><span class="pill slate">Check-in '+e(m.checkin_count==null?"—":m.checkin_count)+'</span></div></button>';
      }).join("")+'</div>';
    }
    html+='</section><div class="version">mirror '+VERSION+'</div>';
    app.innerHTML=html;
    document.getElementById("backMy").onclick=function(){go("my")};
    app.querySelectorAll("[data-community-period]").forEach(function(b){
      b.onclick=function(){
        communityPeriod=b.dataset.communityPeriod==="all"?null:Number(b.dataset.communityPeriod);
        void renderCommunity(id);
      };
    });
    app.querySelectorAll("[data-meetup-index]").forEach(function(b){
      b.onclick=function(){
        const index=Number(b.dataset.meetupIndex);
        if(Number.isInteger(index)&&meetups[index])openMeetupOverview(meetups[index]);
      };
    });
  }

  function meetupOverviewText(m){
    const lines=[
      "【"+String(m.title||"Meetup")+"】",
      "日時: "+fmt(m.starts_at)+(m.ends_at?" 〜 "+fmt(m.ends_at):""),
      "場所: "+String(m.location||"未取得"),
      "RSVP: "+String(m.rsvp_count==null?"—":m.rsvp_count),
      "Check-in: "+String(m.checkin_count==null?"—":m.checkin_count),
      "CA Meetup: "+(m.is_ca_meetup?"はい":"いいえ")
    ];
    if(m.details&&String(m.details).trim())lines.push("",String(m.details).trim());
    if(m.event_url)lines.push("","Campfire: "+String(m.event_url));
    return lines.join("\n");
  }

  async function openMeetupOverview(m){
    const old=document.getElementById("meetupModal");
    if(old)old.remove();

    const loading=document.createElement("div");
    loading.id="meetupModal";
    loading.className="modalback";
    loading.innerHTML='<section class="modal center"><span class="pill">MEETUP OVERVIEW</span><h2 style="margin-top:12px">'+e(m.title||"Meetup")+'</h2><div class="notice section">概要を読み込み中...</div></section>';
    document.body.appendChild(loading);

    let detail=m;
    let detailState="";
    if(!detail.details||!String(detail.details).trim()){
      try{
        const r=await client.functions.invoke("meetup-detail",{body:{meetupId:detail.id}});
        if(!r.error&&r.data&&r.data.meetup){
          detail=r.data.meetup;
          if(r.data.detailUnavailable==="campfire_returned_empty_details") detailState="Campfire側から概要本文を取得できませんでした。";
          if(r.data.detailUnavailable==="token_missing") detailState="現在、概要本文を取得できません。";
        }else{
          detailState="概要本文の取得に失敗しました。";
        }
      }catch(_e){
        detailState="概要本文の取得に失敗しました。";
      }
    }

    loading.remove();
    const back=document.createElement("div");
    back.id="meetupModal";
    back.className="modalback";
    const description=detail.details&&String(detail.details).trim()
      ?'<div class="modaltext section">'+e(String(detail.details).trim())+'</div>'
      :'<div class="notice section">'+e(detailState||"概要文はありません。")+'</div>';
    back.innerHTML='<section class="modal"><div class="row between"><div><span class="pill">MEETUP OVERVIEW</span><h2 style="margin-top:10px">'+e(detail.title||"Meetup")+'</h2></div><button id="meetupClose" class="closebtn" type="button">×</button></div>'+
      '<div class="modalgrid section"><div><div class="tiny strong muted">日時</div><div class="small strong" style="margin-top:4px">'+e(fmt(detail.starts_at)+(detail.ends_at?" 〜 "+fmt(detail.ends_at):""))+'</div></div><div><div class="tiny strong muted">場所</div><div class="small strong" style="margin-top:4px">'+e(detail.location||"未取得")+'</div></div><div><div class="tiny strong muted">RSVP</div><div class="strong" style="margin-top:4px">'+e(detail.rsvp_count==null?"—":detail.rsvp_count)+'</div></div><div><div class="tiny strong muted">Check-in</div><div class="strong" style="margin-top:4px">'+e(detail.checkin_count==null?"—":detail.checkin_count)+'</div></div></div>'+
      description+
      '<div class="grid g2 section"><button id="copyMeetup" class="btn" type="button">📋 概要をコピー</button>'+(detail.event_url?'<a class="extbtn" target="_blank" rel="noreferrer" href="'+e(detail.event_url)+'">Campfireで開く ↗</a>':'<button class="btn line" type="button" disabled>Campfire URLなし</button>')+'</div></section>';
    document.body.appendChild(back);
    function close(){back.remove()}
    back.onclick=function(ev){if(ev.target===back)close()};
    document.getElementById("meetupClose").onclick=close;
    document.getElementById("copyMeetup").onclick=async function(){
      try{
        await navigator.clipboard.writeText(meetupOverviewText(detail));
        this.textContent="✓ コピーしました";
        const button=this;
        setTimeout(function(){if(document.body.contains(button))button.textContent="📋 概要をコピー"},1600);
      }catch(_e){
        this.textContent="コピーできませんでした";
      }
    };
  }

  async function submitClaim(){
    const input=document.getElementById("claimUrl");
    const out=document.getElementById("claimResult");
    const value=input.value.trim();if(!value)return;
    busy=true;input.disabled=true;document.getElementById("submitClaim").disabled=true;
    out.innerHTML='<div class="notice section">Communityを確認中...</div>';
    const r=await client.functions.invoke("community-claim",{body:{action:"submit",url:value}});
    busy=false;
    if(r.error){
      let msg="申請に失敗しました。コミュニティ招待URL / ミートアップ共有URLを確認してください。";
      try{const ctx=r.error.context;if(ctx&&typeof ctx.clone==="function"){const p=await ctx.clone().json();if(p&&p.error)msg=String(p.error)}}catch(_e){}
      out.innerHTML='<div class="notice err section">'+e(msg)+'</div>';
      input.disabled=false;document.getElementById("submitClaim").disabled=false;return;
    }
    setFlash(r.data&&r.data.communityName?r.data.communityName+" の承認申請を送りました 🍀":"承認申請を送りました 🍀","ok");
    await renderMy();
  }
  function renderAccount(){
    const id=profile&&profile.niantic_id?profile.niantic_id:"";
    app.innerHTML='<section class="card"><span class="pill">ACCOUNT</span><h1 style="margin-top:12px">👤 アカウント</h1><div class="section"><div class="tiny strong muted">Google account</div><div class="strong" style="margin-top:4px">'+e(session.user.email||"—")+'</div><div class="tiny strong muted" style="margin-top:18px">Role</div><span class="pill" style="margin-top:5px">'+e(profile.role||"pending")+'</span><label class="tiny strong muted" style="display:block;margin-top:20px">Niantic ID</label><input id="niantic" class="input" style="margin-top:7px" value="'+e(id)+'" placeholder="Niantic IDを入力"><button id="saveNiantic" class="btn section">Niantic IDを保存</button><p class="tiny muted strong center">先頭の「@」は保存時に自動で外します。</p>'+(profile.role==="pending"&&id?'<button id="continue" class="btn dark section">CA登録を続ける →</button>':'')+'<button id="logout" class="btn line section">ログアウト</button>'+flashHtml()+'</div></section><div class="version">mirror '+VERSION+'</div>';
    document.getElementById("saveNiantic").onclick=saveNiantic;
    document.getElementById("logout").onclick=logout;
    const c=document.getElementById("continue");if(c)c.onclick=function(){go("my")};
  }
  async function saveNiantic(){
    const el=document.getElementById("niantic");
    const value=el.value.trim().replace(/^@+/,"");
    const r=await client.from("profiles").update({niantic_id:value||null}).eq("id",session.user.id);
    if(r.error){setFlash(r.error.message,"err");return}
    await loadProfile();
    setFlash("保存しました 🍀","ok");
  }
  async function renderAdmin(){
    app.innerHTML='<section class="card hero"><span class="pill violet">ADMIN</span><h1 style="margin-top:12px">🛎️ Community申請</h1><p class="muted strong">読み込み中...</p></section>';
    const r=await client.from("community_access_requests")
      .select("id,user_id,meetup_title,meetup_url,input_url,request_source,community_name_snapshot,community_prefecture_snapshot,is_ca_meetup,master_match,creator_display_name,creator_username,creator_username_matches_profile,creator_ca_badge_verified,ca_level_snapshot,ca_role_verified,ca_map_status,status,requested_at,reviewed_at")
      .order("requested_at",{ascending:false}).limit(100);
    const rows=r.data||[];
    const ids=[...new Set(rows.map(function(x){return x.user_id}).filter(Boolean))];
    let profiles={};
    if(ids.length){
      const pr=await client.from("profiles").select("id,email,niantic_id,role").in("id",ids);
      (pr.data||[]).forEach(function(x){profiles[x.id]=x});
    }
    const pending=rows.filter(function(x){return x.status==="pending"});
    let html='<section class="card hero"><span class="pill violet">ADMIN</span><h1 style="margin-top:12px">🛎️ Community申請</h1><p class="muted strong">承認待ち '+pending.length+' 件</p></section>'+flashHtml();
    if(!rows.length)html+='<section class="card section center"><h2>申請はありません</h2></section>';
    rows.forEach(function(c){
      const p=profiles[c.user_id]||{};
      const invite=c.request_source==="community_invite";
      const can=c.status==="pending"&&(invite||c.creator_ca_badge_verified===true)&&c.creator_username_matches_profile===true&&c.ca_role_verified===true&&c.ca_map_status==="matched";
      const status=c.status==="approved"?'<span class="pill">承認済み</span>':c.status==="rejected"?'<span class="pill rose">却下</span>':'<span class="pill amber">承認待ち</span>';
      html+='<section class="claim section"><div class="row between wraprow"><div><div class="tiny strong" style="color:#65a30d">'+e(c.community_prefecture_snapshot||"—")+'</div><h2 style="margin-top:5px">'+e(c.community_name_snapshot)+'</h2><div class="small muted strong" style="margin-top:5px">'+e(invite?"コミュニティ招待URLから申請":(c.meetup_title||"ミートアップ共有URLから申請"))+'</div></div>'+status+'</div><div class="tags">'+(invite?'<span class="pill">コミュニティ招待URL</span>':'<span class="pill violet">'+(c.creator_ca_badge_verified===true?"🟣 CAバッジ確認済み":"CAバッジ未確認")+'</span>')+'<span class="pill '+(c.creator_username_matches_profile===true?"blue":"rose")+'">Niantic ID '+(c.creator_username_matches_profile===true?"一致":"不一致")+'</span><span class="pill '+(c.ca_role_verified===true?"":"rose")+'">CA地図 '+e(c.ca_level_snapshot||"未確認")+'</span><span class="pill '+(c.ca_map_status==="matched"?"":"rose")+'">'+e(c.ca_map_status||"要確認")+'</span></div><p class="small muted strong">申請者: '+e(p.email||"—")+' / Niantic ID: '+e(p.niantic_id||"未登録")+'</p>'+(c.input_url?'<p class="small"><a href="'+e(c.input_url)+'" target="_blank" rel="noreferrer" style="color:#65a30d;font-weight:900">Campfireを確認 ↗</a></p>':'')+(c.status==="pending"?'<div class="actions"><button class="btn rose" data-review="reject" data-id="'+e(c.id)+'">却下</button><button class="btn" data-review="approve" data-id="'+e(c.id)+'" '+(can?"":"disabled")+'>承認</button></div>':'')+'<div class="tiny muted" style="margin-top:10px">申請 '+e(fmt(c.requested_at))+'</div></section>';
    });
    app.innerHTML=html+'<div class="version">mirror '+VERSION+'</div>';
    app.querySelectorAll("[data-review]").forEach(function(b){b.onclick=function(){reviewClaim(b.dataset.id,b.dataset.review)}});
  }
  async function reviewClaim(id,action){
    if(busy)return;busy=true;
    const r=await client.functions.invoke("community-claim",{body:{action:action,requestId:id}});
    busy=false;
    if(r.error){
      let msg="処理に失敗しました";
      try{const ctx=r.error.context;if(ctx&&typeof ctx.clone==="function"){const p=await ctx.clone().json();if(p&&p.error)msg=String(p.error)}}catch(_e){}
      setFlash(msg,"err");return;
    }
    setFlash(action==="approve"?"承認しました 🍀":"却下しました","ok");
    await renderAdmin();
  }
  async function render(){
    header();
    if(!session){loginView();return}
    if(!profile)await loadProfile();
    header();
    let v=route();
    if(v==="admin"&&profile.role!=="admin"){v="my";location.hash="my"}
    if(v==="account"){renderAccount();return}
    if(v==="admin"){await renderAdmin();return}
    if(v.startsWith("community:")){await renderCommunity(decodeURIComponent(v.slice("community:".length)));return}
    await renderMy();
  }
  init();
})();
</script>
</body>
</html>
