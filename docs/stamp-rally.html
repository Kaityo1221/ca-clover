<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4c58d">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>CA Clover Stamp Rally LAB</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>\n<script src="./community-icon.js"></script>
<style>
:root{font-family:Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#403a35;background:#fff8ef}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 0 0,rgba(244,197,141,.28),transparent 28rem),linear-gradient(180deg,#fffaf4,#fff6eb 70%,#fbf4ea)}
button{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}
.top{position:sticky;top:0;z-index:30;background:rgba(255,253,249,.9);backdrop-filter:blur(18px);border-bottom:1px solid #eedcc9}
.topin{max-width:1000px;margin:auto;padding:12px 14px;display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:15px;background:#dff0d5;display:grid;place-items:center;font-size:23px}
.grow{flex:1}.btn{border:1px solid #d8c8b8;background:#fff;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:900;color:#5c7d4e}
.wrap{max-width:1000px;margin:auto;padding:18px 12px 64px}
.hero{border:1px solid #efd6bd;background:linear-gradient(135deg,#f3bd80,#f7d7ad 54%,#fff0df);border-radius:30px;padding:20px;box-shadow:0 18px 45px rgba(128,82,38,.12)}
.kicker{font-size:10px;font-weight:950;letter-spacing:.18em;color:#68875b}.hero h1{margin:4px 0 0;font-size:29px;color:#3d3935;letter-spacing:-.03em}
.hero p{margin:8px 0 0;font-size:12px;line-height:1.65;font-weight:800;color:#705f51}
.summary{margin-top:16px;border-radius:22px;background:rgba(255,255,255,.72);padding:13px 15px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.summary small{font-size:10px;font-weight:900;color:#7c7067}.score{font-size:28px;font-weight:950;color:#3d3935}.score span{font-size:14px;color:#92877e}
.note{max-width:185px;text-align:right;font-size:9px;line-height:1.5;font-weight:800;color:#92785e}
.regions{margin-top:16px;display:grid;gap:10px}
.region{overflow:hidden;border:1px solid #ead7c4;border-radius:25px;background:#fffdf9;box-shadow:0 10px 26px rgba(92,69,45,.06)}
.regionbtn,.prefbtn{width:100%;border:0;background:transparent;text-align:left;display:flex;align-items:center;gap:12px}
.regionbtn{padding:15px 16px}.leaf{width:39px;height:39px;border-radius:15px;background:#edf5e8;display:grid;place-items:center}
.regiontitle{font-weight:950;color:#3f3a36}.sub{font-size:10px;font-weight:800;color:#9a8b7f;margin-top:2px}.chev{font-size:20px;font-weight:950;color:#708e62;transition:.18s transform}.open>.regionbtn .chev,.pref.open>.prefbtn .chev{transform:rotate(180deg)}
.prefwrap{display:none;border-top:1px solid #f0e3d7;background:#fffaf4;padding:8px}.region.open>.prefwrap{display:grid;gap:7px}
.pref{overflow:hidden;border:1px solid #eadfd4;border-radius:20px;background:#fff}.prefbtn{padding:12px 13px}.prefname{font-weight:950;color:#49423d}
.progress{margin-left:auto;border-radius:999px;background:#edf5e8;color:#587747;padding:5px 10px;font-size:11px;font-weight:950;white-space:nowrap}
.stamps{display:none;border-top:1px solid #f3e8dd;background:#fffdf9;padding:13px 10px 16px;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 7px}
.pref.open>.stamps{display:grid}
.stamp{text-align:center;min-width:0}.medal{position:relative;width:78px;height:78px;margin:auto;border-radius:999px;padding:5px;background:linear-gradient(135deg,#f8e3bf,#fff,#edc993);box-shadow:0 7px 17px rgba(112,73,35,.18)}
.medal.unowned{padding:4px;border:2px dashed #cbc5bf;background:#f1efec;box-shadow:none}.medalinner{position:relative;width:100%;height:100%;overflow:hidden;border-radius:999px;background:#eef2e9;display:grid;place-items:center}.medalinner .fallback{font-size:30px;color:#91a889}.medalinner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.unowned .medalinner{filter:grayscale(1);opacity:.34}
.check{position:absolute;right:-2px;top:-2px;width:23px;height:23px;border:2px solid #fff;border-radius:999px;background:#6d9758;color:#fff;display:grid;place-items:center;font-size:10px;font-weight:950}
.cname{margin-top:8px;min-height:31px;font-size:10px;line-height:1.42;font-weight:950;color:#4b433c;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.canames{margin-top:5px;display:grid;gap:4px}.caname{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:999px;padding:3px 4px;font-size:8px;font-weight:950}
.caname.on{background:#e9f3e4;color:#557749}.caname.off{border:1px dashed #d3cec8;background:#f7f5f2;color:#aaa29a}
.empty{text-align:center;padding:16px 8px;font-size:11px;font-weight:850;color:#a0958a}.loading,.error{margin-top:16px;border-radius:22px;background:#fff;padding:20px;text-align:center;font-size:12px;font-weight:900}.error{background:#fff1f2;color:#be123c;border:1px solid #fecdd3}
.footer{margin-top:16px;border:1px dashed #d7c5b4;border-radius:21px;background:rgba(255,255,255,.62);padding:13px;text-align:center;font-size:10px;line-height:1.6;font-weight:800;color:#8d7b6b}
.exchange-card{margin-top:14px;display:flex;align-items:center;justify-content:space-between;border:1px solid #d9c4ad;border-radius:22px;background:#fff;padding:15px 17px;box-shadow:0 8px 22px rgba(92,69,45,.06)}.exchange-card strong{display:block;font-size:14px;color:#45663a}.exchange-card small{display:block;margin-top:3px;font-size:10px;font-weight:800;color:#938478}.exchange-card .arrow{font-size:20px;font-weight:950;color:#6a8d59}\n.stamp{border:0;background:transparent;padding:0;width:100%}
.stampmodalback{position:fixed;inset:0;z-index:80;display:none;place-items:center;background:rgba(15,23,42,.55);backdrop-filter:blur(6px);padding:20px}.stampmodalback.show{display:grid}.stampmodal{width:min(360px,100%);border:1px solid #ead5bf;border-radius:30px;background:#fffaf4;padding:18px;text-align:center;box-shadow:0 26px 70px rgba(15,23,42,.28)}.stampclose{margin-left:auto;width:36px;height:36px;border:0;border-radius:999px;background:#fff;color:#75695f;font-size:20px;font-weight:950;box-shadow:0 4px 14px rgba(80,60,40,.10)}.stampzoom{position:relative;width:224px;height:224px;margin:4px auto 0;border-radius:999px;padding:8px;background:linear-gradient(135deg,#f8e3bf,#fff,#edc993);box-shadow:0 18px 45px rgba(112,73,35,.22)}.stampzoom .medalinner{width:100%;height:100%}.stampzoomtitle{margin:18px 0 0;font-size:20px;line-height:1.35;color:#443c35}.stampzoomarea{margin:5px 0 0;font-size:12px;font-weight:850;color:#8a7d72}
@media(min-width:600px){.stamps{grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 15px}.medal{width:94px;height:94px}.cname{font-size:11px}.caname{font-size:9px}}
@media(min-width:900px){.stamps{grid-template-columns:repeat(5,minmax(0,1fr))}}
</style>
</head>
<body>
<header class="top"><div class="topin">
  <a class="logo" href="./">🍀</a>
  <strong style="font-size:14px;color:#405b36">CA Stamp Rally LAB</strong>
  <div class="grow"></div>
  <a id="stampBackLink" class="btn" href="./">CA Clover Home</a>
</div></header>
<main class="wrap">
  <section class="hero">
    <div class="kicker">CA CLOVER STAMP RALLY</div>
    <h1>全国スタンプ一覧</h1>
    <p>地方を開いて、都道府県ごとのCommunityメダルを眺めるスタンプシート。</p>
    <div class="summary">
      <div><small>出会ったCA</small><div id="totalScore" class="score">— <span>/ —</span></div></div>
      <div class="note">※ LAB版の取得状況はUI確認用のサンプル表示です</div>
    </div>
  </section>\n  <a class="exchange-card" href="./stamp-exchange.html"><span><strong>🤝 スタンプ交換</strong><small>QRで1対1交換する</small></span><span class="arrow">→</span></a>\n  <div id="status" class="loading">スタンプシートを準備中... 🍀</div>
  <section id="regions" class="regions" hidden></section>
  <div class="footer">🍀 通常1対1交換を追加しました。スタンプシートの実取得データ接続は次の段階で進めます。</div>
</main>
<div id="stampModalBack" class="stampmodalback" aria-hidden="true">
  <section class="stampmodal" role="dialog" aria-modal="true" aria-labelledby="stampZoomTitle">
    <button id="stampClose" class="stampclose" type="button" aria-label="閉じる">×</button>
    <div class="stampzoom"><div class="medalinner"><span class="fallback">🍀</span><img id="stampZoomImg" alt=""></div></div>
    <h2 id="stampZoomTitle" class="stampzoomtitle"></h2>
    <p id="stampZoomArea" class="stampzoomarea"></p>
  </section>
</div>
<script>
(function(){
"use strict";
const SUPABASE_URL="https://wgiittrvgtiosogyhfcl.supabase.co";
const SUPABASE_KEY="sb_publishable_QTCqijfNvnysUTMylNIyTA_6ngosaPN";
const ROOT="https://kaityo1221.github.io/ca-clover/";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce"}});
const status=document.getElementById("status");
const stampBackLink=document.getElementById("stampBackLink");
const regionsEl=document.getElementById("regions");
const totalScore=document.getElementById("totalScore");
const stampModalBack=document.getElementById("stampModalBack");
const stampClose=document.getElementById("stampClose");
const stampZoomImg=document.getElementById("stampZoomImg");
const stampZoomTitle=document.getElementById("stampZoomTitle");
const stampZoomArea=document.getElementById("stampZoomArea");
let stampCommunityById=new Map();
const prefectureOrder=["北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県","茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県","新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県","三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県","鳥取県","島根県","岡山県","広島県","山口県","徳島県","香川県","愛媛県","高知県","福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"];
const groups=[
 ["北海道・東北",["北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県"]],
 ["関東",["茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県"]],
 ["中部",["新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県"]],
 ["近畿",["三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県"]],
 ["中国",["鳥取県","島根県","岡山県","広島県","山口県"]],
 ["四国",["徳島県","香川県","愛媛県","高知県"]],
 ["九州・沖縄",["福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"]]
];
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c])}
function demoAcquired(id){let score=0;for(let i=0;i<id.length;i++)score=(score*33+id.charCodeAt(i))%9973;return score%10<4}
function thumb(c){return window.CACommunityIcon.url(client,c)}
async function authGuard(){
 const s=await client.auth.getSession();const session=s.data.session;
 if(!session){location.href=ROOT;return false}
 const [p,u]=await Promise.all([
  client.from("profiles").select("role").eq("id",session.user.id).maybeSingle(),
  client.from("user_permissions").select("permission_code").eq("user_id",session.user.id).eq("permission_code","S")
 ]);
 const isAdmin=p.data?.role==="admin";
 const hasStamp=(u.data||[]).some(x=>x.permission_code==="S");
 if(isAdmin){
  stampBackLink.href="./admin.html";
  stampBackLink.textContent="管理メニュー";
 }else{
  stampBackLink.href="./";
  stampBackLink.textContent="CA Clover Home";
 }
 if(!isAdmin&&!hasStamp){
  status.className="error";
  status.textContent="このページにはS権限が必要です。";
  return false;
 }
 return true;
}
async function load(){
 if(!await authGuard())return;
 const catalog=await client.rpc("stamp_rally_catalog");
 if(catalog.error){status.className="error";status.textContent=catalog.error.message;return}
 const communityMap=new Map();
 (catalog.data||[]).forEach(row=>{
  let community=communityMap.get(row.community_id);
  if(!community){
   community={
    id:row.community_id,
    name:row.community_name,
    prefecture:row.prefecture,
    avatar_url:row.avatar_url,
    avatar_thumbnail_path:row.avatar_thumbnail_path,
    avatar_last_changed_at:row.avatar_last_changed_at,
    cas:[]
   };
   communityMap.set(row.community_id,community);
  }
  if(row.ca_member_id&&row.trainer_name){
   community.cas.push({
    id:row.ca_member_id,
    trainer_name:row.trainer_name,
    ca_level:row.ca_level,
    acquired:demoAcquired(row.ca_member_id)
   });
  }
 });
 const communities=[...communityMap.values()].map(c=>({
  ...c,
  cas:c.cas.sort((a,b)=>a.ca_level===b.ca_level?a.trainer_name.localeCompare(b.trainer_name,"ja"):a.ca_level==="1st"?-1:b.ca_level==="1st"?1:0)
 })).sort((a,b)=>{
  const ai=prefectureOrder.indexOf(a.prefecture),bi=prefectureOrder.indexOf(b.prefecture);
  return (ai<0?999:ai)-(bi<0?999:bi)||a.name.localeCompare(b.name,"ja")
 });
 stampCommunityById=new Map(communities.map(c=>[c.id,c]));
 const all=communities.flatMap(c=>c.cas);const got=all.filter(c=>c.acquired).length;
 totalScore.innerHTML=got+' <span>/ '+all.length+'</span>';
 const byPref=new Map();communities.forEach(c=>{const k=c.prefecture||"都道府県未設定";const l=byPref.get(k)||[];l.push(c);byPref.set(k,l)});
 regionsEl.innerHTML=groups.map(([region,prefs])=>{
  const rc=prefs.reduce((n,p)=>n+(byPref.get(p)||[]).length,0);
  const prefHtml=prefs.map(p=>{
    const rows=byPref.get(p)||[];const cas=rows.flatMap(c=>c.cas);const acquired=cas.filter(c=>c.acquired).length;
    const stamps=rows.length?rows.map(c=>{
      const gotCount=c.cas.filter(x=>x.acquired).length,any=gotCount>0,allGot=c.cas.length>0&&gotCount===c.cas.length,url=thumb(c);
      return '<button type="button" class="stamp" data-community="'+esc(c.id)+'"><div class="medal '+(any?'':'unowned')+'"><div class="medalinner"><span class="fallback">🍀</span>'+window.CACommunityIcon.img(client,c,'alt="" loading="lazy"')+'</div>'+(allGot?'<span class="check">✓</span>':'')+'</div><div class="cname">'+esc(c.name)+'</div><div class="canames">'+(c.cas.length?c.cas.slice(0,2).map(x=>'<div class="caname '+(x.acquired?'on':'off')+'">'+(x.acquired?'● ':'○ ')+esc(x.trainer_name)+'</div>').join(""):'<div class="caname off">CA未設定</div>')+(c.cas.length>2?'<div class="caname off">+'+(c.cas.length-2)+'</div>':'')+'</div></button>'
    }).join(""):'<div class="empty">Communityはありません</div>';
    return '<div class="pref"><button class="prefbtn"><div><div class="prefname">'+esc(p)+'</div><div class="sub">'+rows.length+' Community</div></div><span class="progress">'+acquired+' / '+cas.length+'</span><span class="chev">⌄</span></button><div class="stamps">'+stamps+'</div></div>'
  }).join("");
  return '<div class="region"><button class="regionbtn"><span class="leaf">🍀</span><div><div class="regiontitle">'+esc(region)+'</div><div class="sub">'+rc+' Community</div></div><div class="grow"></div><span class="chev">⌄</span></button><div class="prefwrap">'+prefHtml+'</div></div>'
 }).join("");
 status.hidden=true;regionsEl.hidden=false;
 document.querySelectorAll(".regionbtn").forEach(b=>b.onclick=()=>b.parentElement.classList.toggle("open"));
 document.querySelectorAll(".prefbtn").forEach(b=>b.onclick=()=>b.parentElement.classList.toggle("open"));
 window.CACommunityIcon.bind(regionsEl);
 regionsEl.querySelectorAll(".stamp[data-community]").forEach(btn=>btn.addEventListener("click",()=>{
  const c=stampCommunityById.get(btn.dataset.community);
  if(!c)return;
  stampZoomTitle.textContent=c.name||"";
  stampZoomArea.textContent=c.prefecture||"";
  const url=thumb(c);
  stampZoomImg.style.display=url?"block":"none";
  stampZoomImg.dataset.original=c.avatar_url||"";
  stampZoomImg.dataset.caCommunityIcon="1";
  stampZoomImg.dataset.caBound="";
  if(url)stampZoomImg.src=url;
  window.CACommunityIcon.bind(stampModalBack);
  stampModalBack.classList.add("show");
  stampModalBack.setAttribute("aria-hidden","false");
 }));
}
function closeStampModal(){stampModalBack.classList.remove("show");stampModalBack.setAttribute("aria-hidden","true")}
stampClose.onclick=closeStampModal;
stampModalBack.addEventListener("click",e=>{if(e.target===stampModalBack)closeStampModal()});
load();
})();
</script>
</body>
</html>
