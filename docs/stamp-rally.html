(function(){
"use strict";
const SUPABASE_URL="https://wgiittrvgtiosogyhfcl.supabase.co";
const SUPABASE_KEY="sb_publishable_QTCqijfNvnysUTMylNIyTA_6ngosaPN";
const ROOT="https://kaityo1221.github.io/ca-clover/";

let stamp3dToken=0;
const prefectureOrder=["北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県","茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県","新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県","三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県","鳥取県","島根県","岡山県","広島県","山口県","徳島県","香川県","愛媛県","高知県","福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"];

function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c])}
function thumb(c){return window.CACommunityIcon.url(client,c)}
function unmountStampMedal3D(){
 stamp3dToken++;
 if(stamp3dCleanup){try{stamp3dCleanup()}catch(_){}stamp3dCleanup=null}
 stamp3d.classList.remove("show");
 stamp3d.innerHTML="";
 stampZoom2D.classList.remove("hidden");

async function mountStampMedal3D(design,imageUrl,fallbackImageUrl){
 unmountStampMedal3D();
 const token=++stamp3dToken;
 stamp3d.classList.add("show");
 stampZoom2D.classList.add("hidden");
 stamp3d.innerHTML='<div style="position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:900;color:#8a6d51">3Dメダルを準備中... 🪙</div>';
 try{
  const THREE=await import("three");
  const [{OrbitControls},{RoomEnvironment},{GLTFLoader}]=await Promise.all([
   import("three/addons/controls/OrbitControls.js"),
   import("three/addons/environments/RoomEnvironment.js"),
   import("three/addons/loaders/GLTFLoader.js")
  ]);
  if(token!==stamp3dToken)return;

  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(28,1,.01,100);
  camera.position.set(0,.03,4.10);

  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:"high-performance"});
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=.92;
  renderer.setClearColor(0x000000,0);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.domElement.style.width="100%";
  renderer.domElement.style.height="100%";
  renderer.domElement.style.touchAction="none";

  const pmrem=new THREE.PMREMGenerator(renderer);
  const room=new RoomEnvironment();
  const environment=pmrem.fromScene(room,.04).texture;
  room.dispose();
  scene.environment=environment;

  scene.add(new THREE.HemisphereLight(0xffffff,0x6f685f,1.7));
  const keyLight=new THREE.DirectionalLight(0xffffff,3.1);
  keyLight.position.set(2.4,3.2,4.2);
  scene.add(keyLight);
  const rimLight=new THREE.DirectionalLight(0xffe5b4,1.6);
  rimLight.position.set(-3.2,.8,-2.4);
  scene.add(rimLight);

  const holder=new THREE.Group();
  holder.rotation.x=-.055;
  holder.rotation.y=.22;
  scene.add(holder);

  const controls=new OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true;
  controls.dampingFactor=.06;
  controls.enablePan=false;
  controls.enableZoom=false;
  controls.rotateSpeed=.55;
  controls.autoRotate=true;
  controls.autoRotateSpeed=1.35;
  controls.target.set(0,0,0);

  const goldMaterial=new THREE.MeshPhysicalMaterial({color:0xb8922e,metalness:.95,roughness:.34,reflectivity:.52,clearcoat:.08,clearcoatRoughness:.18});
  const faceMaterial=new THREE.MeshPhysicalMaterial({color:0xffffff,metalness:0,roughness:.18,reflectivity:.38,clearcoat:.25,clearcoatRoughness:.20});
  const backMaterial=new THREE.MeshPhysicalMaterial({color:0xd7d7d7,metalness:.95,roughness:.16,reflectivity:.85,clearcoat:.4,clearcoatRoughness:.08});
  const brushedMaterial=new THREE.MeshPhysicalMaterial({color:0xd2d2d2,metalness:.65,roughness:.42,reflectivity:.45,clearcoat:.1});
  const pinMaterial=new THREE.MeshPhysicalMaterial({color:0xf0f0f0,metalness:.9,roughness:.22,reflectivity:.8,clearcoat:.2,clearcoatRoughness:.08});

  const gltf=await new GLTFLoader().loadAsync("./models/medal_template_final.glb?v=6");
  if(token!==stamp3dToken){
   renderer.dispose();environment.dispose();pmrem.dispose();controls.dispose();
   return;
  }
  const medal=gltf.scene;
  medal.traverse(object=>{
   if(object instanceof THREE.Camera||object instanceof THREE.Light){object.visible=false;return}
   if(!(object instanceof THREE.Mesh))return;
   if(object.name==="SplineSkyHdriBackground"){object.visible=false;return}
   if(object.name==="MedalBody")object.material=goldMaterial;
   else if(object.name==="back_shell")object.material=backMaterial;
   else if(object.name==="brushed_detail")object.material=brushedMaterial;
   else if(object.name==="pin_assembly")object.material=pinMaterial;
  });

  let faceTexture=null;
  let faceObjectUrl=null;
  const front=medal.getObjectByName("FrontFace");
  const sourceFaceMaterial=front instanceof THREE.Mesh
   ?(Array.isArray(front.material)?front.material[0]:front.material)
   :null;
  const activeFaceMaterial=sourceFaceMaterial instanceof THREE.MeshPhysicalMaterial
   ?sourceFaceMaterial.clone()
   :sourceFaceMaterial instanceof THREE.MeshStandardMaterial
    ?new THREE.MeshPhysicalMaterial({
      color:sourceFaceMaterial.color.clone(),
      metalness:sourceFaceMaterial.metalness,
      roughness:sourceFaceMaterial.roughness,
      side:sourceFaceMaterial.side,
      transparent:sourceFaceMaterial.transparent,
      opacity:sourceFaceMaterial.opacity
     })
    :faceMaterial.clone();
  activeFaceMaterial.color.set(0xffffff);
  activeFaceMaterial.metalness=0;
  activeFaceMaterial.roughness=.18;
  activeFaceMaterial.clearcoat=.25;
  activeFaceMaterial.clearcoatRoughness=.2;
  const textureLoader=new THREE.TextureLoader();
  const tryTexture=async textureUrl=>{
   if(!textureUrl||!(front instanceof THREE.Mesh))return false;
   try{
    const texture=await textureLoader.loadAsync(textureUrl);
    if(token!==stamp3dToken){texture.dispose();return false}
    texture.colorSpace=THREE.SRGBColorSpace;
    texture.flipY=false;
    texture.anisotropy=Math.min(renderer.capabilities.getMaxAnisotropy(),8);
    faceTexture=texture;
    activeFaceMaterial.map=texture;
    activeFaceMaterial.needsUpdate=true;
    front.material=activeFaceMaterial;
    return true;
   }catch(_){return false}
  };
  let textureApplied=false;
  if(design?.thumbnail_path){
   try{
    const downloaded=await client.storage.from("community-icon-thumbs").download(design.thumbnail_path);
    if(!downloaded.error&&downloaded.data&&token===stamp3dToken){
     faceObjectUrl=URL.createObjectURL(downloaded.data);
     textureApplied=await tryTexture(faceObjectUrl);
    }
   }catch(_){}
  }
  if(!textureApplied&&design?.archive_path){
   try{
    const downloaded=await client.storage.from("community-icon-archive").download(design.archive_path);
    if(!downloaded.error&&downloaded.data&&token===stamp3dToken){
     if(faceObjectUrl)URL.revokeObjectURL(faceObjectUrl);
     faceObjectUrl=URL.createObjectURL(downloaded.data);
     textureApplied=await tryTexture(faceObjectUrl);
    }
   }catch(_){}
  }
  if(!textureApplied){
   const textureCandidates=[imageUrl,fallbackImageUrl].filter((value,index,array)=>value&&array.indexOf(value)===index);
   for(const textureUrl of textureCandidates){
    if(await tryTexture(textureUrl)){textureApplied=true;break}
   }
  }

  const box=new THREE.Box3().setFromObject(medal);
  const center=box.getCenter(new THREE.Vector3());
  const size=box.getSize(new THREE.Vector3());
  medal.position.sub(center);
  const maxDimension=Math.max(size.x,size.y,size.z);
  holder.scale.setScalar(maxDimension>0?1.75/maxDimension:1);
  holder.add(medal);

  stamp3d.innerHTML="";
  stamp3d.appendChild(renderer.domElement);

  const resize=()=>{
   const width=Math.max(1,stamp3d.clientWidth),height=Math.max(1,stamp3d.clientHeight);
   renderer.setSize(width,height,false);
   camera.aspect=width/height;
   camera.updateProjectionMatrix();
  };
  resize();
  const observer=new ResizeObserver(resize);
  observer.observe(stamp3d);

  let stopped=false,frameId=0;
  const animate=()=>{
   if(stopped)return;
   controls.update();
   renderer.render(scene,camera);
   frameId=requestAnimationFrame(animate);
  };
  animate();

  stamp3dCleanup=()=>{
   stopped=true;
   cancelAnimationFrame(frameId);
   observer.disconnect();
   controls.dispose();
   faceTexture?.dispose();
   if(faceObjectUrl)URL.revokeObjectURL(faceObjectUrl);
   if(activeFaceMaterial!==faceMaterial)activeFaceMaterial.dispose();
   goldMaterial.dispose();faceMaterial.dispose();backMaterial.dispose();brushedMaterial.dispose();pinMaterial.dispose();
   environment.dispose();pmrem.dispose();renderer.dispose();
   renderer.domElement.remove();
  };
 }catch(err){
  console.error("3D medal preview failed",err);
  if(token!==stamp3dToken)return;
  stamp3d.classList.remove("show");
  stamp3d.innerHTML="";
  stampZoom2D.classList.remove("hidden");
 }
}
async function authGuard(){
 const s=await client.auth.getSession();const session=s.data.session;
 if(!session){location.href=ROOT;return false}
 currentUserId=session.user.id;
 const [p,u]=await Promise.all([
  client.from("profiles").select("role").eq("id",session.user.id).maybeSingle(),
  client.from("user_permissions").select("permission_code").eq("user_id",session.user.id).eq("permission_code","S")
 ]);
 const isAdmin=p.data?.role==="admin";
 const hasStamp=(u.data||[]).some(x=>x.permission_code==="S");
 if(isAdmin){
  stampBackLink.href="./admin.html";
  stampBackLink.textContent="管理メニュー";
 }else{
  stampBackLink.href="./";
  stampBackLink.textContent="CA Clover Home";
 }
 if(!isAdmin&&!hasStamp){
  status.className="error";
  status.textContent="このページにはS権限が必要です。";
  return false;
 }
 return true;
}
async function load(){
 if(!await authGuard())return;

 const [catalog,collectionsResult]=await Promise.all([
  client.rpc("stamp_rally_catalog"),
  client.from("stamp_collections")
    .select("id,stamp_ca_member_id,community_id,role_at_acquisition,first_acquired_at,first_location,first_event_name,acquisition_source,acquisition_icon_version_id")
    .eq("owner_user_id",currentUserId)
 ]);
 const firstError=catalog.error||collectionsResult.error;
 if(firstError){status.className="error";status.textContent=firstError.message;return}

 const collectionRows=collectionsResult.data||[];
 const collectionMap=new Map(collectionRows.map(x=>[x.stamp_ca_member_id+":"+x.community_id,x]));
 const collectionIds=collectionRows.map(x=>x.id);

 let reunionRows=[],designRows=[],preferenceRows=[],versionRows=[];
 if(collectionIds.length){
  const [rr,dr,pr]=await Promise.all([
   client.from("stamp_reunions")
    .select("id,collection_id,met_at,local_date,timezone,location,event_name,reunion_source")
    .in("collection_id",collectionIds)
    .order("met_at",{ascending:false}),
   client.from("stamp_collection_designs")
    .select("collection_id,icon_version_id,grant_source,granted_at")
    .in("collection_id",collectionIds),
   client.from("stamp_collection_preferences")
    .select("collection_id,icon_version_id,updated_at")
    .in("collection_id",collectionIds)
  ]);
  const designError=rr.error||dr.error||pr.error;
  if(designError){status.className="error";status.textContent=designError.message;return}
  reunionRows=rr.data||[];
  designRows=dr.data||[];
  preferenceRows=pr.data||[];

  const versionIds=[...new Set(designRows.map(x=>x.icon_version_id))];
  if(versionIds.length){
   const vr=await client.from("community_icon_versions")
    .select("id,community_id,content_hash,source_avatar_url,archive_path,thumbnail_path,first_seen_at,last_seen_at,is_current")
    .in("id",versionIds);
   if(vr.error){status.className="error";status.textContent=vr.error.message;return}
   versionRows=vr.data||[];
  }
 }

 const versionById=new Map(versionRows.map(x=>[x.id,x]));
 const designIdsByCollection=new Map();
 designRows.forEach(x=>{
  const list=designIdsByCollection.get(x.collection_id)||[];
  list.push(x.icon_version_id);
  designIdsByCollection.set(x.collection_id,list);
 });
 const preferenceMap=new Map(preferenceRows.map(x=>[x.collection_id,x.icon_version_id]));
 const reunionsByCollection=new Map();
 reunionRows.forEach(x=>{
  const list=reunionsByCollection.get(x.collection_id)||[];
  list.push(x);
  reunionsByCollection.set(x.collection_id,list);
 });
 reunionsByCollection.forEach(list=>list.sort((a,b)=>new Date(b.met_at)-new Date(a.met_at)));
 const reunionDate=x=>{
  if(x.local_date){
   const parts=x.local_date.split("-").map(Number);
   if(parts[0]&&parts[1]&&parts[2])return parts[0]+"/"+parts[1]+"/"+parts[2];
  }
  try{
   return new Date(x.met_at).toLocaleDateString("ja-JP",{timeZone:x.timezone||"Asia/Tokyo"});
  }catch(_){
   return new Date(x.met_at).toLocaleDateString("ja-JP");
  }
 };

 const designUrl=v=>{
  if(!v)return"";
  if(v.thumbnail_path)return client.storage.from("community-icon-thumbs").getPublicUrl(v.thumbnail_path).data.publicUrl;
  if(v.archive_path)return client.storage.from("community-icon-archive").getPublicUrl(v.archive_path).data.publicUrl;
  return v.source_avatar_url||"";
 };
 const newestDesign=ca=>{
  if(!ca||!ca.designs||!ca.designs.length)return null;
  return ca.designs.find(x=>x.is_current)||ca.designs[ca.designs.length-1]||null;
 };
 const displayDesign=ca=>{
  if(!ca||!ca.collection)return null;
  const preferred=preferenceMap.get(ca.collection.id);
  return ca.designs.find(x=>x.id===preferred)||newestDesign(ca);
 };

 const communityMap=new Map();
 (catalog.data||[]).forEach(row=>{
  let community=communityMap.get(row.community_id);
  if(!community){
   community={
    id:row.community_id,
    name:row.community_name,
    prefecture:row.prefecture,
    avatar_url:row.avatar_url,
    avatar_thumbnail_path:row.avatar_thumbnail_path,
    avatar_last_changed_at:row.avatar_last_changed_at,
    cas:[]
   };
   communityMap.set(row.community_id,community);
  }
  if(row.ca_member_id&&row.trainer_name){
   const collection=collectionMap.get(row.ca_member_id+":"+row.community_id)||null;
   const designs=collection
    ?(designIdsByCollection.get(collection.id)||[])
      .map(id=>versionById.get(id))
      .filter(Boolean)
      .sort((a,b)=>new Date(a.first_seen_at)-new Date(b.first_seen_at))
    :[];
   community.cas.push({
    id:row.ca_member_id,
    trainer_name:row.trainer_name,
    ca_level:row.ca_level,
    acquired:Boolean(collection),
    collection,
    designs
   });
  }
 });

 const communities=[...communityMap.values()].map(c=>({
  ...c,
  cas:c.cas.sort((a,b)=>a.ca_level===b.ca_level?a.trainer_name.localeCompare(b.trainer_name,"ja"):a.ca_level==="1st"?-1:b.ca_level==="1st"?1:0)
 })).sort((a,b)=>{
  const ai=prefectureOrder.indexOf(a.prefecture),bi=prefectureOrder.indexOf(b.prefecture);
  return (ai<0?999:ai)-(bi<0?999:bi)||a.name.localeCompare(b.name,"ja")
 });

 stampCommunityById=new Map(communities.map(c=>[c.id,c]));
 const all=communities.flatMap(c=>c.cas),got=all.filter(c=>c.acquired).length;
 totalScore.innerHTML=got+' <span>/ '+all.length+'</span>';

 const byPref=new Map();
 communities.forEach(c=>{
  const k=c.prefecture||"都道府県未設定",l=byPref.get(k)||[];
  l.push(c);byPref.set(k,l);
 });

 regionsEl.innerHTML=groups.map(([region,prefs])=>{
  const rc=prefs.reduce((n,p)=>n+(byPref.get(p)||[]).length,0);
  const prefHtml=prefs.map(p=>{
    const rows=byPref.get(p)||[],cas=rows.flatMap(c=>c.cas),acquired=cas.filter(c=>c.acquired).length;
    const stamps=rows.length?rows.map(c=>{
      const gotCount=c.cas.filter(x=>x.acquired).length,any=gotCount>0,allGot=c.cas.length>0&&gotCount===c.cas.length;
      const coverCa=c.cas.find(x=>x.acquired)||null,coverDesign=coverCa?displayDesign(coverCa):null,coverSrc=designUrl(coverDesign);
      const picture=coverSrc
       ?'<img data-ca-community-icon="1" data-original="'+esc(c.avatar_url||"")+'" src="'+esc(coverSrc)+'" alt="" loading="lazy">'
       :window.CACommunityIcon.img(client,c,'alt="" loading="lazy"');
      return '<button type="button" class="stamp" data-community="'+esc(c.id)+'"><div class="medal '+(any?'':'unowned')+'"><div class="medalinner"><span class="fallback">🍀</span>'+picture+'</div>'+(allGot?'<span class="check">✓</span>':'')+'</div><div class="cname">'+esc(c.name)+'</div><div class="canames">'+(c.cas.length?c.cas.slice(0,2).map(x=>'<div class="caname '+(x.acquired?'on':'off')+'">'+(x.acquired?'● ':'○ ')+esc(x.trainer_name)+'</div>').join(""):'<div class="caname off">CA未設定</div>')+(c.cas.length>2?'<div class="caname off">+'+(c.cas.length-2)+'</div>':'')+'</div></button>';
    }).join(""):'<div class="empty">Communityはありません</div>';
    return '<div class="pref"><button class="prefbtn"><div><div class="prefname">'+esc(p)+'</div><div class="sub">'+rows.length+' Community</div></div><span class="progress">取得 '+acquired+' / '+cas.length+'</span><span class="chev">⌄</span></button><div class="stamps">'+stamps+'</div></div>';
  }).join("");
  return '<div class="region"><button class="regionbtn"><span class="leaf">🍀</span><div><div class="regiontitle">'+esc(region)+'</div><div class="sub">'+rc+' Community</div></div><div class="grow"></div><span class="chev">⌄</span></button><div class="prefwrap">'+prefHtml+'</div></div>';
 }).join("");

 status.hidden=true;
 regionsEl.hidden=false;
 document.querySelectorAll(".regionbtn").forEach(b=>b.onclick=()=>b.parentElement.classList.toggle("open"));
 document.querySelectorAll(".prefbtn").forEach(b=>b.onclick=()=>b.parentElement.classList.toggle("open"));
 window.CACommunityIcon.bind(regionsEl);

 regionsEl.querySelectorAll(".stamp[data-community]").forEach(btn=>btn.addEventListener("click",()=>{
  const c=stampCommunityById.get(btn.dataset.community);
  if(!c)return;

  let selectedCa=c.cas.find(x=>x.acquired)||c.cas[0]||null;
  let selectedDesign=selectedCa?displayDesign(selectedCa):null;

  const renderModal=()=>{
   stampZoomTitle.textContent=c.name||"";

   const lines=[c.prefecture||""];
   if(selectedCa){
    lines.push((selectedCa.ca_level||"CA")+" ・ "+selectedCa.trainer_name);
    if(selectedCa.collection){
     const count=(reunionsByCollection.get(selectedCa.collection.id)||[]).length;
     lines.push("取得済み ・ 再会 ×"+count);
    }else{
     lines.push("未取得");
    }
   }
   stampZoomArea.textContent=lines.filter(Boolean).join("\n");
   stampZoomArea.style.whiteSpace="pre-line";

   const src=selectedDesign?designUrl(selectedDesign):thumb(c);
   stampZoom2D.classList.toggle("unowned",!(selectedCa&&selectedCa.collection));
   stampZoomImg.style.display=src?"block":"none";
   stampZoomImg.dataset.original=c.avatar_url||"";
   stampZoomImg.dataset.caCommunityIcon="1";
   stampZoomImg.dataset.caBound="";
   if(src)stampZoomImg.src=src;
   window.CACommunityIcon.bind(stampModalBack);
   if(selectedCa&&selectedCa.collection)void mountStampMedal3D(selectedDesign,src,c.avatar_url||"");else unmountStampMedal3D();

   const caButtons=c.cas.map(x=>'<button type="button" class="btn '+(selectedCa&&selectedCa.id===x.id?"":"line")+'" data-modal-ca="'+esc(x.id)+'" style="font-size:10px;padding:8px 10px">'+esc(x.ca_level||"CA")+' ・ '+esc(x.trainer_name)+'</button>').join("");
   let historyHtml="";
   let designHtml="";

   if(selectedCa&&selectedCa.collection){
    const reunionList=reunionsByCollection.get(selectedCa.collection.id)||[];
    const firstDate=new Date(selectedCa.collection.first_acquired_at).toLocaleDateString("ja-JP");
    historyHtml='<div class="section" style="border:1px solid #eadfce;border-radius:18px;background:#fffaf2;padding:12px;text-align:left">'
     +'<div class="tiny strong" style="color:#745c3f">🍀 初回取得</div>'
     +'<div class="strong" style="font-size:11px;margin-top:5px;color:#514941">'+esc(firstDate)+'</div>'
     +(selectedCa.collection.first_event_name?'<div class="tiny muted strong" style="margin-top:5px">🎪 '+esc(selectedCa.collection.first_event_name)+'</div>':'')
     +(selectedCa.collection.first_location?'<div class="tiny muted strong" style="margin-top:5px">📍 '+esc(selectedCa.collection.first_location)+'</div>':'')
     +'</div>'
     +'<div class="section" style="border:1px solid #dce7d5;border-radius:18px;background:#f7fbf4;padding:12px;text-align:left">'
     +'<div class="row between"><div class="tiny strong" style="color:#567848">🤝 再会</div><span class="pill">×'+reunionList.length+'</span></div>'
     +(reunionList.length
       ?'<div style="margin-top:7px">'+reunionList.map((r,i)=>'<div style="padding:8px 0;'+(i?'border-top:1px solid #e4ece0;':'')+'"><div class="tiny strong" style="color:#514941">'+esc(reunionDate(r))+'</div>'+(r.event_name?'<div class="tiny muted strong" style="margin-top:4px">🎪 '+esc(r.event_name)+'</div>':'')+(r.location?'<div class="tiny muted strong" style="margin-top:4px">📍 '+esc(r.location)+'</div>':'')+'</div>').join("")+'</div>'
       :'<div class="tiny muted strong" style="margin-top:7px">まだ再会記録はありません。</div>')
     +'</div>';
    if(selectedCa.designs.length){
     if(!selectedDesign)selectedDesign=displayDesign(selectedCa);
     const index=Math.max(0,selectedCa.designs.findIndex(x=>selectedDesign&&x.id===selectedDesign.id));
     const pinnedId=preferenceMap.get(selectedCa.collection.id)||null;
     const acquisition=selectedDesign&&selectedCa.collection.acquisition_icon_version_id===selectedDesign.id;
     const badges=(acquisition?'<span class="pill" style="background:#f4dfbd;color:#8a6536">取得時</span>':'')
      +(selectedDesign&&selectedDesign.is_current?'<span class="pill">最新</span>':'')
      +(selectedDesign&&pinnedId===selectedDesign.id?'<span class="pill blue">📌 固定中</span>':'');
     designHtml='<div class="section" style="border:1px solid #e4d7ca;border-radius:18px;background:#fff;padding:12px">'
      +'<div class="row between"><button class="btn line" data-design-dir="-1" '+(selectedCa.designs.length<2?"disabled":"")+'>‹</button>'
      +'<div class="center"><div class="tiny strong">デザイン '+(index+1)+' / '+selectedCa.designs.length+'</div><div class="tags" style="justify-content:center;margin-top:6px">'+badges+'</div></div>'
      +'<button class="btn line" data-design-dir="1" '+(selectedCa.designs.length<2?"disabled":"")+'>›</button></div>'
      +(selectedDesign?'<button class="btn line" data-pin-design="1" style="width:100%;margin-top:10px">'+(pinnedId===selectedDesign.id?"📌 固定を解除して最新デザインへ":"📌 このデザインを表紙に固定")+'</button>':'')
      +'<div class="tiny muted strong" style="margin-top:8px">新デザインは既取得者へ自動追加され、再会回数には入りません。</div>'
      +'</div>';
    }else{
     designHtml='<div class="notice section">デザイン履歴を準備中です。</div>';
    }
   }else if(selectedCa){
    designHtml='<div class="notice section">このCAスタンプは未取得です。</div>';
   }

   stampDesignControls.innerHTML='<div class="actions section" style="justify-content:center">'+caButtons+'</div>'+historyHtml+designHtml;

   stampDesignControls.querySelectorAll("[data-modal-ca]").forEach(button=>button.onclick=()=>{
    selectedCa=c.cas.find(x=>x.id===button.dataset.modalCa)||null;
    selectedDesign=selectedCa?displayDesign(selectedCa):null;
    renderModal();
   });

   stampDesignControls.querySelectorAll("[data-design-dir]").forEach(button=>button.onclick=()=>{
    if(!selectedCa||!selectedCa.designs.length)return;
    const current=Math.max(0,selectedCa.designs.findIndex(x=>selectedDesign&&x.id===selectedDesign.id));
    const dir=Number(button.dataset.designDir)||1;
    const next=(current+dir+selectedCa.designs.length)%selectedCa.designs.length;
    selectedDesign=selectedCa.designs[next]||null;
    renderModal();
   });

   const pin=stampDesignControls.querySelector("[data-pin-design]");
   if(pin)pin.onclick=async()=>{
    if(!selectedCa||!selectedCa.collection||!selectedDesign)return;
    pin.disabled=true;
    const pinnedId=preferenceMap.get(selectedCa.collection.id)||null;
    if(pinnedId===selectedDesign.id){
     const r=await client.from("stamp_collection_preferences").delete().eq("collection_id",selectedCa.collection.id);
     if(r.error){alert(r.error.message);pin.disabled=false;return}
     preferenceMap.delete(selectedCa.collection.id);
     selectedDesign=newestDesign(selectedCa);
    }else{
     const r=await client.from("stamp_collection_preferences").upsert({
      collection_id:selectedCa.collection.id,
      icon_version_id:selectedDesign.id,
      updated_at:new Date().toISOString()
     },{onConflict:"collection_id"});
     if(r.error){alert(r.error.message);pin.disabled=false;return}
     preferenceMap.set(selectedCa.collection.id,selectedDesign.id);
    }
    renderModal();
   };
  };

  renderModal();
  stampModalBack.classList.add("show");
  stampModalBack.setAttribute("aria-hidden","false");
 }));
}
function closeStampModal(){unmountStampMedal3D();stampModalBack.classList.remove("show");stampModalBack.setAttribute("aria-hidden","true")}
stampClose.onclick=closeStampModal;
stampModalBack.addEventListener("click",e=>{if(e.target===stampModalBack)closeStampModal()});
load();
})();
</script>
</body>
</html>
