<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CA Clover | Discord OAuth isolation test</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./discord-test-config.js"></script>
<style>body{font:16px/1.65 system-ui,sans-serif;max-width:560px;margin:30px auto;padding:0 18px;color:#18332b}button{padding:12px;margin:6px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f6f3;padding:12px}.warn{color:#9a3800}</style></head>
<body><h1>🍀 Discord APAC CA 認証テスト</h1>
<p class="warn">隔離環境専用。既存アカウントへの書き込み・本番サイトでの使用は禁止。</p>
<p id="status">初期化中</p>
<button id="google" disabled>テスト環境にGoogleログイン</button>
<button id="discord" disabled>Discordロール調査（管理者限定）</button>
<pre id="result"></pre>
<script>
(async()=>{
const status=document.getElementById("status"),result=document.getElementById("result");
const cfg=window.CA_CLOVER_DISCORD_TEST_CONFIG;
const callback=location.origin+location.pathname;
if(!cfg||!cfg.supabaseUrl||!cfg.supabaseAnonKey||!cfg.redirectUri||cfg.redirectUri!==callback){
 status.textContent="隔離環境の公開設定が不足・不一致です。OAuth認証を開始しません。";return;
}
if(location.hostname==="kaityo1221.github.io"||location.hostname==="ca-clover.vercel.app"){
 status.textContent="本番ホスト上では起動できません。";return;
}
const client=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const params=new URLSearchParams(location.search),code=params.get("code"),state=params.get("state"),failure=params.get("error");
if(code||failure)history.replaceState(null,"",callback);
const google=document.getElementById("google"),discord=document.getElementById("discord");
google.disabled=false;
google.onclick=async()=>{
 const {error}=await client.auth.signInWithOAuth({provider:"google",options:{redirectTo:callback}});
 if(error)status.textContent="Googleログイン開始失敗: "+error.message;
};
const {data:{session}}=await client.auth.getSession();
if(!session){status.textContent="隔離SupabaseへGoogleログインしてください。";return;}
status.textContent="隔離Supabase認証済み（ユーザーIDは画面に表示しません）";
discord.disabled=false;
discord.onclick=async()=>{
 discord.disabled=true;status.textContent="Discord認証画面へ移動します";
 const {data,error}=await client.functions.invoke("discord-ca-verify",{body:{action:"start",mode:"probe"}});
 if(error||!data?.authorizeUrl?.startsWith("https://discord.com/oauth2/authorize?")){status.textContent="試験開始拒否。Edgeと環境変数を確認してください。";discord.disabled=false;return;}
 location.assign(data.authorizeUrl);
};
if(failure){status.textContent="Discord側で認証が拒否・キャンセルされました。";return;}
if(code&&state){
 const {data,error}=await client.functions.invoke("discord-ca-verify",{body:{action:"complete",code,state}});
 if(error||!data?.probe){status.textContent="Discordロール調査に失敗しました。";return;}
 status.textContent="調査成功。表示されるIDは本人のロールID一覧です。";
 result.textContent=JSON.stringify({roleIds:data.roleIds},null,2);
}else if(code){status.textContent="OAuth stateがありません。認証を破棄しました。";}
})().catch(()=>document.getElementById("status").textContent="設定または認証エラー");
</script></body></html>
